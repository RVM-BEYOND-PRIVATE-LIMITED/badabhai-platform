name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Detect changed paths (CI-2: dorny/paths-filter) ----
  changes:
    runs-on: ubuntu-latest
    outputs:
      ai-service: ${{ steps.filter.outputs.ai-service }}
      e2e: ${{ steps.filter.outputs.e2e }}
      worker-app: ${{ steps.filter.outputs.worker-app }}
      payer-app: ${{ steps.filter.outputs.payer-app }}
      sast: ${{ steps.filter.outputs.sast }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ai-service:
              - 'apps/ai-service/**'
              # The shared profiling lexicon. `apps/ai-service/app/profiling/lexicon_data/`
              # is a byte-identical MIRROR of `packages/profiling-lexicon/data/`, which is
              # canonical (the image is built from the apps/ai-service context, so the
              # package does not exist at runtime in the container).
              #
              # Without this line, editing the canonical data would skip the ENTIRE Python
              # suite — including test_lexicon_parity.py, the check that the mirror still
              # matches and that both languages still agree. The change would report green
              # while shipping a stale mirror to production. A green check is not evidence
              # that the gate for the thing you changed actually ran.
              - 'packages/profiling-lexicon/**'
            e2e:
              - 'apps/api/**'
              - 'packages/**'
              - 'tests/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'apps/ai-service/**'
              # The job's own definition. Without this, a change to the e2e job — its
              # service containers, its migration steps, or the Matching V1 DB gates
              # below — skips the very job it edits, so the edit ships unvalidated.
              # A workflow file can obviously affect the workflow.
              - '.github/workflows/ci.yml'
            # The two Flutter apps. These filters live HERE rather than in their own
            # workflow files because those files are now `workflow_call` reusables that
            # this workflow invokes — see the `worker-app` / `payer-app` jobs below.
            worker-app:
              - 'apps/worker-app/**'
              - '.github/workflows/worker-app.yml'
              # The caller now decides whether the Flutter gate runs at all, so a change
              # to THIS file must be able to trigger it — same reasoning as the e2e entry
              # above, and the same failure if omitted.
              - '.github/workflows/ci.yml'
            payer-app:
              - 'apps/payer-app/**'
              - '.github/workflows/payer-app.yml'
              - '.github/workflows/ci.yml'
            # SAST (#773). Mirrors the filter security-scan.yml used while the job lived
            # there, plus the two workflow files that now decide whether it runs at all —
            # same reasoning as the e2e and Flutter entries above: a change to the gate
            # must be able to trigger the gate.
            sast:
              - 'apps/**'
              - 'packages/**'
              - 'tests/**'
              - '.github/workflows/sast.yml'
              - '.github/workflows/ci.yml'

  # ---- Flutter gates, INSIDE the aggregator (#718) ----
  #
  # These were standalone workflows, so `ci-required` — the only required context on
  # `main` — could not reach them: `needs:` cannot name a job in another workflow file.
  # Measured on PR #711: `Worker app (analyze / test)` FAILED while `ci-required` PASSED,
  # on a real analyzer error. The one check branch protection enforces was green, and a
  # merge on it would have landed a worker app that does not analyze.
  #
  # That gap is worse than it sounds for these two specifically: apps/worker-app needs
  # Dart >= 3.9.0, so a dev on an older Flutter cannot run `analyze`, `test`, or even
  # `pub get`. CI is the ONLY executor for this code, and an ungated CI is no gate.
  #
  # Converting them to `workflow_call` reusables and calling them here puts them under
  # `needs:` without duplicating the definitions, and without a second run per PR (their
  # own `push`/`pull_request` triggers are removed in the same change). The check names
  # become `worker-app / Worker app (analyze / test)`; nothing references them by name —
  # branch protection requires `ci-required` alone.
  worker-app:
    needs: changes
    if: needs.changes.outputs.worker-app == 'true'
    uses: ./.github/workflows/worker-app.yml

  payer-app:
    needs: changes
    if: needs.changes.outputs.payer-app == 'true'
    uses: ./.github/workflows/payer-app.yml

  # ---- SAST, INSIDE the aggregator (#773) ----
  #
  # Same structural fix as the two Flutter jobs above, for the same reason. semgrep lived in
  # security-scan.yml, so `ci-required` could not `needs:` it and a red SAST sat beside a
  # green required check. That fired twice in one day — #763 and #768 — and both were caught
  # by a human reading the checks rather than by the gate.
  #
  # `baseline-ref` makes this the DIFF gate: only findings the PR introduces fail it. The
  # whole-tree scan still happens weekly from security-scan.yml, so the strong guarantee is
  # kept, just off the critical path (#774). Cost of this edge: ~1m30s on every code PR.
  sast:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.sast == 'true'
    uses: ./.github/workflows/sast.yml
    with:
      baseline-ref: ${{ github.event.pull_request.base.sha }}

  # ---- TypeScript monorepo: lint, typecheck, test, build ----
  node:
    name: Node (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        # No `version:` here on purpose — it would conflict with the
        # `packageManager` field in package.json (ERR_PNPM_BAD_PM_VERSION).
        # package.json's `packageManager: pnpm@11.5.2` is the single source.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CI-5b: persist turbo's local task cache across runs. turbo@^2.3.3 (v2,
      # resolves 2.9.x) writes its cache to `.turbo/cache` under the repo root —
      # turbo.json sets no `cacheDir` override — so caching `.turbo` captures it.
      # The sha key saves a fresh entry per run; `restore-keys` gives every run the
      # most recent prior cache. This accelerates the turbo-run tasks below
      # (typecheck / test / build — `pnpm lint` is plain eslint, not turbo). No CI
      # invocation passes `--force` or sets TURBO_FORCE, so restored entries are
      # actually consumed. Nothing secret-bearing is cached: `.turbo` holds task
      # outputs (dist/, .next/) and task logs only.
      - name: Cache turbo
        # v6 is the latest major (v6.1.0 at time of writing) and matches this repo's
        # latest-major convention for actions/* (checkout@v7, setup-node@v7). v4 ran on
        # the deprecated node20 runtime — that annotation is what this bump clears.
        # (v5 = node24 runtime, v6 = ESM migration; both fine on GitHub-hosted runners.)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Lint
        run: pnpm lint

      # Design-system adherence (DS4.3): the token gate — NO raw hex/px in payer-web UI
      # source — is enforced by the Lint step above (ESLint `no-restricted-syntax`, since
      # oxlint does not implement that rule). This is the fast oxlint supplementary pass
      # (correctness) over apps/payer-web/src. Any payer-web UI change should also run the
      # `bb-ui-review` skill (see the PR checklist).
      - name: Design-system adherence — oxlint (payer-web)
        run: pnpm lint:oxlint

      - name: Typecheck
        run: pnpm typecheck

      # TD9: --coverage flags enforce the vitest coverage thresholds pinned in
      # apps/api/vitest.config.ts (lines≥75, functions≥75, branches≥73, statements≥75).
      # Without this flag, thresholds are configured but never checked in CI.
      - name: Test (with coverage thresholds)
        run: pnpm test -- --coverage

      # The question-pack deploy gate, in its DB-FREE mode.
      #
      # IT RAN IN NO WORKFLOW AT ALL until this line, in either mode — and that is precisely how
      # its own bug survived: `verify-question-packs.ts` called the corpus validator with no
      # `opts`, so the "target_field is in the RFS vocabulary" rule silently did not run, and the
      # UNIVERSAL pack shipped with four invented field ids. Library-level tests could not have
      # caught it, because the defect was in the CLI's call, not in the validator.
      #
      # `--corpus` needs no Postgres, so it belongs in this job rather than the DB-backed one
      # below; the live-database checks stay on the deploy path.
      - name: Verify question-pack corpus (db:verify:packs --corpus)
        run: pnpm --filter @badabhai/db db:verify:packs --corpus

      # The occupation-retrieval accuracy gate (OIE Phase 9). Like `db:verify:packs` before
      # Phase 8, this script exits 1 on failure and RAN IN NO WORKFLOW AT ALL — an acceptance
      # gate nobody executes is documentation, not a gate.
      #
      # THE FLOOR IS RE-DERIVED HERE, and that is the Phase 9 calibration act for this metric.
      # The script's built-in default is 60%, the Phase 2 authoring target. We measure 97.0%.
      # A gate at 60 against a measurement of 97 cannot catch a regression: deleting a third of
      # the vernacular alias corpus would still pass it. 95 sits just under the real number, so
      # a genuine regression trips while routine corpus growth does not.
      #
      # FAMILY PRECISION STAYS AT THE SCRIPT'S 97% DEFAULT, deliberately un-raised even though
      # we measure 98.2%. 0.97 is the PRODUCT requirement from the plan; tightening the gate to
      # the current measurement would fail the build for a corpus change that still meets the
      # bar the product actually asked for.
      #
      # Needs no Postgres and no provider — committed corpus + committed gold set, embeddings
      # off — so the number is reproducible from a bare checkout.
      - name: Occupation retrieval accuracy (db:eval:occupation)
        run: pnpm --filter @badabhai/db db:eval:occupation --min-hit-rate 95

      # Offline self-test for the staging /health + mock-OTP smoke (scripts/staging-smoke.mjs).
      # Plain node:test, NO network — locks the load-bearing dev_otp-FAIL gate + the
      # no-secret-leak guarantee so a refactor can't silently weaken them.
      - name: Smoke self-test (staging)
        run: node --test scripts/staging-smoke.test.mjs

      - name: Build
        run: pnpm build

  # ---- Python AI service: pytest + ruff ----
  ai-service:
    name: AI service (pytest / ruff)
    if: needs.changes.outputs.ai-service == 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          # CI-5a: cache pip's package cache. The job installs requirements-dev.txt,
          # which chains `-r requirements.txt` — so the key must hash BOTH files
          # (a runtime-deps change alone must rotate the key, or actions/cache
          # never re-saves on a hit and new wheels re-download every run). NOTE:
          # `cache-dependency-path` is ALWAYS repo-root-relative — the job's
          # `working-directory` default does not apply to it — hence the full path.
          cache: "pip"
          cache-dependency-path: apps/ai-service/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

  # ---- ai-service image builds AT ALL (TD81) ----
  # `build-and-push-image` below is gated `push && refs/heads/main`, so it NEVER runs on
  # a PR. Without this job a broken apps/ai-service/Dockerfile would first be discovered
  # ON MAIN — where it also fails `deploy-lightsail`, i.e. exactly the TD81 failure class
  # this PR exists to remove (a green signal hiding an untested artifact).
  #
  # BUILD ONLY, never push: no registry credentials, no `packages: write`, no tags. It
  # answers "does this Dockerfile still produce an image?" and nothing else. Cheap
  # (the ai-service image is a pip install over a slim base — no WeasyPrint/native
  # stack like apps/api) and it reuses the SAME gha cache scope as the push job, so a
  # PR build warms the layers main then reuses.
  #
  # Deliberately NOT a `needs:` of anything: it is an independent signal, and it must be
  # able to fail without masking the pytest/ruff result above.
  # CI-2: path-gated to only run when ai-service code changes.
  ai-service-image:
    name: AI service (image builds)
    if: needs.changes.outputs.ai-service == 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the ai-service image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: apps/ai-service
          file: apps/ai-service/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service

  # ---- Flutter worker app ----
  # Moved to its own path-filtered, BLOCKING workflow: .github/workflows/worker-app.yml
  # (runs only on changes under apps/worker-app; pinned Flutter; no continue-on-error).

  # ---- Phase 1 E2E gate: real Postgres + Redis, migrate, drive the full flow ----
  # Blocking: a PR FAILS if the end-to-end onboarding journey (login → consent →
  # multi-turn interview → state persistence → AUTO extraction → extraction_completed
  # → AI-metadata persistence → no-raw-phone → confirm → resume) regresses.
  # The FastAPI AI service is intentionally NOT started — the API falls back to its
  # safe mock (real_call=false), so the flow + its events/metadata complete offline.
  # CI-2: path-gated to only run when API, packages, or ai-service code changes.
  e2e:
    name: E2E (Phase 1 onboarding flow)
    if: needs.changes.outputs.e2e == 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector-enabled pg16 (official image, built on postgres:16): the migration
        # chain runs `CREATE EXTENSION vector` (0001 — worker_profiles.embedding + HNSW),
        # which a plain postgres:16 image cannot satisfy ("extension vector is not available").
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: badabhai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Service-container Postgres/Redis (no special chars → no URL-encoding needed).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/badabhai_test
      REDIS_URL: redis://localhost:6379
      # test → PII crypto guard permits the dev defaults (no real secrets in CI).
      NODE_ENV: test
      API_PORT: "3001"
      RUN_E2E: "1"
      # The per-IP OTP cap (OTP_MAX_SENDS_PER_HOUR, default 5) is also applied per
      # egress IP. Every e2e test logs in via mock OTP from the SAME CI IP, so the whole
      # suite shares one hourly budget — raise it here so the cap (a production abuse
      # backstop, meaningless for a single shared CI IP) doesn't 429 the suite. Real
      # deployments keep the default; this only affects the CI e2e job.
      OTP_MAX_SENDS_PER_HOUR: "1000"
      # Same reasoning for the per-phone DAILY backstop (TD60): one CI run shares
      # phones/IPs across the whole suite, so keep it out of the way here too.
      OTP_MAX_SENDS_PER_DAY: "1000"
      # Shared secret for InternalServiceGuard on the ops/backend-only resume routes
      # (GET /resume/:id, …). Job-level so the API process AND the e2e test both see it;
      # the test sends it as x-internal-service-token.
      INTERNAL_SERVICE_TOKEN: e2e-internal-service-token
      # ---- D-3 test-login seam ----
      # OTP is real-only: SMS_PROVIDER is a z.literal("fast2sms") and no dev_otp echo
      # exists at any boundary, so an e2e run CANNOT obtain a code with the dummy key
      # above. `POST /auth/test-login` is the seam built for exactly that, and it WORKS —
      # measured on run 30699229574, where contact-unlock minted sessions and F-3 passed
      # end to end before that suite was re-gated for an unrelated reason (TD129: the API
      # cannot read the locked `workers`/`events` tables in this job).
      #
      # Kept armed although no suite currently consumes it: it is the only way any future
      # e2e can authenticate a worker, and the seam is inert unless a test sends the
      # header, so arming it costs nothing and re-deriving this block later is rework.
      #
      # Safe to arm HERE and nowhere else: assertAuthConfig refuses to boot when this is
      # enabled outside development/test/staging (NODE_ENV is `test` above), and refuses
      # again if the token is under 32 chars. The value below is a throwaway CI literal —
      # it grants nothing beyond this ephemeral job's own database.
      TEST_LOGIN_ENABLED: "true"
      TEST_LOGIN_TOKEN: e2e-test-login-token-not-a-secret-32ch
      # Set EXPLICITLY rather than inherited. The default is 200/day and it is a GLOBAL,
      # IP-INDEPENDENT counter — unlike OTP_MAX_SENDS_PER_HOUR above, raising the per-IP
      # cap does not cover it. A fresh Redis per job makes 200 probably sufficient today,
      # but "probably sufficient" is how a suite starts failing on the run that adds the
      # test which crosses it.
      TEST_LOGIN_MAX_PER_DAY: "1000"
      # OTP is REAL-ONLY (Fast2SMS for worker SMS, ZeptoMail for payer email). The API now
      # calls assertAuthConfig (Fast2SMS creds REQUIRED in every env) + assertPayerAuthConfig
      # (default email_otp + zeptomail → email creds REQUIRED) at boot, so it FAILS CLOSED
      # without these. Supply obviously-FAKE placeholders so the process BOOTS — no real send
      # ever happens (the e2e never reaches a real provider; the dev_otp login path is gone,
      # so the OTP-login journeys are .skip). NEVER real keys.
      FAST2SMS_API_KEY: ci-dummy-fast2sms-api-key
      FAST2SMS_SENDER_ID: CIDUMMY
      FAST2SMS_DLT_TEMPLATE_ID: ci-dummy-dlt-template
      ZEPTOMAIL_API_TOKEN: ci-dummy-zeptomail-token
      ZEPTOMAIL_MAIL_AGENT: ci-dummy-mail-agent
      EMAIL_FROM_ADDRESS: ci-dummy@example.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build only the API and its workspace deps — not the whole monorepo (the
      # `node` job owns lint/typecheck/unit-test/full-build; we just need a runnable API).
      - name: Build API (+ workspace deps)
        run: pnpm --filter "@badabhai/api..." build

      # Migrations 0003/0004 REVOKE grants from Supabase's anon/authenticated/
      # service_role roles, which don't exist on a plain Postgres image. Pre-create
      # them (idempotent) so the migration chain applies — and so the RLS regression
      # test can exercise `SET ROLE anon/...` denials.
      - name: Create Supabase-compatible roles
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DO $$ BEGIN CREATE ROLE anon NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$; DO $$ BEGIN CREATE ROLE authenticated NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$; DO $$ BEGIN CREATE ROLE service_role NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;'

      # Fresh DB → applies the full migration chain from scratch, which also
      # validates migrations on every PR. The onboarding flow self-seeds (it creates
      # its own worker per run via a unique phone), so no worker seed is needed.
      - name: Apply migrations
        run: pnpm --filter @badabhai/db db:migrate

      # Catalog jobs ARE needed: the alpha swipe-to-apply e2e (ADR-0009) reads a
      # seeded job source. Idempotent; PII-free; safe to run before every e2e.
      - name: Seed alpha jobs
        run: pnpm --filter @badabhai/db db:seed:jobs

      # OIE Phase 8 — THE INTERVIEW NOW READS THESE TABLES ON EVERY TURN.
      #
      # Before the cutover the chat turn called the ai-service and needed no reference
      # data at all; a migrated-but-unseeded database was fine. It is not fine now:
      # `ProfilingOrchestrator.resolvePacks` fails closed when the UNIVERSAL pack is
      # missing, so without these steps every e2e chat turn returns the unavailable line
      # and the failure looks like a broken orchestrator rather than an unseeded database.
      #
      # Occupations first, then packs: `profiling_family_binding` references ISCO unit
      # codes that only exist once the domains are in.
      #
      # Idempotent and PII-free — public occupation reference data and reviewed interview
      # copy. Deterministic ids make a re-run a row-level no-op.
      #
      # `--apply` IS REQUIRED. Every script in this family is DRY-RUN by default: without
      # the flag they print the corpus they would write, exit 0, and touch nothing. That is
      # not a hypothetical — the first version of these two steps omitted it, both went
      # green, and `db:verify:packs` below then failed with "the pack tables are EMPTY".
      # A seed step that passes while seeding nothing is worse than no seed step, because
      # the green tick is the thing you would trust. Same reasoning, and the same flag, as
      # `db:seed:match:vocabulary` further down.
      - name: Seed job domains (occupation catalogue)
        run: pnpm --filter @badabhai/db db:seed:domains --apply

      # NORMALIZE BETWEEN THE SEED AND ANY RETRIEVAL — and this ran in NO workflow at all.
      #
      # `verify-job-domains.ts` states it plainly: an un-normalized alias is "invisible to L0/L2
      # retrieval". So CI seeded the catalogue and then exercised an occupation ladder missing its
      # exact- and trigram-match keys, degrading to whatever still happened to hit — which passes,
      # just less accurately, which is the worst kind of gap because nothing goes red.
      - name: Normalize occupation aliases
        run: pnpm --filter @badabhai/db db:normalize:aliases --apply

      - name: Seed question packs
        run: pnpm --filter @badabhai/db db:seed:packs --apply

      # The deploy gate, run against the LIVE database rather than the corpus. The
      # `--corpus` variant in the node job checks the JSONL; this one checks what actually
      # landed — including "exactly one active pack per (family, locale)" and "a universal
      # pack exists", neither of which a corpus read can prove.
      - name: Verify question packs (db:verify:packs)
        run: pnpm --filter @badabhai/db db:verify:packs

      # The catalogue's own gate, and it ran in no workflow either. It is what turns the
      # normalize step above from a hopeful extra into a checked one: it fails on aliases that
      # would be invisible to L0/L2 retrieval, which is the exact degradation nothing else
      # notices.
      - name: Verify occupation catalogue (db:verify:domains)
        run: pnpm --filter @badabhai/db db:verify:domains

      # D1 — the Matching V1 match vocabulary. Needed here for TWO reasons, and the second
      # is the load-bearing one:
      #   1. It is reference data only — `MATCH_SKILLS` + the symmetric `skill_related`
      #      pairs from @badabhai/taxonomy. No worker data, no PII, deterministic,
      #      checked-in (invariant #4). Re-running is a row-level no-op.
      #   2. It writes THE SINGLE ACTIVE `match_config` ROW. Migration 0057 ships the
      #      table STRUCTURE and deliberately seeds no values, and no migration anywhere
      #      INSERTs into `match_config` — D1 is the only writer. Without it the verifier
      #      below fails check G ("expected exactly 1 active match_config row, found 0")
      #      and exits 1. Measured by reading every check in verify-match-v1.ts, not
      #      assumed: on a migrated-but-unseeded database G is the ONLY failure.
      # `--apply` is required — every script in this family is dry-run by default.
      - name: Seed Matching V1 vocabulary (D1)
        run: pnpm --filter @badabhai/db db:seed:match:vocabulary --apply

      # The Matching V1 go/no-go verifier, which until now ran NOWHERE in CI — it was a
      # script the runbook tells a human to run by hand after the migration train, and
      # nothing checked that it still passes against the schema we actually ship.
      #
      # STRICTLY READ-ONLY (SELECTs + EXPLAINs; there is no --apply). It asserts the
      # things a unit test structurally cannot: skill_related symmetry (the table has NO
      # symmetry trigger, so this is one of only two places that guarantee holds), closed-
      # vocabulary integrity, tier truthfulness, the E8 tenure clamp, that the covering
      # indexes EXIST and kept their hand-appended INCLUDE payloads, and that 0059's
      # widened boost-tier CHECK admits all four codes.
      #
      # It runs BEFORE the test suites below on purpose: those seed and delete their own
      # fixtures, and a verifier that ran afterwards would be reading whatever a failed
      # cleanup left behind. Here its input is exactly "the migration train + D1", which
      # is the state the runbook actually gates on.
      - name: Verify Matching V1 schema + vocabulary (db:verify:match-v1)
        run: pnpm --filter @badabhai/db db:verify:match-v1

      # ---- Matching V1 DB-backed release gates (ADR-0036) ----
      # These suites exist, are correct, and until #538 NEVER RAN in CI: each is
      # `describe.skipIf(process.env.RUN_DB_TESTS !== "1")`, and RUN_DB_TESTS was set
      # nowhere under .github/ (TD122). A skipped gate is a disclosed gap, not a pass.
      #   * rank-parity  — pins the `ORDER BY` in MatchFeedRepository.listCandidates to
      #                    `rankKeyCompare` in @badabhai/match-engine. The V1 rank tuple
      #                    lives in exactly those two places and a database cannot call a
      #                    TypeScript comparator, so the duplication is unavoidable; this
      #                    is the only thing that catches the two drifting apart.
      #   * boost-fences — the three ADR-0036 §7 fences (boost never passes the skill
      #                    gate, permutes order only, never touches the company's
      #                    candidate list). All three are properties of the SQL, so they
      #                    are unprovable without a real database.
      #   * apply-freeze — E16, "worker edits his profile after applying → the company's
      #                    list does not move". The freeze is the `ON CONFLICT DO UPDATE`
      #                    CASE in MatchApplyService.upsertDecision; the unit suite can
      #                    only assert that CASE text is PRESENT against a fake db. That
      #                    it EVALUATES as claimed — keeps on a re-apply, writes on a
      #                    skip→apply flip, and cannot tear under two racing applies — is
      #                    a property of Postgres. It uses two connection pools on purpose
      #                    (postgres.js pipelines one pool, which would fake the race).
      #   * current-profile-order — B-8b, "which `worker_profiles` row IS this worker's
      #                    profile". Seven readers each answered differently; one had no
      #                    ORDER BY at all and one had no per-worker dedup, so a
      #                    re-interviewed worker entered the payer pool twice. Every claim
      #                    is a property of an ORDER BY / DISTINCT ON, so a fake db can only
      #                    show the expression is present, never that it evaluates.
      #
      # They need nothing but a MIGRATED Postgres, which the steps above already built:
      # this job's service container gets the whole chain (0000–0059, journal-driven)
      # applied from scratch on every run, so these gates are independent of which
      # migrations any deployed database has seen. Each suite seeds its own PII-free
      # fixtures and deletes them in afterAll, and neither needs the API process — hence
      # running here, before the API boots.
      #
      # RUN_DB_TESTS is scoped to THIS STEP. The `node` job runs the same apps/api suite
      # with no database and must keep skipping these three files (TD126).
      # No --coverage on purpose: the thresholds are a whole-suite gate owned by the
      # `node` job, and a three-file run cannot meet them.
      - name: DB-backed gates (rank parity + boost fences + apply freeze + current profile)
        env:
          RUN_DB_TESTS: "1"
        run: |
          set -eo pipefail
          # NO `--` before the filters: pnpm forwards it to the script verbatim, so
          # `test -- rank-parity` runs `vitest run -- rank-parity`, where vitest
          # ignores the filter and reruns the whole 2820-test suite. Measured, not
          # assumed — that is what the first push of this branch actually did.
          pnpm --filter @badabhai/api run test rank-parity boost-fences apply-freeze current-profile-order 2>&1 | tee db-gates-raw.log
          sed -e 's/\x1b\[[0-9;]*m//g' db-gates-raw.log > db-gates.log

          # (1) EACH GATE MUST HAVE EXECUTED. `describe.skipIf` makes an unarmed run
          #     exit 0 reporting "16 skipped" — precisely how these gates sat green for
          #     their whole life while proving nothing. Assert per FILE, because a
          #     suite-wide "some test passed" check is satisfied by unrelated tests.
          for f in rank-parity boost-fences apply-freeze current-profile-order; do
            line=$(grep -E "src/(match|profiles)/${f}\.test\.ts" db-gates.log | head -1 || true)
            if [ -z "$line" ]; then
              echo "::error::${f}.test.ts did not run at all — the vitest file filter matched nothing."
              exit 1
            fi
            case "$line" in
              *skipped*)
                echo "::error::${f}.test.ts SKIPPED — RUN_DB_TESTS is not reaching vitest, so this gate would have passed vacuously."
                exit 1
                ;;
            esac
          done

          # (2) …AND ONLY THE GATES. Guards the arg-forwarding bug above: if the filter
          #     stops reaching vitest, this step silently becomes a slow duplicate of the
          #     `node` job (and check (1) starts passing on unrelated tests). Update the
          #     expected count when adding a gate file to the command above.
          if ! grep -qE 'Test Files +4 passed \(4\)' db-gates.log; then
            echo "::error::Expected exactly the 4 gate files to run — the vitest file filter is not reaching vitest."
            grep -E 'Test Files|      Tests ' db-gates.log || true
            exit 1
          fi

      - name: Start API and run the Phase 1 E2E suite
        run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          API_PID=$!
          echo "API started (pid $API_PID) — waiting for /health…"
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/health >/dev/null 2>&1; then
              echo "API healthy after ${i}s"; break
            fi
            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "::error::API process exited during startup"; cat api.log; exit 1
            fi
            sleep 1
          done
          curl -sf http://localhost:3001/health >/dev/null \
            || { echo "::error::API never became healthy"; cat api.log; exit 1; }

          set +e
          pnpm --filter @badabhai/e2e test
          E2E_EXIT=$?
          set -e

          echo "----- API log (tail) -----"; tail -n 80 api.log || true
          kill "$API_PID" 2>/dev/null || true
          exit $E2E_EXIT

  # ---- CI-2 aggregator: branch protection requires THIS job, not individual ones ----
  # Always runs (if: always()), needs every PR-stage job. Passes only when every needed
  # job either succeeded or was skipped (path-filtered). This lets branch protection
  # require a single `ci-required` check instead of separately listing every job — the
  # owner must flip branch protection to require only `ci-required` for this to work.
  ci-required:
    if: always()
    # worker-app / payer-app added in #718, sast in #773. A path-filtered job that does not run reports
    # `skipped`, which this check treats as fine — only `failure`/`cancelled` fail it.
    needs: [changes, node, ai-service, ai-service-image, e2e, worker-app, payer-app, sast]
    runs-on: ubuntu-latest
    steps:
      - name: Check for CI failures
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "All CI jobs passed or were skipped"

  # ---- Build and Push Docker Images (api + ai-service) ----
  # TD81(a): this job now builds TWO images. The ai-service steps live in the SAME
  # job rather than a parallel one on purpose: the checkout, the buildx driver and
  # the GHCR login are already paid for here, and — the load-bearing reason — the
  # deploy job below pulls BOTH images, so one job means "images ready" stays a
  # single, atomic `needs:` edge instead of two that can half-succeed.
  # The job KEY and `name:` are deliberately unchanged (a rename would silently
  # break any branch-protection required check that references them by name).
  build-and-push-image:
    name: Build & Push Docker Image
    needs: [node, ai-service, e2e]
    # BUG FIXED HERE: this `if:` used to be the plain boolean
    #   `github.event_name == 'push' && github.ref == 'refs/heads/main'`
    # with no `always()`/`success()`/`failure()`/`cancelled()` anywhere in it. Per GitHub
    # Actions semantics, a job-level `if:` with none of those functions gets an IMPLICIT
    # `&& success()` ANDed across every job in `needs:` — and a job that is `skipped`
    # (not run) never satisfies `success()`. `ai-service` AND `e2e` are BOTH path-filtered
    # by the `changes` job above and report `skipped` on most pushes to main: `ai-service`
    # skips unless `apps/ai-service/**` or `packages/profiling-lexicon/**` changed, and
    # `e2e` skips unless `apps/api/**`, `packages/**`, `tests/**`, the lockfile/workspace/
    # turbo config, `apps/ai-service/**`, or this workflow file changed — so a frontend-
    # only, docs-only, or infra-only push skips BOTH. Net effect: this job (and
    # `deploy-lightsail` below it, via `needs: [build-and-push-image]`) silently skipped
    # for the large majority of pushes to main — no new images built or pushed, nothing
    # deployed to Lightsail — even though the job's own explicit condition (push to main)
    # was true. Confirmed via `gh run view` on real runs.
    #
    # `always()` removes that implicit success() gate; the explicit checks below become
    # the ONLY gate, mirroring the `ci-required` idiom above (a path-filtered job's `skip`
    # is fine, its `failure`/`cancelled` is not): `node` carries no path filter of its own
    # (it always runs) so it must have actually succeeded; `ai-service` and `e2e` must
    # each have either succeeded or been skipped by the path filter — never have actually
    # run and failed, and never have been cancelled.
    if: >-
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.node.result == 'success' &&
      (needs.ai-service.result == 'success' || needs.ai-service.result == 'skipped') &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - name: Set up Docker Buildx
        # REQUIRED for CD-5: the runner's stock `docker` driver CANNOT export a
        # `type=gha` cache — buildx hard-errors before the build starts. This
        # action configures the docker-container driver, which can.
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        env:
          # CD-4: pin the short-sha length so the `type=sha` tag provably matches the
          # deploy job's `cut -c1-7` below (7 IS metadata-action's default — pinned
          # against upstream drift; harmless on versions predating the env var).
          DOCKER_METADATA_SHORT_SHA_LENGTH: "7"
        with:
          images: ghcr.io/${{ github.repository }}/badabhai-api
          # CD-4: declaring `tags:` replaces ALL metadata-action defaults, so the
          # previously-implicit branch behavior is now declared explicitly:
          #   type=ref,event=branch -> the mutable :main tag (humans / local pulls)
          #   type=sha              -> the IMMUTABLE :sha-<short7> tag (default
          #                            prefix "sha-", format=short) that the deploy
          #                            pins. Rollback = API_IMAGE=...:sha-<prev> +
          #                            compose up (docs/rollback-guide.md).
          tags: |
            type=ref,event=branch
            type=sha
          
      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # CD-5: GitHub Actions layer cache (needs the buildx docker-container
          # driver set up above). The expensive layer is the runtime stage's
          # WeasyPrint apt+pip install (Pango/cairo native stack in
          # apps/api/Dockerfile) — the gha cache holds it across runs (10 GB
          # Actions Cache quota, separate from the Packages quota). mode=max also
          # caches intermediate (builder) stages — NOTE: the builder stage churns
          # multi-GB per run (full monorepo + node_modules), so if the 10 GB quota
          # starts evicting the turbo/pip caches (CI-5), drop to mode=min: it
          # caches final-image layers only, which STILL keeps the WeasyPrint
          # apt+pip layer (it lives in the final runtime stage).
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- TD81(a): the FastAPI ai-service image ----
      # Same registry, same tag scheme, same immutability contract as the api
      # above — `type=sha` gives the `sha-<short7>` tag the deploy pins, and
      # DOCKER_METADATA_SHORT_SHA_LENGTH is pinned again here so BOTH images'
      # short-sha tags provably match the deploy's `cut -c1-7` (they must, since
      # one commit sha drives both exports).
      - name: Extract metadata (tags, labels) for the ai-service image
        id: meta-ai
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: "7"
        with:
          images: ghcr.io/${{ github.repository }}/badabhai-ai-service
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push the ai-service Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          # CONTEXT IS apps/ai-service, NOT the repo root — this is the one place
          # the two images differ structurally. The service is pure Python with no
          # workspace dependencies, so it needs none of the monorepo, and
          # apps/ai-service/.dockerignore (not the root one) filters the context.
          # See the header of apps/ai-service/Dockerfile.
          context: apps/ai-service
          file: apps/ai-service/Dockerfile
          push: true
          tags: ${{ steps.meta-ai.outputs.tags }}
          labels: ${{ steps.meta-ai.outputs.labels }}
          # CD-5: a DISTINCT gha cache scope. Two builds in one job sharing the
          # default scope would evict each other's layers every run, so the api's
          # expensive WeasyPrint layer would stop being cached the moment this
          # build landed. This image's cacheable layer is the pip install of
          # requirements-ai.txt; it is small, so mode=min would also be defensible
          # — mode=max is kept for symmetry with the api build. If the 10 GB
          # Actions Cache quota starts evicting the turbo/pip caches (CI-5), this
          # is the cheaper of the two to drop to mode=min first.
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service

  # ---- AWS Lightsail Deployment ----
  deploy-lightsail:
    name: Deploy to AWS Lightsail
    # This job's plain `if:` (no `always()`) is CORRECT as-is, unlike the old
    # `build-and-push-image` above: its only dependency is `build-and-push-image`
    # itself, which is no longer a path-filtered job — it now either (a) actually runs
    # and finishes `success`/`failure`, or (b) is `skipped` only when ITS OWN gate above
    # legitimately said no (not a push to main, or `node`/`ai-service`/`e2e` genuinely
    # failed/was cancelled). Case (b) is exactly when this job SHOULD also skip, so the
    # implicit `success()` here does the right thing without needing the same idiom.
    needs: [build-and-push-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # CD-1: the job token needs packages:read so the BOX can docker-login with the
    # ephemeral GITHUB_TOKEN below (only one permissions: block existed in this file
    # — the build job's — so this job inherited the repo default, which may exclude
    # packages). contents:read is the safe floor.
    permissions:
      contents: read
      packages: read
    # CD-1 / Gate D1: scopes environment secrets + makes the deploy target explicit
    # in the Actions UI. Named "staging" per the current D1 default — if the owner
    # rules this box is PRODUCTION, rename AND add a required reviewer to the
    # environment (protection rules; repo is now PUBLIC so they are available on Free).
    environment: staging
    steps:
      - name: Deploy via SSH
        # SHA-pinned (was the mutable v1.0.3 tag): 12 production secrets now flow
        # through this action's container — a hijacked tag would see them all.
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        # CD-1b: the docker-compose.staging.yml `${VAR:?}` gate reads the BOX's
        # shell environment — GitHub environment/repo secrets do NOT reach it on
        # their own (the first health-gated run proved it: INTERNAL_SERVICE_TOKEN
        # was SET as an environment secret yet compose failed "missing a value").
        # This env + `envs:` pair is the bridge: each var resolves environment-
        # scoped secret first, repo secret as fallback, and drone-ssh exports the
        # names listed in `envs:` into the remote session. Values never print —
        # compose reads them from the environment and the script never echoes them.
        # WARNING: NEVER add `debug: true` (prints the export lines WITH values, and the
        # quote-escaping defeats Actions masking) or `allenvs: true` (would export
        # INPUT_KEY — the SSH private key — into the remote session).
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PII_ENCRYPTION_KEY: ${{ secrets.PII_ENCRYPTION_KEY }}
          PII_HASH_PEPPER: ${{ secrets.PII_HASH_PEPPER }}
          PIN_PEPPER: ${{ secrets.PIN_PEPPER }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          INTERNAL_SERVICE_TOKEN: ${{ secrets.INTERNAL_SERVICE_TOKEN }}
          FAST2SMS_API_KEY: ${{ secrets.FAST2SMS_API_KEY }}
          FAST2SMS_SENDER_ID: ${{ secrets.FAST2SMS_SENDER_ID }}
          FAST2SMS_DLT_TEMPLATE_ID: ${{ secrets.FAST2SMS_DLT_TEMPLATE_ID }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          # `timeout` = SSH connection timeout; `command_timeout` = the script's
          # run budget (appleboy default is 10m — pinned explicitly so the health
          # poll below can never be silently cut short by an upstream default change).
          timeout: 10m
          command_timeout: 10m
          envs: JWT_SECRET,PII_ENCRYPTION_KEY,PII_HASH_PEPPER,PIN_PEPPER,ADMIN_JWT_SECRET,DATABASE_URL,REDIS_URL,INTERNAL_SERVICE_TOKEN,FAST2SMS_API_KEY,FAST2SMS_SENDER_ID,FAST2SMS_DLT_TEMPLATE_ID,CORS_ALLOWED_ORIGINS
          script: |
            set -e
            # CD-1: never leave a registry credential (even an expired job token)
            # in the box's ~/.docker/config.json — logout on EVERY exit path.
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            echo "Starting deployment..."
            cd ~/deployments/badabhai-platform
            echo "Pulling latest code from main..."
            git pull origin main
            echo "Logging into GHCR..."
            # CD-1: ephemeral job token (dies with the run) instead of a long-lived
            # PAT stored as a repo secret next to a PUBLIC repo. The package is
            # PRIVATE (anonymous pull 401-verified), so a login IS required; the
            # box only ever pulls during a deploy run, so the ephemeral token
            # suffices — and a leaked box can no longer pull outside a run.
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # CD-4: pin the IMMUTABLE per-commit tag pushed by build-and-push-image
            # (metadata-action type=sha -> prefix "sha-" + short 7-char sha, length
            # pinned via DOCKER_METADATA_SHORT_SHA_LENGTH above). Rollback = export
            # the previous sha tag and re-run compose up (docs/rollback-guide.md).
            export API_IMAGE="$(echo "ghcr.io/${{ github.repository }}/badabhai-api:sha-$(echo '${{ github.sha }}' | cut -c1-7)" | tr '[:upper:]' '[:lower:]')"
            # TD81(a): the ai-service image, same commit, same immutability rule.
            # This export is NOT optional even for an api-only concern: compose
            # interpolates the WHOLE overlay before it filters by service or
            # profile, so docker-compose.staging.yml's `${AI_SERVICE_IMAGE:?}`
            # would fail EVERY command below — including `pull api` — if it were
            # missing. Same reason a rollback must export both (docs/rollback-guide.md).
            export AI_SERVICE_IMAGE="$(echo "ghcr.io/${{ github.repository }}/badabhai-ai-service:sha-$(echo '${{ github.sha }}' | cut -c1-7)" | tr '[:upper:]' '[:lower:]')"
            echo "Deploying image: $API_IMAGE"
            echo "Deploying image: $AI_SERVICE_IMAGE"

            # CD-0: base + staging overlay. The overlay pins NODE_ENV=production and
            # makes every production-required secret a fail-loud ${VAR:?} — a box
            # without real secrets FAILS HERE at compose interpolation (job goes red)
            # instead of booting on the public dev defaults. `--no-deps api` on `up`
            # is load-bearing: it is what keeps the compose-internal throwaway
            # postgres/adminer from ever starting on this box (see the depends_on
            # note in docker-compose.staging.yml) — staging's DATABASE_URL is the
            # real (Supabase) Postgres, never the compose-internal one. Passing -f
            # explicitly ALSO means the tracked docker-compose.override.yml (a
            # local-dev-only postgres remap) is NOT auto-loaded here.
            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.staging.yml --profile api"

            # CD-6: RECLAIM DISK BEFORE PULLING. Every deploy pulls a NEW immutable
            # `sha-<short7>` image and nothing ever removed the old one, so the box's
            # disk was monotonically increasing. It hit the wall on 2026-07-22: runs
            # for #500, #501 and #503 ALL died with
            #   failed to copy: ... no space left on device
            # during `pull api` — the FIRST command here, so no container was ever
            # recreated and the box kept serving the previous api (the failure mode was
            # safe, but the deploy was dead and main stayed red for hours).
            #
            # SAFETY — why this cannot delete something we still need:
            #   * `docker image prune` NEVER removes an image that a container
            #     references, so the RUNNING api/redis/proxy images are untouchable
            #     here regardless of the filter.
            #   * `until=72h` keeps three days of recent `sha-` tags, i.e. the rollback
            #     targets docs/rollback-guide.md tells an operator to `up` by tag.
            #     Anything older is still in ghcr and re-pullable, so rollback is
            #     preserved either way — a cold rollback just re-downloads.
            #   * volumes are NEVER pruned (that is badabhai_pgdata / badabhai_redisdata).
            #     No `docker system prune`, no `--volumes`, not now, not later.
            #   * every step is `|| true`: reclaiming is best-effort and must never turn
            #     an otherwise-healthy deploy red.
            #
            # ESCALATION: if the 72h prune does not get free space over the threshold,
            # fall back to pruning ALL unused images. That is still container-safe (see
            # above) and is strictly better than a dead deploy.
            echo "Disk before reclaim:"; df -h / || true
            docker image prune -af --filter "until=72h" || true
            docker builder prune -af || true
            # $(NF-2) not $4: POSIX `df -P` guarantees the LAST three fields are
            # Available / Capacity / Mounted-on, but a device name containing a space
            # shifts every positional field (verified: it silently returns USED
            # instead of AVAILABLE). Counting from the end cannot be fooled that way.
            FREE_MB=$(df -Pm / | awk 'NR==2 {print $(NF-2)}')
            echo "Free after conservative prune: ${FREE_MB} MB"
            if [ "${FREE_MB:-0}" -lt 4096 ]; then
              echo "::warning::under 4 GB free — pruning ALL unused images (still container-safe)"
              docker image prune -af || true
              # $(NF-2) not $4: POSIX `df -P` guarantees the LAST three fields are
            # Available / Capacity / Mounted-on, but a device name containing a space
            # shifts every positional field (verified: it silently returns USED
            # instead of AVAILABLE). Counting from the end cannot be fooled that way.
            FREE_MB=$(df -Pm / | awk 'NR==2 {print $(NF-2)}')
              echo "Free after full prune: ${FREE_MB} MB"
            fi
            if [ "${FREE_MB:-0}" -lt 2048 ]; then
              echo "::error::only ${FREE_MB} MB free after reclaim — the box needs a bigger disk, not a bigger prune"
              docker system df || true
              exit 1
            fi
            echo "Disk after reclaim:"; df -h / || true

            $COMPOSE pull api
            # TD81(a). `--profile api` is what makes this resolve: the ai-service
            # declares that profile alongside its own (docker-compose.yml), so it
            # is selected here without depending on compose's newer
            # "explicitly-named service enables its profile" behaviour — the box's
            # compose version is not verified.
            $COMPOSE pull ai-service

            # CD-1a: Redis IS box-local (owner decision) — it runs as this compose
            # project's `redis` service, so unlike postgres it MUST start here. The
            # api reaches it over the compose network at redis:6379, which is what
            # the REDIS_URL secret must say (NOT localhost — inside the api container
            # localhost is the api itself; and the host port is loopback-bound now).
            #
            # `--no-deps api` below would never start it (redis is only reachable as
            # an api depends_on), so start it EXPLICITLY and FIRST. Naming the service
            # starts ONLY it — redis declares no depends_on — so postgres/adminer
            # still never start; --no-deps here keeps that true even if redis were
            # later given one. Deliberately NOT `--wait`: docker-compose.staging.yml
            # records that the box's compose version is unverified, and a flag it
            # lacks would fail the deploy outright. Redis serves within ms and the
            # api's own boot is far slower, so ordering is safe — and the CD-3 health
            # gate below is the real backstop if it is not.
            $COMPOSE up -d --no-deps redis

            # TODO(CD-2, held: 0031 human sign-off + D1): migrations-in-pipeline would
            # run HERE — after the image pull, BEFORE the new code boots (CLAUDE.md §2
            # ordering: migrations never run after the code that assumes them). Held
            # pending owner sign-off on migration 0031 (destructive-adjacent billing-FK
            # change, §7 human-gated) + the prod-vs-staging D1 environment answer.
            # NOTE (CD-3 scope): the /health gate below checks CONNECTIVITY only
            # (SELECT 1 + Redis PING) — a fresh, UNMIGRATED DATABASE_URL still boots
            # and 200s while every real endpoint 500s. Until CD-2 lands, applying
            # migrations MANUALLY (owner, after 0031 sign-off) is a required pre-step
            # to the first real deploy against a fresh DB.

            # TD81(a): start the ai-service BEFORE the api, and gate on it.
            #
            # Ordering: the api tolerates an absent ai-service by design (it
            # degrades to its TypeScript mock), so this is not a hard dependency —
            # but starting the dependency first means the new api never serves a
            # single request into a gap. `--no-deps` keeps the one uniform
            # discipline; this service declares no depends_on at all (it is
            # DB-free), so nothing else can be dragged up by it.
            $COMPOSE up -d --no-deps ai-service

            # CD-3 pattern, extended to the new service — and the actual fix for
            # TD81's headline complaint ("staging silently runs mocked AI while
            # reporting healthy"). The api's own /health is 200 whether or not the
            # AI service exists, so ONLY a direct probe can tell the deploy that
            # the AI path is real. localhost works because docker-compose.yml
            # publishes 8000 on 127.0.0.1 (loopback-only, CD-1a). /health is the
            # one route exempt from the TD67 token middleware, so this probe keeps
            # working after AI_INTERNAL_TOKEN is armed. ~30s budget (15 x 2s) — a
            # Python/uvicorn boot is far quicker than the Nest api's.
            #
            # TRADE-OFF, stated deliberately: this gate is BEFORE the api `up`, so
            # a broken ai-service image blocks the api deploy. That is the intended
            # posture — the box keeps serving the PREVIOUS, working api (no partial
            # state) and the job goes RED — and it is strictly better than shipping
            # an api that silently answers from the mock, which is the exact
            # failure this ticket exists to end.
            echo "Waiting for the AI service to become healthy..."
            ai_healthy=0
            for i in $(seq 1 15); do
              if curl -sf http://localhost:8000/health >/dev/null 2>&1; then
                ai_healthy=1
                echo "AI service healthy after attempt ${i}"
                break
              fi
              sleep 2
            done
            if [ "$ai_healthy" -ne 1 ]; then
              echo "::error::AI service never became healthy — dumping container logs"
              $COMPOSE logs --tail=100 ai-service
              exit 1
            fi

            $COMPOSE up -d --no-deps api
            $COMPOSE ps

            # CD-3: health-gate the deploy — the job must go RED when the API does not
            # come up (the old unconditional success echo could never fail). Poll on
            # the box itself: localhost sidesteps the instance firewall. Same poll
            # pattern as the e2e job's /health wait above. ~60s budget (30 x 2s).
            echo "Waiting for the API to become healthy..."
            healthy=0
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3001/health >/dev/null 2>&1; then
                healthy=1
                echo "API healthy after attempt ${i}"
                break
              fi
              sleep 2
            done
            if [ "$healthy" -ne 1 ]; then
              echo "::error::API never became healthy — dumping container logs"
              $COMPOSE logs --tail=100 api
              exit 1
            fi
            echo "Deployment finished successfully!"
