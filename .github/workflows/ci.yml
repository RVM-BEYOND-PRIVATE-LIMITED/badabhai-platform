name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Detect changed paths (CI-2: dorny/paths-filter) + derive the build id (#965) ----
  #
  # This job is ALSO the single derivation site for the short commit sha that every image
  # build bakes in as `GIT_COMMIT_SHA` (#965), AND — since the image jobs were matrixed —
  # for the image build matrix itself. Both live here, and not once per image job, because
  # this job is already the common `needs:` ancestor of both image jobs (`image-gate`, the
  # PR-only build, and `build-and-push-image`, the publish): one derivation, two consumers,
  # so the value a container reports on /health cannot drift from the value another job
  # computed, and a PR cannot gate a build that differs from the one `main` ships. See the
  # `short-sha` and `image-matrix` steps for why those equalities are the feature.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ai-service: ${{ steps.filter.outputs.ai-service }}
      e2e: ${{ steps.filter.outputs.e2e }}
      worker-app: ${{ steps.filter.outputs.worker-app }}
      payer-app: ${{ steps.filter.outputs.payer-app }}
      payer-web: ${{ steps.filter.outputs.payer-web }}
      admin-web: ${{ steps.filter.outputs.admin-web }}
      sast: ${{ steps.filter.outputs.sast }}
      deps: ${{ steps.filter.outputs.deps }}
      # #965: the value baked into api / ai-service / payer-web as `GIT_COMMIT_SHA` and
      # reported by each service's /health as `build`.
      short-sha: ${{ steps.short-sha.outputs.short-sha }}
      # THE image build matrix — see the `image-matrix` step below for why both the PR-only
      # gate (`image-gate`) and the publish (`build-and-push-image`) expand the SAME data.
      #   image-matrix       every shipped image, always (the publish set)
      #   image-gate-matrix  the subset whose `changes` path filter fired (the PR gate set)
      image-matrix: ${{ steps.image-matrix.outputs.matrix }}
      image-gate-matrix: ${{ steps.image-matrix.outputs.gate-matrix }}
    steps:
      # ---- #965: WHICH BUILD IS RUNNING ----
      # /health used to answer only "am I up?", so a deploy that silently kept serving the
      # PREVIOUS image was indistinguishable from a good one and we debugged code that was
      # not deployed. The container carries no .git (every Dockerfile's .dockerignore strips
      # it), so the commit sha is knowable ONLY at image-build time — hence a build arg, and
      # hence this step.
      #
      # `cut -c1-7` IS THE SAME DERIVATION THE REST OF THE PIPELINE ALREADY USES, and that
      # is the whole point rather than a coincidence:
      #   * the ghcr tag  — docker/metadata-action `type=sha` with
      #     DOCKER_METADATA_SHORT_SHA_LENGTH pinned to "7" (build-and-push-image below);
      #   * the deploy pin — `echo '${{ github.sha }}' | cut -c1-7` inside deploy-lightsail's
      #     remote script, which is what constructs `...:sha-<short7>`;
      #   * this step    — the value the running process reports.
      # If those three ever disagreed, /health would confidently name a build that is not the
      # image on the box — strictly worse than the "unknown" it replaces, because it would be
      # believed. `GITHUB_SHA` and `github.sha` are the same value; the env form is used here
      # so nothing is interpolated into the shell.
      #
      # ASSERTED, NOT ASSUMED. If the derivation ever yields something that is not a 7-char
      # lowercase hex sha, every image would ship a build arg the services reject as
      # unrecognisable and all three would report `"unknown"` forever — the feature silently
      # dead while CI stayed green. That is the "green check that gated nothing" failure mode,
      # so it fails LOUD here, in the build pipeline, one hop before anything is pushed.
      # NOTE the deliberate asymmetry: the BUILD asserts, the RUNTIME fails open. A service
      # must never refuse to boot, and /health must never 500, over a missing build label —
      # that would turn an observability nicety into an outage (see resolveBuildId in
      # apps/api/src/health/health.service.ts and Settings.build_id in
      # apps/ai-service/app/config.py).
      - name: Derive the short commit sha (the build id baked into every image)
        id: short-sha
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          if ! printf '%s' "${SHORT_SHA}" | grep -Eq '^[0-9a-f]{7}$'; then
            echo "::error::Refusing to build: derived build id '${SHORT_SHA}' is not a 7-char hex sha, so every image would report build=\"unknown\"."
            exit 1
          fi
          echo "short-sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Build id for this run: ${SHORT_SHA} (images tag as sha-${SHORT_SHA})"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ai-service:
              - 'apps/ai-service/**'
              # The shared profiling lexicon. `apps/ai-service/app/profiling/lexicon_data/`
              # is a byte-identical MIRROR of `packages/profiling-lexicon/data/`, which is
              # canonical (the image is built from the apps/ai-service context, so the
              # package does not exist at runtime in the container).
              #
              # Without this line, editing the canonical data would skip the ENTIRE Python
              # suite — including test_lexicon_parity.py, the check that the mirror still
              # matches and that both languages still agree. The change would report green
              # while shipping a stale mirror to production. A green check is not evidence
              # that the gate for the thing you changed actually ran.
              - 'packages/profiling-lexicon/**'
            e2e:
              - 'apps/api/**'
              - 'packages/**'
              - 'tests/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'apps/ai-service/**'
              # The job's own definition. Without this, a change to the e2e job — its
              # service containers, its migration steps, or the Matching V1 DB gates
              # below — skips the very job it edits, so the edit ships unvalidated.
              # A workflow file can obviously affect the workflow.
              - '.github/workflows/ci.yml'
            # The two Flutter apps. These filters live HERE rather than in their own
            # workflow files because those files are now `workflow_call` reusables that
            # this workflow invokes — see the `worker-app` / `payer-app` jobs below.
            worker-app:
              - 'apps/worker-app/**'
              - '.github/workflows/worker-app.yml'
              # The caller now decides whether the Flutter gate runs at all, so a change
              # to THIS file must be able to trigger it — same reasoning as the e2e entry
              # above, and the same failure if omitted.
              - '.github/workflows/ci.yml'
            payer-app:
              - 'apps/payer-app/**'
              - '.github/workflows/payer-app.yml'
              - '.github/workflows/ci.yml'
            # GAP-XC-06 (#920): gates ONLY the payer-web LEG of the `image-gate` job below
            # (via the `gate` field of that app's row in the `image-matrix` step) — the TS
            # lint/typecheck/test/build for apps/payer-web already runs UNCONDITIONALLY
            # inside the `node` job (turbo covers the whole workspace, no path filter),
            # so this filter's one job is "does the Dockerfile still produce an image?",
            # mirroring what the `ai-service` filter does for that app's leg. RENAMING THIS
            # FILTER KEY WITHOUT UPDATING THAT ROW IS A FAIL, LOUDLY: the matrix step
            # asserts every `gate` names a filter that exists, so the gate cannot be turned
            # off by a typo. The three workspace packages payer-web's Dockerfile
            # actually builds (@badabhai/config, @badabhai/pricing, @badabhai/validators)
            # plus validators' own @badabhai/types dependency are listed explicitly — a
            # change to any of them can break the image even with zero payer-web edits.
            payer-web:
              - 'apps/payer-web/**'
              - 'packages/config/**'
              - 'packages/pricing/**'
              - 'packages/validators/**'
              - 'packages/types/**'
              - '.github/workflows/ci.yml'
            # apps/admin-web (the INTERNAL admin portal) — same contract as the payer-web
            # filter above, gating ONLY the admin-web leg of `image-gate`. The workspace
            # packages are the ones admin-web's Dockerfile actually builds, enumerated from
            # its package.json and its @badabhai/* imports rather than copied from payer-web:
            # @badabhai/config (the /shared subpath), @badabhai/pricing, @badabhai/validators,
            # plus validators' own @badabhai/types. Same four as payer-web by coincidence,
            # not by inheritance — a change to any of them can break the image with zero
            # admin-web edits.
            admin-web:
              - 'apps/admin-web/**'
              - 'packages/config/**'
              - 'packages/pricing/**'
              - 'packages/validators/**'
              - 'packages/types/**'
              - '.github/workflows/ci.yml'
            # SAST (#773). Mirrors the filter security-scan.yml used while the job lived
            # there, plus the two workflow files that now decide whether it runs at all —
            # same reasoning as the e2e and Flutter entries above: a change to the gate
            # must be able to trigger the gate.
            sast:
              - 'apps/**'
              - 'packages/**'
              - 'tests/**'
              - '.github/workflows/sast.yml'
              - '.github/workflows/ci.yml'
            # Dependency audit (#788). `pnpm-lock.yaml` is what the job actually reads, but
            # it is NOT the only file that can change what resolves: `pnpm-workspace.yaml`
            # holds the `overrides` and the supply-chain policy, and a change there is
            # exactly the kind that must re-run the audit. Both are listed rather than one,
            # even though today an override edit also rewrites the lockfile — a filter that
            # is right only because of a coincidence elsewhere is one refactor from being
            # silently wrong, and a gate that does not run reports green.
            deps:
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/dependency-audit.yml'
              - '.github/workflows/ci.yml'

      # ---- THE IMAGE BUILD MATRIX: ONE SOURCE OF TRUTH FOR THE PR GATE AND THE PUBLISH ----
      #
      # WHY THIS LIVES HERE AND NOT INSIDE THE TWO IMAGE JOBS. Until this step existed, each
      # app's image was a HAND-COPIED triple of steps — once inside `build-and-push-image`
      # (the publish), once as its own PR-only gate job — and the copies DRIFTED. Measured on
      # 2026-08-18: the `payer-web-image` gate passed NO `build-args:` while
      # `build-and-push-image`'s payer-web step passed two, so the gate went green on a build
      # NOBODY SHIPS and the real build then failed on `main` with
      # `NEXT_PUBLIC_API_URL: Invalid url`. A gate that builds something DIFFERENT from what
      # ships is not a gate.
      #
      # Emitting the per-app inputs ONCE, here, and having BOTH image jobs expand the SAME
      # JSON as their `strategy.matrix.include` makes that class of drift structurally
      # impossible for everything the matrix carries: build context, Dockerfile, ghcr image
      # name, cache scope, and WHICH apps take the NEXT_PUBLIC_* build-args. Adding an app
      # (admin-web) is one row here plus one `changes` filter — never another copy of the
      # steps.
      #
      # SECRETS CANNOT LIVE IN A MATRIX, and that is a GitHub rule rather than a preference:
      # the `secrets` context is NOT available to `jobs.<id>.strategy` (only github / needs /
      # vars / inputs are), and a job OUTPUT whose value contains a secret is silently DROPPED
      # by the runner. So the two NEXT_PUBLIC_* values are still dereferenced at the step, in
      # both jobs, from an IDENTICAL three-line `build-args:` block whose per-app on/off
      # switch (`next-public`) is the matrix field defined right here. That is the residual
      # duplication and it is deliberate: the DECISION is single-sourced even though the
      # rendering is not, and the rendering is three lines that diff at a glance.
      #
      # `gate` NAMES THE `changes` FILTER that gates this app's PR-only build, or is EMPTY for
      # an app with no PR gate. `api` is empty ON PURPOSE — it has no PR image gate today and
      # this change does not add one, because `ci-required` must keep gating exactly what it
      # gated before.
      #
      # ASSERTED, NOT ASSUMED — the same discipline as the short-sha step above, for the same
      # reason. A malformed, empty, or wrongly-filtered matrix would skip image builds while
      # the run reported green, which is the single most dangerous state in this repo. So:
      # every row is checked for the fields both jobs read, app names must be unique, every
      # Dockerfile named must actually EXIST in this checkout, and every `gate` must name a
      # filter that actually EXISTS in the step above (a renamed filter would otherwise turn
      # that app's PR gate off silently and forever).
      - name: Derive the image build matrix
        id: image-matrix
        env:
          # The paths-filter results as an object, so the gate subset is a LOOKUP on the
          # `gate` field instead of a second hand-maintained list. Passed through `env:` so
          # nothing is interpolated into the shell.
          FILTERS_JSON: ${{ toJSON(steps.filter.outputs) }}
        run: |
          set -euo pipefail

          # ---- THE SOURCE OF TRUTH. One row per shipped image; PR 3 adds admin-web here.
          #
          # cache-scope `buildkit` for the api is NOT arbitrary: it is the documented default
          # scope of buildx's `type=gha` cache backend, i.e. exactly the scope the api's
          # previously-unscoped `cache-from: type=gha` was already using. Naming it explicitly
          # keeps the expensive WeasyPrint apt+pip layer warm across this refactor rather than
          # cold-starting it. (If upstream ever changed that default the only cost is one cold
          # api build, then warm again.)
          MATRIX_JSON='[
            {"app":"api","context":".","file":"apps/api/Dockerfile","image":"badabhai-api","cache-scope":"buildkit","next-public":false,"gate":""},
            {"app":"ai-service","context":"apps/ai-service","file":"apps/ai-service/Dockerfile","image":"badabhai-ai-service","cache-scope":"ai-service","next-public":false,"gate":"ai-service"},
            {"app":"payer-web","context":".","file":"apps/payer-web/Dockerfile","image":"badabhai-payer-web","cache-scope":"payer-web","next-public":true,"gate":"payer-web"},
            {"app":"admin-web","context":".","file":"apps/admin-web/Dockerfile","image":"badabhai-admin-web","cache-scope":"admin-web","next-public":false,"gate":"admin-web"}
          ]'
          # admin-web carries `"next-public":false` and that is the security-relevant field
          # in the row, not an omission: the two `build-args:` lines this switch controls
          # name PAYER_WEB_NEXT_PUBLIC_API_URL / _SITE_URL *literally* (secrets cannot be
          # indexed from a matrix), so `true` would bake the PAYER portal's origins into the
          # ADMIN portal's bundle. admin-web needs no public var — its api origin is
          # ADMIN_API_BASE_URL, server-only and read at container start. If it ever needs
          # one it gets its OWN ADMIN_WEB_NEXT_PUBLIC_* secrets and ARGs, never a ride here.

          if ! MATRIX="$(printf '%s' "$MATRIX_JSON" | jq -c .)"; then
            echo "::error::the image build matrix is not valid JSON — every image build would be skipped."
            exit 1
          fi

          if [ "$(printf '%s' "$MATRIX" | jq 'length')" -eq 0 ]; then
            echo "::error::the image build matrix is EMPTY — every image build would silently skip while this run reported green."
            exit 1
          fi

          BAD_ROWS="$(printf '%s' "$MATRIX" | jq -r '
            [ .[]
              | select(
                  (.app | type) != "string" or .app == ""
                  or (.context | type) != "string" or .context == ""
                  or (.file | type) != "string" or .file == ""
                  or (.image | type) != "string" or .image == ""
                  or (."cache-scope" | type) != "string" or ."cache-scope" == ""
                  or (."next-public" | type) != "boolean"
                  or (.gate | type) != "string"
                )
              | (.app // "<unnamed row>")
            ] | join(", ")')"
          if [ -n "$BAD_ROWS" ]; then
            echo "::error::image matrix rows are missing a field both image jobs read (app/context/file/image/cache-scope/next-public/gate): ${BAD_ROWS}"
            exit 1
          fi

          if [ "$(printf '%s' "$MATRIX" | jq '[.[].app] | unique | length')" \
             -ne "$(printf '%s' "$MATRIX" | jq 'length')" ]; then
            echo "::error::duplicate app name in the image build matrix — two matrix legs would collide on one cache scope and one check name."
            exit 1
          fi

          # A typo in `file` would otherwise surface only as a build failure, per app, much
          # later in the run — and on a PR only for the apps whose filter happened to fire.
          # NOT a `... | while read` loop: a pipeline's `while` body runs in a SUBSHELL, so
          # its `exit 1` would kill only that subshell and this check would pass vacuously.
          MISSING_DOCKERFILES=""
          for dockerfile in $(printf '%s' "$MATRIX" | jq -r '.[].file'); do
            if [ ! -f "$dockerfile" ]; then
              MISSING_DOCKERFILES="${MISSING_DOCKERFILES}${MISSING_DOCKERFILES:+, }${dockerfile}"
            fi
          done
          if [ -n "$MISSING_DOCKERFILES" ]; then
            echo "::error::the image matrix names Dockerfiles that do not exist in this checkout: ${MISSING_DOCKERFILES}"
            exit 1
          fi

          # THE GATE-OFF-BY-TYPO GUARD. An absent key yields null, which would quietly
          # resolve to "not changed" and turn that app's PR image gate off forever with
          # nothing red anywhere. Refuse instead.
          #
          # `.gate as $g` FIRST, then `$f | has($g)` — NOT `$f | has(.gate)`. The `|` rebinds
          # `.` to `$f`, so `.gate` inside `has()` would read the FILTER object's (absent)
          # `gate` key and jq dies with "Cannot check whether object has a null key". Found
          # by running this step, not by reading it.
          UNKNOWN_FILTERS="$(jq -rn --argjson m "$MATRIX" --argjson f "$FILTERS_JSON" '
            [ $m[] | .gate as $g | select($g != "" and (($f | has($g)) | not)) | $g ] | unique | join(", ")')"
          if [ -n "$UNKNOWN_FILTERS" ]; then
            echo "::error::the image matrix names paths-filter outputs that do not exist: ${UNKNOWN_FILTERS} — the PR image gate for those apps would silently never run."
            exit 1
          fi

          GATE="$(jq -cn --argjson m "$MATRIX" --argjson f "$FILTERS_JSON" '
            [ $m[] | .gate as $g | select($g != "" and ($f[$g] == "true")) ]')"

          {
            echo "matrix=${MATRIX}"
            echo "gate-matrix=${GATE}"
          } >> "$GITHUB_OUTPUT"

          echo "Images published on a push to main: $(printf '%s' "$MATRIX" | jq -r '[.[].app] | join(", ")')"
          echo "Images PR-gated this run: $(printf '%s' "$GATE" | jq -r 'if length == 0 then "(none — no gated path changed)" else ([.[].app] | join(", ")) end')"

  # ---- Flutter gates, INSIDE the aggregator (#718) ----
  #
  # These were standalone workflows, so `ci-required` — the only required context on
  # `main` — could not reach them: `needs:` cannot name a job in another workflow file.
  # Measured on PR #711: `Worker app (analyze / test)` FAILED while `ci-required` PASSED,
  # on a real analyzer error. The one check branch protection enforces was green, and a
  # merge on it would have landed a worker app that does not analyze.
  #
  # That gap is worse than it sounds for these two specifically: apps/worker-app needs
  # Dart >= 3.9.0, so a dev on an older Flutter cannot run `analyze`, `test`, or even
  # `pub get`. CI is the ONLY executor for this code, and an ungated CI is no gate.
  #
  # Converting them to `workflow_call` reusables and calling them here puts them under
  # `needs:` without duplicating the definitions, and without a second run per PR (their
  # own `push`/`pull_request` triggers are removed in the same change). The check names
  # become `worker-app / Worker app (analyze / test)`; nothing references them by name —
  # branch protection requires `ci-required` alone.
  worker-app:
    needs: changes
    if: needs.changes.outputs.worker-app == 'true'
    uses: ./.github/workflows/worker-app.yml

  payer-app:
    needs: changes
    if: needs.changes.outputs.payer-app == 'true'
    uses: ./.github/workflows/payer-app.yml

  # ---- Worker app: build + publish the release APK (#920) ----
  #
  # `worker-app.yml`'s `analyze-test` job (called just above) is a PR gate — it never
  # produces an artifact. Per #920: "CI never builds or distributes the worker
  # APK... an app fix can be merged, green, and on main, while every tester's device
  # runs a build from days earlier." This job closes that gap: on every push to `main`
  # that touches `apps/worker-app`, it builds the release APK and publishes it as a
  # GitHub Release asset — a stable, direct, public download link with zero new
  # infrastructure (no box config, no storage bucket, no new secret).
  #
  # PUSH-TO-MAIN ONLY, NOT in `ci-required` — same shape as `build-and-push-image` /
  # `deploy-lightsail` further below: this is a publish action, not a PR gate, so a PR
  # cannot merge on it and it must not be able to block one. Lives HERE rather than as
  # a second job inside `worker-app.yml` because that file is a pure `workflow_call`
  # PR gate (see its own header comment) with no push-vs-PR awareness of its own — the
  # push-vs-PR decision belongs at the caller, exactly where `build-and-push-image`
  # already makes the identical decision for the Docker images.
  #
  # `needs: [changes, worker-app]` lists `changes` DIRECTLY, not only transitively
  # through `worker-app` — see `build-and-push-image`'s comment further below for the
  # measured reason: an `always()` job's implicit-success absorption at one hop does
  # not "cleanse" a `changes` failure or cancellation for a job two hops downstream.
  #
  # `needs.worker-app.result == 'success'` — deliberately NOT tolerant of `skipped`,
  # unlike `build-and-push-image`'s tolerance of `ai-service`/`e2e` being skipped.
  # `worker-app` IS path-filtered by `changes.outputs.worker-app`, and BOTH its
  # outcomes are legitimate (skipped = nothing under apps/worker-app changed; success
  # = it changed and the analyze/test gate passed) — but only `success` means there is
  # a new APK worth publishing. A skipped `worker-app` correctly skips this job too:
  # the most recent Release is still current, and a failed `worker-app` must not ship.
  #
  # NO NEW SIGNING SECRET. `apps/worker-app/android/app/build.gradle` already signs
  # release builds with the Flutter debug keystore (`signingConfig =
  # signingConfigs.debug`, "so `flutter run --release` works") — the same ratified,
  # deliberate decision that already covers `assetlinks.json` on this same issue
  # thread: ship the debug fingerprint for sideload QA now, swap in the real Play App
  # Signing key only at Play launch. `flutter build apk --release` in CI therefore
  # produces the SAME artifact a developer already gets locally today.
  worker-app-apk:
    name: Worker app (build + release APK)
    needs: [changes, worker-app]
    if: >-
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      needs.worker-app.result == 'success'
    runs-on: ubuntu-latest
    # Only scope granted: the Releases API (create release + upload asset) needs
    # contents:write. No packages:*, no id-token — narrower than build-and-push-image.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/worker-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pinned identically to worker-app.yml's analyze-test job — see that file's
      # comment for why the pin exists and what breaks below it (Dart >=3.9.0 floor).
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # First job in this repo to actually invoke the Android/Gradle build (analyze-test
      # above runs no native build) — `ubuntu-latest` ships a preinstalled, license-
      # accepted Android SDK, which is what `flutter build apk` needs beyond Flutter
      # itself.
      - name: Build release APK
        run: flutter build apk --release

      # Rename with the commit's short SHA so the artifact carries its own provenance
      # in the filename — trivial, obviously-correct traceability. Does not attempt
      # #966's separate in-app build-id work.
      - name: Stage the APK
        id: vars
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          cp build/app/outputs/flutter-apk/app-release.apk "worker-app-sha-${SHORT_SHA}.apk"

      # `worker-app-sha-<short7>` (not the bare `sha-<short7>` the ghcr images use):
      # GitHub Release tags are repo-wide, and this monorepo also ships
      # apps/payer-app — an eventual identical pipeline for it would collide with a
      # bare `sha-<short7>` tag on the same commit. Prefixed once, here, to avoid that
      # collision pre-emptively.
      - name: Publish GitHub Release with the APK asset
        id: release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: worker-app-sha-${{ steps.vars.outputs.short_sha }}
          name: Worker app — sha-${{ steps.vars.outputs.short_sha }}
          target_commitish: ${{ github.sha }}
          body: |
            Automated build from commit ${{ github.sha }}.
            Debug-signed release APK (sideload QA build — see
            apps/worker-app/android/app/build.gradle). Enable "install from unknown
            sources" to sideload; this is not a Play Store build.
          files: apps/worker-app/worker-app-sha-${{ steps.vars.outputs.short_sha }}.apk
          # Fail loud, not silent, if `flutter build apk` didn't produce the file
          # this step expects (e.g. a future Flutter bump moves the output path).
          fail_on_unmatched_files: true

      # The direct download link #920 asked for. A GitHub release-asset URL is a
      # deterministic function of the tag and the asset filename — constructed
      # directly here rather than parsed out of the action's JSON `assets` output, so
      # this step's correctness does not depend on that output's exact schema.
      - name: Job summary
        run: |
          SHORT_SHA="${{ steps.vars.outputs.short_sha }}"
          TAG="worker-app-sha-${SHORT_SHA}"
          ASSET="worker-app-sha-${SHORT_SHA}.apk"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ASSET}"
          {
            echo "### Worker app APK published"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo ""
            echo "Direct download: ${DOWNLOAD_URL}"
            echo ""
            echo "Release page: ${{ steps.release.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---- Payer app: build + publish the release APK ----
  #
  # The second shipping surface with no artifact on a push to `main`. `worker-app-apk`
  # immediately above closed that gap for apps/worker-app; apps/payer-app had the same
  # hole — `payer-app.yml`'s `analyze-test` job is a PR gate that produces nothing, so a
  # merged payer/agency app fix was green on `main` while every tester's device still ran
  # a build from days earlier. This job is a DELIBERATE MIRROR of `worker-app-apk`: same
  # shape, same pins, same gate semantics. Read the two together; keep them in lockstep.
  #
  # THE TAG PREFIX IS THE WHOLE REASON THAT COMMENT EXISTS. `worker-app-apk`'s release
  # step already anticipated this job by name: "GitHub Release tags are repo-wide, and
  # this monorepo also ships apps/payer-app — an eventual identical pipeline for it would
  # collide with a bare `sha-<short7>` tag on the same commit." This IS that pipeline, and
  # a commit touching both apps runs BOTH jobs. `payer-app-sha-<short7>` is the other half
  # of that reservation; do not shorten it to the bare `sha-<short7>` the ghcr images use.
  #
  # PUSH-TO-MAIN ONLY, NOT in `ci-required` — same shape as `worker-app-apk` /
  # `build-and-push-image` / `deploy-lightsail`: a publish action is not a PR gate, so it
  # must not be able to block a merge, and structurally cannot, since it never runs on a
  # `pull_request`. Lives HERE rather than as a second job inside `payer-app.yml` for the
  # reason that file's own header gives — it is a pure `workflow_call` PR gate with no
  # push-vs-PR awareness; that decision belongs at the caller.
  #
  # `needs: [changes, payer-app]` lists `changes` DIRECTLY, not only transitively through
  # `payer-app` — see `build-and-push-image`'s comment further below for the measured
  # reason: an `always()` job's implicit-success absorption at one hop does not "cleanse"
  # a `changes` failure or cancellation for a job two hops downstream.
  #
  # `needs.payer-app.result == 'success'` — deliberately NOT tolerant of `skipped`. Both
  # outcomes of the path-filtered `payer-app` job are legitimate (skipped = nothing under
  # apps/payer-app changed; success = it changed and the analyze/test gate passed), but
  # only `success` means there is a new APK worth publishing. A skipped `payer-app`
  # correctly skips this job — the most recent Release is still current — and a failed one
  # must not ship.
  #
  # NO NEW SIGNING SECRET, VERIFIED NOT ASSUMED. `apps/payer-app/android/app/build.gradle`
  # signs release with `signingConfig = signingConfigs.debug`, byte-for-byte the same
  # release block as worker-app's, and references NO keystore, key.properties or signing
  # secret anywhere — so `flutter build apk --release` needs nothing this repo does not
  # already contain. (`android/.gitignore` does exclude `key.properties`/`*.jks`, but
  # nothing reads them; the build does not depend on an ignored file.) Firebase is wired
  # the same way too: the `com.google.gms.google-services` plugin is applied and
  # `apps/payer-app/android/app/google-services.json` is COMMITTED, not ignored, with
  # `package_name: com.badabhai.payerapp` matching this module's `applicationId` — which
  # is exactly what that plugin fails the build over when it is missing or mismatched.
  payer-app-apk:
    name: Payer app (build + release APK)
    needs: [changes, payer-app]
    if: >-
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      needs.payer-app.result == 'success'
    runs-on: ubuntu-latest
    # Only scope granted: the Releases API (create release + upload asset) needs
    # contents:write. No packages:*, no id-token — narrower than build-and-push-image.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/payer-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pinned identically to payer-app.yml's analyze-test job (and to worker-app's) —
      # see that file's comment for why the pin exists and what breaks below it
      # (pubspec floors Flutter at >=3.35.0).
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # `payer-app.yml`'s analyze-test runs no native build, so this is the first place
      # the payer app's Android/Gradle build is exercised at all — `ubuntu-latest` ships
      # a preinstalled, license-accepted Android SDK, which is what `flutter build apk`
      # needs beyond Flutter itself.
      - name: Build release APK
        run: flutter build apk --release

      # Rename with the commit's short SHA so the artifact carries its own provenance
      # in the filename — same trivial, obviously-correct traceability as worker-app.
      - name: Stage the APK
        id: vars
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          cp build/app/outputs/flutter-apk/app-release.apk "payer-app-sha-${SHORT_SHA}.apk"

      # `payer-app-sha-<short7>`, NOT the bare `sha-<short7>` the ghcr images use and NOT
      # `worker-app-sha-<short7>`: Release tags are repo-wide, and a commit that touches
      # both Flutter apps publishes from both jobs on the same sha. This prefix is the
      # collision `worker-app-apk`'s own release step reserved against.
      - name: Publish GitHub Release with the APK asset
        id: release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: payer-app-sha-${{ steps.vars.outputs.short_sha }}
          name: Payer app — sha-${{ steps.vars.outputs.short_sha }}
          target_commitish: ${{ github.sha }}
          body: |
            Automated build from commit ${{ github.sha }}.
            Debug-signed release APK (sideload QA build — see
            apps/payer-app/android/app/build.gradle). Enable "install from unknown
            sources" to sideload; this is not a Play Store build.
          files: apps/payer-app/payer-app-sha-${{ steps.vars.outputs.short_sha }}.apk
          # Fail loud, not silent, if `flutter build apk` didn't produce the file
          # this step expects (e.g. a future Flutter bump moves the output path).
          fail_on_unmatched_files: true

      # A GitHub release-asset URL is a deterministic function of the tag and the asset
      # filename — constructed directly here rather than parsed out of the action's JSON
      # `assets` output, so this step's correctness does not depend on that output's
      # exact schema.
      - name: Job summary
        run: |
          SHORT_SHA="${{ steps.vars.outputs.short_sha }}"
          TAG="payer-app-sha-${SHORT_SHA}"
          ASSET="payer-app-sha-${SHORT_SHA}.apk"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ASSET}"
          {
            echo "### Payer app APK published"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo ""
            echo "Direct download: ${DOWNLOAD_URL}"
            echo ""
            echo "Release page: ${{ steps.release.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---- SAST, INSIDE the aggregator (#773) ----
  #
  # Same structural fix as the two Flutter jobs above, for the same reason. semgrep lived in
  # security-scan.yml, so `ci-required` could not `needs:` it and a red SAST sat beside a
  # green required check. That fired twice in one day — #763 and #768 — and both were caught
  # by a human reading the checks rather than by the gate.
  #
  # `baseline-ref` makes this the DIFF gate: only findings the PR introduces fail it. The
  # whole-tree scan still happens weekly from security-scan.yml, so the strong guarantee is
  # kept, just off the critical path (#774). Cost of this edge: ~1m30s on every code PR.
  sast:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.sast == 'true'
    uses: ./.github/workflows/sast.yml
    with:
      baseline-ref: ${{ github.event.pull_request.base.sha }}

  # ---- Dependency audit, INSIDE the aggregator (#788, #792) ----
  #
  # Third instance of the same structural fix, for the third time for the same reason. This
  # job lived in security-scan.yml as `continue-on-error: true`, quietly reporting 18 high
  # advisories on every lockfile-touching PR. #788 flipped it to blocking; blocking is only
  # half a gate, because `ci-required` cannot `needs:` a job in another workflow file — the
  # gap #718 MEASURED on PR #711 and #773 hit twice in one day.
  #
  # The audit reads the whole workspace at once, so unlike sast there is no per-PR baseline
  # to pass and nothing to split: this call and the weekly one in security-scan.yml run the
  # identical scan. The weekly is not redundant — it is what catches direct pushes to main
  # and advisories published against dependencies nobody touched.
  #
  # Path-gated because it installs the full tree (~1m). A PR that changes no dependency
  # cannot change the audit's answer.
  deps-audit:
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    uses: ./.github/workflows/dependency-audit.yml

  # ---- TypeScript monorepo: lint, typecheck, test, build ----
  node:
    name: Node (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        # No `version:` here on purpose — it would conflict with the
        # `packageManager` field in package.json (ERR_PNPM_BAD_PM_VERSION).
        # package.json's `packageManager: pnpm@11.5.2` is the single source.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CI-5b: persist turbo's local task cache across runs. turbo@^2.3.3 (v2,
      # resolves 2.9.x) writes its cache to `.turbo/cache` under the repo root —
      # turbo.json sets no `cacheDir` override — so caching `.turbo` captures it.
      # The sha key saves a fresh entry per run; `restore-keys` gives every run the
      # most recent prior cache. This accelerates the turbo-run tasks below
      # (typecheck / test / build — `pnpm lint` is plain eslint, not turbo). No CI
      # invocation passes `--force` or sets TURBO_FORCE, so restored entries are
      # actually consumed. Nothing secret-bearing is cached: `.turbo` holds task
      # outputs (dist/, .next/) and task logs only.
      - name: Cache turbo
        # v6 is the latest major (v6.1.0 at time of writing) and matches this repo's
        # latest-major convention for actions/* (checkout@v7, setup-node@v7). v4 ran on
        # the deprecated node20 runtime — that annotation is what this bump clears.
        # (v5 = node24 runtime, v6 = ESM migration; both fine on GitHub-hosted runners.)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Lint
        run: pnpm lint

      # Design-system adherence (DS4.3): the token gate — NO raw hex/px in payer-web UI
      # source — is enforced by the Lint step above (ESLint `no-restricted-syntax`, since
      # oxlint does not implement that rule). This is the fast oxlint supplementary pass
      # (correctness) over apps/payer-web/src. Any payer-web UI change should also run the
      # `bb-ui-review` skill (see the PR checklist).
      - name: Design-system adherence — oxlint (payer-web)
        run: pnpm lint:oxlint

      - name: Typecheck
        run: pnpm typecheck

      # TD9: --coverage flags enforce the vitest coverage thresholds pinned in
      # apps/api/vitest.config.ts (lines≥75, functions≥75, branches≥73, statements≥75).
      # Without this flag, thresholds are configured but never checked in CI.
      - name: Test (with coverage thresholds)
        run: pnpm test -- --coverage

      # The question-pack deploy gate, in its DB-FREE mode.
      #
      # IT RAN IN NO WORKFLOW AT ALL until this line, in either mode — and that is precisely how
      # its own bug survived: `verify-question-packs.ts` called the corpus validator with no
      # `opts`, so the "target_field is in the RFS vocabulary" rule silently did not run, and the
      # UNIVERSAL pack shipped with four invented field ids. Library-level tests could not have
      # caught it, because the defect was in the CLI's call, not in the validator.
      #
      # `--corpus` needs no Postgres, so it belongs in this job rather than the DB-backed one
      # below; the live-database checks stay on the deploy path.
      - name: Verify question-pack corpus (db:verify:packs --corpus)
        run: pnpm --filter @badabhai/db db:verify:packs --corpus

      # The occupation-retrieval accuracy gate (OIE Phase 9). Like `db:verify:packs` before
      # Phase 8, this script exits 1 on failure and RAN IN NO WORKFLOW AT ALL — an acceptance
      # gate nobody executes is documentation, not a gate.
      #
      # THE FLOOR IS RE-DERIVED HERE, and that is the Phase 9 calibration act for this metric.
      # The script's built-in default is 60%, the Phase 2 authoring target. We measure 97.0%.
      # A gate at 60 against a measurement of 97 cannot catch a regression: deleting a third of
      # the vernacular alias corpus would still pass it. 95 sits just under the real number, so
      # a genuine regression trips while routine corpus growth does not.
      #
      # FAMILY PRECISION STAYS AT THE SCRIPT'S 97% DEFAULT, deliberately un-raised even though
      # we measure 98.2%. 0.97 is the PRODUCT requirement from the plan; tightening the gate to
      # the current measurement would fail the build for a corpus change that still meets the
      # bar the product actually asked for.
      #
      # Needs no Postgres and no provider — committed corpus + committed gold set, embeddings
      # off — so the number is reproducible from a bare checkout.
      - name: Occupation retrieval accuracy (db:eval:occupation)
        run: pnpm --filter @badabhai/db db:eval:occupation --min-hit-rate 95

      # Offline self-test for the staging /health + mock-OTP smoke (scripts/staging-smoke.mjs).
      # Plain node:test, NO network — locks the load-bearing dev_otp-FAIL gate + the
      # no-secret-leak guarantee so a refactor can't silently weaken them.
      - name: Smoke self-test (staging)
        run: node --test scripts/staging-smoke.test.mjs

      - name: Build
        run: pnpm build

  # ---- Python AI service: pytest + ruff ----
  ai-service:
    name: AI service (pytest / ruff)
    if: needs.changes.outputs.ai-service == 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          # CI-5a: cache pip's package cache. The job installs requirements-dev.txt,
          # which chains `-r requirements.txt` — so the key must hash BOTH files
          # (a runtime-deps change alone must rotate the key, or actions/cache
          # never re-saves on a hit and new wheels re-download every run). NOTE:
          # `cache-dependency-path` is ALWAYS repo-root-relative — the job's
          # `working-directory` default does not apply to it — hence the full path.
          cache: "pip"
          cache-dependency-path: apps/ai-service/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

  # ---- DOES EACH APP'S IMAGE STILL BUILD AT ALL? (TD81 + GAP-XC-06 #920) ----
  #
  # `build-and-push-image` below is gated `push && refs/heads/main`, so it NEVER runs on a
  # PR. Without this job a broken Dockerfile is first discovered ON MAIN — where it also
  # fails `deploy-lightsail`, i.e. exactly the TD81 failure class this gate exists to remove
  # (a green signal hiding an untested artifact).
  #
  # ONE MATRIXED JOB, NOT ONE JOB PER APP. This was `ai-service-image` + `payer-web-image`,
  # two near-identical hand-copied jobs, and the copies DRIFTED FROM THE PUBLISH PATH — the
  # payer-web gate passed no `build-args:` while the push job passed two, so a build nobody
  # ships went green and a broken image reached `main` (2026-08-18). Both this job and
  # `build-and-push-image` now expand THE SAME `changes` output, so an app's build context,
  # Dockerfile, cache scope and NEXT_PUBLIC_* switch are structurally incapable of differing
  # between the gate and the thing that actually ships. See the `image-matrix` step in
  # `changes` for the full reasoning and for what the matrix deliberately does NOT carry.
  #
  # `fail-fast: false` — one app's Dockerfile breaking must not cancel the other apps' gates.
  # A PR author needs to see every broken image in ONE run, not one per push.
  #
  # BUILD ONLY, never push: no registry credentials, no `packages: write`, no tags. It
  # answers "does this Dockerfile still produce an image?" and nothing else, and it reuses
  # the SAME gha cache scope as the push job, so a PR build warms the layers `main` reuses.
  #
  # Deliberately NOT a `needs:` of anything but `changes`: an independent signal that must be
  # able to fail without masking the `node` / `ai-service` jobs' own coverage of these apps.
  #
  # CI-2: STILL PATH-GATED PER APP, but the gating moved from a job-level `if:` into the
  # matrix, because a job `if:` cannot see `matrix`. `changes` emits ONLY the apps whose
  # filter fired, so an unaffected app produces no matrix leg at all — the same skip
  # semantics the two previous jobs had — and when nothing fired the whole job skips, which
  # `ci-required` treats as fine. WHICH apps are gated is unchanged by this refactor:
  # ai-service and payer-web, exactly as before; `api` carries an empty `gate` field.
  image-gate:
    name: Image gate (${{ matrix.app }})
    if: needs.changes.outputs.image-gate-matrix != '[]'
    needs: [changes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.image-gate-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the ${{ matrix.app }} image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: false
          # THIS `build-args:` BLOCK IS BYTE-IDENTICAL TO `build-and-push-image`'s, AND
          # KEEPING IT THAT WAY IS THE POINT OF THE WHOLE REFACTOR AROUND IT. A gate that
          # builds something DIFFERENT from what ships is not a gate: this gate previously
          # passed NO build-args while the push job passed two, the PR went green, and the
          # push job then failed on `main` with `NEXT_PUBLIC_API_URL: Invalid url` — because
          # an absent secret resolves to the EMPTY STRING and Docker injects a declared ARG
          # into the build env (see apps/payer-web/Dockerfile's header). The empty-secret
          # case is therefore part of what this gate must reproduce, not something to
          # "fix" here.
          #
          # WHY THE CONDITIONAL FORM RATHER THAN A MATRIX FIELD: the `secrets` context is
          # not available to `jobs.<id>.strategy`, so the VALUES cannot live in the matrix —
          # only the per-app switch (`next-public`) can, and it does. A false switch renders
          # the line EMPTY, and docker/build-push-action@v7 drops empty entries
          # (`skipEmptyLines` + a truthiness filter in its bundled getList), so api and
          # ai-service receive exactly the one `GIT_COMMIT_SHA` arg they receive today.
          #
          # #965: GIT_COMMIT_SHA reaches EVERY image. In payer-web's Dockerfile it is
          # declared ONLY in the RUNTIME stage, so — unlike the two NEXT_PUBLIC_* args — it
          # never enters `next build`'s environment and cannot reach @badabhai/config's zod
          # schema. On a `pull_request` this is the MERGE commit's sha, not the head
          # commit's; the image is never pushed or deployed, so only the code path matters.
          build-args: |
            ${{ matrix.next-public && format('NEXT_PUBLIC_API_URL={0}', secrets.PAYER_WEB_NEXT_PUBLIC_API_URL) || '' }}
            ${{ matrix.next-public && format('NEXT_PUBLIC_SITE_URL={0}', secrets.PAYER_WEB_NEXT_PUBLIC_SITE_URL) || '' }}
            GIT_COMMIT_SHA=${{ needs.changes.outputs.short-sha }}
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}

  # ---- Flutter worker app ----
  # Moved to its own path-filtered, BLOCKING workflow: .github/workflows/worker-app.yml
  # (runs only on changes under apps/worker-app; pinned Flutter; no continue-on-error).

  # ---- Phase 1 E2E gate: real Postgres + Redis, migrate, drive the full flow ----
  # Blocking: a PR FAILS if the end-to-end onboarding journey (login → consent →
  # multi-turn interview → state persistence → AUTO extraction → extraction_completed
  # → AI-metadata persistence → no-raw-phone → confirm → resume) regresses.
  # The FastAPI AI service is intentionally NOT started — the API falls back to its
  # safe mock (real_call=false), so the flow + its events/metadata complete offline.
  # CI-2: path-gated to only run when API, packages, or ai-service code changes.
  e2e:
    name: E2E (Phase 1 onboarding flow)
    if: needs.changes.outputs.e2e == 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector-enabled pg16 (official image, built on postgres:16): the migration
        # chain runs `CREATE EXTENSION vector` (0001 — worker_profiles.embedding + HNSW),
        # which a plain postgres:16 image cannot satisfy ("extension vector is not available").
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: badabhai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Service-container Postgres/Redis (no special chars → no URL-encoding needed).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/badabhai_test
      REDIS_URL: redis://localhost:6379
      # test → PII crypto guard permits the dev defaults (no real secrets in CI).
      NODE_ENV: test
      API_PORT: "3001"
      RUN_E2E: "1"
      # The per-SENDER OTP cap (#1035). The e2e client sends no `X-Device-Id`, so every test
      # falls back to the ADDRESS bucket and the whole suite shares one hourly budget from the
      # SAME CI IP — raise it here so a production abuse backstop, meaningless for a single
      # shared CI runner, doesn't 429 the suite. Real deployments keep the default.
      #
      # MUST BE RAISED ALONGSIDE the per-IP one below. Since #1035 the fallback bucket is
      # capped at the per-DEVICE knob, so leaving this at its default of 20 would 429 the suite
      # on the 21st login however high the per-IP ceiling was set.
      OTP_MAX_SENDS_PER_DEVICE_PER_HOUR: "1000"
      # The per-NETWORK flood ceiling ABOVE that sender gate (default 1000). Same reasoning:
      # one shared CI IP for the whole suite.
      OTP_MAX_SENDS_PER_IP_PER_HOUR: "1000"
      # The per-PHONE hourly SMS budget — a DIFFERENT limit from the one above, which is
      # why both are raised. One CI run reuses phones across the suite.
      OTP_MAX_SENDS_PER_HOUR: "1000"
      # Same reasoning for the per-phone DAILY backstop (TD60): one CI run shares
      # phones/IPs across the whole suite, so keep it out of the way here too.
      OTP_MAX_SENDS_PER_DAY: "1000"
      # Shared secret for InternalServiceGuard on the ops/backend-only resume routes
      # (GET /resume/:id, …). Job-level so the API process AND the e2e test both see it;
      # the test sends it as x-internal-service-token.
      INTERNAL_SERVICE_TOKEN: e2e-internal-service-token
      # ---- D-3 test-login seam ----
      # OTP is real-only: SMS_PROVIDER is a z.literal("fast2sms") and no dev_otp echo
      # exists at any boundary, so an e2e run CANNOT obtain a code with the dummy key
      # above. `POST /auth/test-login` is the seam built for exactly that, and it WORKS —
      # measured on run 30699229574, where contact-unlock minted sessions and F-3 passed
      # end to end before that suite was re-gated for an unrelated reason (TD129: the API
      # cannot read the locked `workers`/`events` tables in this job).
      #
      # Kept armed although no suite currently consumes it: it is the only way any future
      # e2e can authenticate a worker, and the seam is inert unless a test sends the
      # header, so arming it costs nothing and re-deriving this block later is rework.
      #
      # Safe to arm HERE and nowhere else: assertAuthConfig refuses to boot when this is
      # enabled outside development/test/staging (NODE_ENV is `test` above), and refuses
      # again if the token is under 32 chars. The value below is a throwaway CI literal —
      # it grants nothing beyond this ephemeral job's own database.
      TEST_LOGIN_ENABLED: "true"
      TEST_LOGIN_TOKEN: e2e-test-login-token-not-a-secret-32ch
      # ---- PAYER test-login seam (BL-18) — the `/payer/*` analogue of TEST_LOGIN_* above ----
      # Payer login is EMAIL OTP with no dev echo (real-only, ZeptoMail), so payer-tenancy.e2e
      # and payer-capacity.e2e were dead-`describe.skip`ped: nothing could complete a payer
      # login in CI. `POST /payer/test-login` (PayerTestLoginGuard) is the seam built for
      # exactly this — same two-part discipline as TEST_LOGIN_* (assertPayerAuthConfig refuses
      # to BOOT when armed outside development/test/staging, or with a token under 32 chars).
      # The value below is a throwaway CI literal, not a secret; it grants nothing beyond this
      # ephemeral job's own database, and the guard additionally restricts minted sessions to
      # the reserved `@e2e.badabhai.invalid` domain (isSyntheticPayerEmail) regardless of token.
      PAYER_TEST_LOGIN_ENABLED: "true"
      PAYER_TEST_LOGIN_TOKEN: e2e-payer-test-login-token-not-a-secret-32ch
      # BL-18: re-arming to VERIFY (not assume) whether TD129's blocker still holds. This
      # comment block's own claim above ("the API cannot read the locked workers/events
      # tables in this job") directly contradicts live evidence from TODAY's CI: a
      # DIFFERENT e2e suite (referral-round-trip.e2e.test.ts, not gated behind this flag)
      # runs the IDENTICAL POST /auth/test-login -> POST /consent/accept sequence -- same
      # job, same DATABASE_URL role, same ConsentService.accept -> WorkersRepository.findById
      # code path TD129's cited failure (run 30699229574) named -- and passes clean, zero
      # permission errors. Either the underlying issue was fixed by an unrelated change
      # since 2026-08-01, or it wasn't and this run will show it. Revert this one line if
      # contact-unlock.e2e.test.ts fails here; the diagnosis in the suite's own gating
      # comment (tests/e2e/contact-unlock.e2e.test.ts) still stands as the fallback account.
      E2E_UNLOCK_SUITE: "1"
      # Set EXPLICITLY rather than inherited. The default is 200/day and it is a GLOBAL,
      # IP-INDEPENDENT counter — unlike OTP_MAX_SENDS_PER_HOUR above, raising the per-IP
      # cap does not cover it. A fresh Redis per job makes 200 probably sufficient today,
      # but "probably sufficient" is how a suite starts failing on the run that adds the
      # test which crosses it.
      TEST_LOGIN_MAX_PER_DAY: "1000"
      # OTP is REAL-ONLY (Fast2SMS for worker SMS, ZeptoMail for payer email). The API now
      # calls assertAuthConfig (Fast2SMS creds REQUIRED in every env) + assertPayerAuthConfig
      # (default email_otp + zeptomail → email creds REQUIRED) at boot, so it FAILS CLOSED
      # without these. Supply obviously-FAKE placeholders so the process BOOTS — no real send
      # ever happens (the e2e never reaches a real provider; the dev_otp login path is gone,
      # so the OTP-login journeys are .skip). NEVER real keys.
      FAST2SMS_API_KEY: ci-dummy-fast2sms-api-key
      FAST2SMS_SENDER_ID: CIDUMMY
      FAST2SMS_DLT_TEMPLATE_ID: ci-dummy-dlt-template
      ZEPTOMAIL_API_TOKEN: ci-dummy-zeptomail-token
      ZEPTOMAIL_MAIL_AGENT: ci-dummy-mail-agent
      EMAIL_FROM_ADDRESS: ci-dummy@example.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build only the API and its workspace deps — not the whole monorepo (the
      # `node` job owns lint/typecheck/unit-test/full-build; we just need a runnable API).
      - name: Build API (+ workspace deps)
        run: pnpm --filter "@badabhai/api..." build

      # Migrations 0003/0004 REVOKE grants from Supabase's anon/authenticated/
      # service_role roles, which don't exist on a plain Postgres image. Pre-create
      # them (idempotent) so the migration chain applies — and so the RLS regression
      # test can exercise `SET ROLE anon/...` denials.
      - name: Create Supabase-compatible roles
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DO $$ BEGIN CREATE ROLE anon NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$; DO $$ BEGIN CREATE ROLE authenticated NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$; DO $$ BEGIN CREATE ROLE service_role NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;'

      # Fresh DB → applies the full migration chain from scratch, which also
      # validates migrations on every PR. The onboarding flow self-seeds (it creates
      # its own worker per run via a unique phone), so no worker seed is needed.
      - name: Apply migrations
        run: pnpm --filter @badabhai/db db:migrate

      # Catalog jobs ARE needed: the alpha swipe-to-apply e2e (ADR-0009) reads a
      # seeded job source. Idempotent; PII-free; safe to run before every e2e.
      - name: Seed alpha jobs
        run: pnpm --filter @badabhai/db db:seed:jobs

      # OIE Phase 8 — THE INTERVIEW NOW READS THESE TABLES ON EVERY TURN.
      #
      # Before the cutover the chat turn called the ai-service and needed no reference
      # data at all; a migrated-but-unseeded database was fine. It is not fine now:
      # `ProfilingOrchestrator.resolvePacks` fails closed when the UNIVERSAL pack is
      # missing, so without these steps every e2e chat turn returns the unavailable line
      # and the failure looks like a broken orchestrator rather than an unseeded database.
      #
      # Occupations first, then packs: `profiling_family_binding` references ISCO unit
      # codes that only exist once the domains are in.
      #
      # Idempotent and PII-free — public occupation reference data and reviewed interview
      # copy. Deterministic ids make a re-run a row-level no-op.
      #
      # `--apply` IS REQUIRED. Every script in this family is DRY-RUN by default: without
      # the flag they print the corpus they would write, exit 0, and touch nothing. That is
      # not a hypothetical — the first version of these two steps omitted it, both went
      # green, and `db:verify:packs` below then failed with "the pack tables are EMPTY".
      # A seed step that passes while seeding nothing is worse than no seed step, because
      # the green tick is the thing you would trust. Same reasoning, and the same flag, as
      # `db:seed:match:vocabulary` further down.
      - name: Seed job domains (occupation catalogue)
        run: pnpm --filter @badabhai/db db:seed:domains --apply

      # NORMALIZE BETWEEN THE SEED AND ANY RETRIEVAL — and this ran in NO workflow at all.
      #
      # `verify-job-domains.ts` states it plainly: an un-normalized alias is "invisible to L0/L2
      # retrieval". So CI seeded the catalogue and then exercised an occupation ladder missing its
      # exact- and trigram-match keys, degrading to whatever still happened to hit — which passes,
      # just less accurately, which is the worst kind of gap because nothing goes red.
      - name: Normalize occupation aliases
        run: pnpm --filter @badabhai/db db:normalize:aliases --apply

      - name: Seed question packs
        run: pnpm --filter @badabhai/db db:seed:packs --apply

      # The deploy gate, run against the LIVE database rather than the corpus. The
      # `--corpus` variant in the node job checks the JSONL; this one checks what actually
      # landed — including "exactly one active pack per (family, locale)" and "a universal
      # pack exists", neither of which a corpus read can prove.
      - name: Verify question packs (db:verify:packs)
        run: pnpm --filter @badabhai/db db:verify:packs

      # The catalogue's own gate, and it ran in no workflow either. It is what turns the
      # normalize step above from a hopeful extra into a checked one: it fails on aliases that
      # would be invisible to L0/L2 retrieval, which is the exact degradation nothing else
      # notices.
      - name: Verify occupation catalogue (db:verify:domains)
        run: pnpm --filter @badabhai/db db:verify:domains

      # D1 — the Matching V1 match vocabulary. Needed here for TWO reasons, and the second
      # is the load-bearing one:
      #   1. It is reference data only — `MATCH_SKILLS` + the symmetric `skill_related`
      #      pairs from @badabhai/taxonomy. No worker data, no PII, deterministic,
      #      checked-in (invariant #4). Re-running is a row-level no-op.
      #   2. It writes THE SINGLE ACTIVE `match_config` ROW. Migration 0057 ships the
      #      table STRUCTURE and deliberately seeds no values, and no migration anywhere
      #      INSERTs into `match_config` — D1 is the only writer. Without it the verifier
      #      below fails check G ("expected exactly 1 active match_config row, found 0")
      #      and exits 1. Measured by reading every check in verify-match-v1.ts, not
      #      assumed: on a migrated-but-unseeded database G is the ONLY failure.
      # `--apply` is required — every script in this family is dry-run by default.
      - name: Seed Matching V1 vocabulary (D1)
        run: pnpm --filter @badabhai/db db:seed:match:vocabulary --apply

      # The Matching V1 go/no-go verifier, which until now ran NOWHERE in CI — it was a
      # script the runbook tells a human to run by hand after the migration train, and
      # nothing checked that it still passes against the schema we actually ship.
      #
      # STRICTLY READ-ONLY (SELECTs + EXPLAINs; there is no --apply). It asserts the
      # things a unit test structurally cannot: skill_related symmetry (the table has NO
      # symmetry trigger, so this is one of only two places that guarantee holds), closed-
      # vocabulary integrity, tier truthfulness, the E8 tenure clamp, that the covering
      # indexes EXIST and kept their hand-appended INCLUDE payloads, and that 0059's
      # widened boost-tier CHECK admits all four codes.
      #
      # It runs BEFORE the test suites below on purpose: those seed and delete their own
      # fixtures, and a verifier that ran afterwards would be reading whatever a failed
      # cleanup left behind. Here its input is exactly "the migration train + D1", which
      # is the state the runbook actually gates on.
      - name: Verify Matching V1 schema + vocabulary (db:verify:match-v1)
        run: pnpm --filter @badabhai/db db:verify:match-v1

      # ---- DB-backed release gates (Matching V1 / ADR-0036, plus B-8b and #982) ----
      # These suites exist, are correct, and until #538 NEVER RAN in CI: each is
      # `describe.skipIf(process.env.RUN_DB_TESTS !== "1")`, and RUN_DB_TESTS was set
      # nowhere under .github/ (TD122). A skipped gate is a disclosed gap, not a pass.
      #   * rank-parity  — pins the `ORDER BY` in MatchFeedRepository.listCandidates to
      #                    `rankKeyCompare` in @badabhai/match-engine. The V1 rank tuple
      #                    lives in exactly those two places and a database cannot call a
      #                    TypeScript comparator, so the duplication is unavoidable; this
      #                    is the only thing that catches the two drifting apart.
      #   * boost-fences — the three ADR-0036 §7 fences (boost never passes the skill
      #                    gate, permutes order only, never touches the company's
      #                    candidate list). All three are properties of the SQL, so they
      #                    are unprovable without a real database.
      #   * apply-freeze — E16, "worker edits his profile after applying → the company's
      #                    list does not move". The freeze is the `ON CONFLICT DO UPDATE`
      #                    CASE in MatchApplyService.upsertDecision; the unit suite can
      #                    only assert that CASE text is PRESENT against a fake db. That
      #                    it EVALUATES as claimed — keeps on a re-apply, writes on a
      #                    skip→apply flip, and cannot tear under two racing applies — is
      #                    a property of Postgres. It uses two connection pools on purpose
      #                    (postgres.js pipelines one pool, which would fake the race).
      #   * current-profile-order — B-8b, "which `worker_profiles` row IS this worker's
      #                    profile". Seven readers each answered differently; one had no
      #                    ORDER BY at all and one had no per-worker dedup, so a
      #                    re-interviewed worker entered the payer pool twice. Every claim
      #                    is a property of an ORDER BY / DISTINCT ON, so a fake db can only
      #                    show the expression is present, never that it evaluates.
      #   * ai-cost-totals.db — migration 0077's three load-bearing claims, none of which
      #                    any other running test can reach. (a) ON DELETE CASCADE is the
      #                    ENTIRE DPDP erasure story for the two worker-linked totals
      #                    tables: `WorkersRepository.hardDelete` enumerates no table
      #                    names, so if either FK is wrong an erased worker's spend row
      #                    survives them and nothing else notices. (b) the running sum is
      #                    `numeric`, not a float that drifts (0.1 x 3 = "0.300000", not
      #                    0.30000000000000004). (c) a redelivered BullMQ job accrues
      #                    nothing, which is a property of the events table's real
      #                    ON CONFLICT DO NOTHING reporting "deduped" — a fake db can only
      #                    show the clause was asked for.
      #   * jobs-search-sql — #982, the follow-up to #974. `GET /jobs/search` 500'd on every
      #                    title-less search ("jobs in Jaipur") because the no-`q` relevance
      #                    key rendered as a BARE `0`, and Postgres reads a lone integer in
      #                    ORDER BY as an output-column ORDINAL: `ORDER BY position 0 is not
      #                    in select list`. Every test on that path was statement-level —
      #                    compile the Drizzle node, assert on the rendered string — so the
      #                    oracle was "the text looks right to us", never "the server accepts
      #                    it", and the defect shipped with CI fully green. This gate EXECUTES
      #                    the real repository against a real Postgres on six of the eight
      #                    (q, city, state) filter combinations the DTO can produce — none,
      #                    city, state, city+state, q, q+city; q+state and q+city+state are
      #                    a stated gap, documented in the file header — and pins the parts a
      #                    fake db also cannot judge: the relevance ladder, DESC NULLS LAST,
      #                    the id tiebreak, the limit+1 has_more probe, and that the
      #                    already-decided anti-join EVALUATES.
      #   * admin-dashboard.db — BP-5, the two claims behind `GET /admin/dashboard/summary`
      #                    that only a real database can settle. (a) THE PLATFORM AI-SPEND
      #                    TOTAL INCLUDES SPEND NO WORKER OWNS. `worker_ai_cost_totals` and
      #                    `platform_ai_cost_totals` carry identical column names, so summing
      #                    the wrong one compiles, typechecks and returns a plausible ₹ figure
      #                    — and silently omits every payer-side call (`skill_embedding` on a
      #                    posting write, `job_posting_chat_turn`), which exist ONLY in the
      #                    platform table. The gate accrues one worker-attributed AND one
      #                    payer-side call through the real writer and asserts the dashboard
      #                    moved by BOTH, and explicitly NOT by the worker one alone.
      #                    (b) profile progress counts a re-interviewed worker ONCE, under
      #                    `CURRENT_PROFILE_ORDER` — so the newest row, which after an
      #                    ai-service outage is an EMPTY draft placeholder, does not report a
      #                    fully-profiled worker as unprofiled. Both are properties of a
      #                    `FROM` clause and an `ORDER BY` EVALUATING, which a stubbed drizzle
      #                    handle cannot show.
      #
      # They need nothing but a MIGRATED Postgres, which the steps above already built:
      # this job's service container gets the whole chain (journal-driven, 0000 → head —
      # which is what puts 0077 in place for the cost gate) applied from scratch on every
      # run, so these gates are independent of which
      # migrations any deployed database has seen. Each suite seeds its own PII-free
      # fixtures and deletes them in afterAll, and neither needs the API process — hence
      # running here, before the API boots.
      #
      # RUN_DB_TESTS is scoped to THIS STEP. The `node` job runs the same apps/api suite
      # with no database and must keep skipping these files (TD126).
      # No --coverage on purpose: the thresholds are a whole-suite gate owned by the
      # `node` job, and a six-file run cannot meet them.
      - name: DB-backed gates (rank parity + boost fences + apply freeze + current profile + ai cost totals + jobs search + admin dashboard)
        env:
          RUN_DB_TESTS: "1"
        run: |
          set -eo pipefail
          # NO `--` before the filters: pnpm forwards it to the script verbatim, so
          # `test -- rank-parity` runs `vitest run -- rank-parity`, where vitest
          # ignores the filter and reruns the whole 2820-test suite. Measured, not
          # assumed — that is what the first push of this branch actually did.
          #
          # `--no-file-parallelism` IS LOAD-BEARING, and it is the one flag on this line
          # that is about correctness rather than plumbing. Vitest gives each FILE its own
          # worker and runs them concurrently; these seven share ONE Postgres, and four of
          # them INSERT INTO `workers` (current-profile-order, ai-cost-totals.db,
          # jobs-search-sql, and admin-dashboard.db itself). `admin-dashboard.db` reads a
          # summary, inserts one row, reads again and asserts the delta is exactly 1 — an
          # assertion about a GLOBAL count that any concurrent insert falsifies.
          #
          # Observed 2026-08-20 on an unrelated branch: `expected 2 to be 1`, from a second
          # worker landing inside that window. `main` was green on the same commit range,
          # so the gate was not failing — it was racing, and winning most of the time. A
          # required check that fails on other people's timing teaches everyone to re-run
          # it, which is how a real failure gets clicked through.
          #
          # Serialising costs nothing here (the whole step runs in ~4s) and is scoped to
          # THIS step on purpose: `apps/api/vitest.config.ts` stays parallel, because the
          # 2820-test `node` suite is database-free and has no shared state to race on.
          pnpm --filter @badabhai/api run test --no-file-parallelism rank-parity boost-fences apply-freeze current-profile-order ai-cost-totals.db jobs-search-sql admin-dashboard.db 2>&1 | tee db-gates-raw.log
          sed -e 's/\x1b\[[0-9;]*m//g' db-gates-raw.log > db-gates.log

          # (1) EACH GATE MUST HAVE EXECUTED. `describe.skipIf` makes an unarmed run
          #     exit 0 reporting "16 skipped" — precisely how these gates sat green for
          #     their whole life while proving nothing. Assert per FILE, because a
          #     suite-wide "some test passed" check is satisfied by unrelated tests.
          # The directory alternation must list EVERY directory a gate file lives in:
          # `ai-cost-totals.db` sits under src/ai, `jobs-search-sql` under src/jobs and
          # `admin-dashboard.db` under src/admin, and against a regex missing any one of them
          # this loop reports "did not run at all" on a perfectly good run. Widen it whenever a
          # gate lands in a new directory.
          for f in rank-parity boost-fences apply-freeze current-profile-order ai-cost-totals.db jobs-search-sql admin-dashboard.db; do
            line=$(grep -E "src/(ai|admin|match|profiles|jobs)/${f}\.test\.ts" db-gates.log | head -1 || true)
            if [ -z "$line" ]; then
              echo "::error::${f}.test.ts did not run at all — the vitest file filter matched nothing."
              exit 1
            fi
            case "$line" in
              *skipped*)
                echo "::error::${f}.test.ts SKIPPED — RUN_DB_TESTS is not reaching vitest, so this gate would have passed vacuously."
                exit 1
                ;;
            esac
          done

          # (2) …AND ONLY THE GATES. Guards the arg-forwarding bug above: if the filter
          #     stops reaching vitest, this step silently becomes a slow duplicate of the
          #     `node` job (and check (1) starts passing on unrelated tests). Update the
          #     expected count when adding a gate file to the command above.
          if ! grep -qE 'Test Files +7 passed \(7\)' db-gates.log; then
            echo "::error::Expected exactly the 7 gate files to run — the vitest file filter is not reaching vitest."
            grep -E 'Test Files|      Tests ' db-gates.log || true
            exit 1
          fi

      - name: Start API and run the Phase 1 E2E suite
        run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          API_PID=$!
          echo "API started (pid $API_PID) — waiting for /health…"
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/health >/dev/null 2>&1; then
              echo "API healthy after ${i}s"; break
            fi
            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "::error::API process exited during startup"; cat api.log; exit 1
            fi
            sleep 1
          done
          curl -sf http://localhost:3001/health >/dev/null \
            || { echo "::error::API never became healthy"; cat api.log; exit 1; }

          set +e
          pnpm --filter @badabhai/e2e test
          E2E_EXIT=$?
          set -e

          echo "----- API log (tail) -----"; tail -n 80 api.log || true
          kill "$API_PID" 2>/dev/null || true
          exit $E2E_EXIT

  # ---- CI-2 aggregator: branch protection requires THIS job, not individual ones ----
  # Always runs (if: always()), needs every PR-stage job. Passes only when every needed
  # job either succeeded or was skipped (path-filtered). This lets branch protection
  # require a single `ci-required` check instead of separately listing every job — the
  # owner must flip branch protection to require only `ci-required` for this to work.
  ci-required:
    if: always()
    # worker-app / payer-app added in #718, sast in #773, deps-audit in #788, payer-web-image
    # in #920 (GAP-XC-06). A path-filtered job that does not run reports `skipped`, which this
    # check treats as fine — only `failure`/`cancelled` fail it.
    #
    # `image-gate` REPLACES the two entries `ai-service-image` + `payer-web-image`, and it
    # gates EXACTLY the same two apps' image builds under exactly the same two path filters —
    # they were merged into one matrixed job so the gate and the publish expand one shared
    # matrix (see `image-gate`). WHAT `ci-required` GATES IS UNCHANGED by that merge: no app
    # was added to the PR gate (`api` carries an empty `gate` field in the matrix and is
    # still built only on a push to main), and no app was removed from it. A matrix job's
    # aggregate `result` is `failure` if ANY leg failed, so one app's broken Dockerfile still
    # fails this check.
    needs:
      [
        changes,
        node,
        ai-service,
        image-gate,
        e2e,
        worker-app,
        payer-app,
        sast,
        deps-audit,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Check for CI failures
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "All CI jobs passed or were skipped"

  # ---- Build and Push Docker Images (one matrix leg per app) ----
  #
  # WHY THIS IS A MATRIX NOW, AND WHY THE PREVIOUS "ONE ATOMIC JOB" ARGUMENT WAS WRONG.
  # This job used to build all three images as hand-copied step-triples inside a SINGLE
  # job, on the stated reasoning that "the deploy job below pulls BOTH images, so one job
  # means 'images ready' stays a single, atomic `needs:` edge instead of two that can
  # half-succeed". MEASURED 2026-08-18: that atomicity is exactly what broke the box.
  # apps/api and apps/ai-service built AND PUSHED successfully; the payer-web step then
  # failed; the job reported `failure`; `deploy-lightsail` SKIPPED — and the box received
  # NOTHING. One app's build error blocked two healthy, already-pushed services from
  # deploying. A fourth app (admin-web) makes that strictly worse.
  #
  # `fail-fast: false` IS THE FIRST HALF OF THE FIX: one app's failure no longer cancels
  # the others, so every app that CAN build still gets pushed. The second half lives in
  # `deploy-lightsail` below, which now deploys whatever image actually exists for this
  # commit and then FAILS LOUDLY at the end if any expected image was missing —
  # availability without losing the signal. Read the two together; neither works alone.
  #
  # ONE SOURCE OF TRUTH WITH THE PR GATE. The matrix is the SAME `changes` output that
  # `image-gate` expands, so an app's context / Dockerfile / image name / cache scope /
  # NEXT_PUBLIC_* switch cannot differ between what a PR gates and what `main` ships —
  # the drift that shipped a broken payer-web image. Adding admin-web is one row in the
  # `image-matrix` step, not another copy of these steps.
  #
  # The job KEY is deliberately unchanged (a rename would silently break any branch
  # protection or `needs:` that references it). `name:` now carries the matrix leg, which
  # a matrix job's check name does anyway; this job never runs on a `pull_request`, so it
  # is structurally incapable of being a required check on a PR.
  build-and-push-image:
    name: Build & Push Docker Image (${{ matrix.app }})
    needs: [changes, node, ai-service, e2e]
    # BUG FIXED HERE: this `if:` used to be the plain boolean
    #   `github.event_name == 'push' && github.ref == 'refs/heads/main'`
    # with no `always()`/`success()`/`failure()`/`cancelled()` anywhere in it. Per GitHub
    # Actions semantics, a job-level `if:` with none of those functions gets an IMPLICIT
    # `&& success()` ANDed across every job in `needs:` — and a job that is `skipped`
    # (not run) never satisfies `success()`. `ai-service` AND `e2e` are BOTH path-filtered
    # by the `changes` job above and report `skipped` on most pushes to main: `ai-service`
    # skips unless `apps/ai-service/**` or `packages/profiling-lexicon/**` changed, and
    # `e2e` skips unless `apps/api/**`, `packages/**`, `tests/**`, the lockfile/workspace/
    # turbo config, `apps/ai-service/**`, or this workflow file changed — so a frontend-
    # only, docs-only, or infra-only push skips BOTH. Net effect: this job (and
    # `deploy-lightsail` below it, via `needs: [build-and-push-image]`) silently skipped
    # for the large majority of pushes to main — no new images built or pushed, nothing
    # deployed to Lightsail — even though the job's own explicit condition (push to main)
    # was true. Confirmed via `gh run view` on real runs.
    #
    # `always()` removes that implicit success() gate; the explicit checks below become
    # the ONLY gate, mirroring the `ci-required` idiom above (a path-filtered job's `skip`
    # is fine, its `failure`/`cancelled` is not): `node` carries no path filter of its own
    # (it always runs) so it must have actually succeeded; `ai-service` and `e2e` must
    # each have either succeeded or been skipped by the path filter — never have actually
    # run and failed, and never have been cancelled.
    #
    # `changes` IS ALSO A REQUIRED `needs:` ENTRY, and must be `success` (not merely
    # allowed to be skipped or absent from the expression) — this closes a real gap an
    # adversarial review caught in an earlier version of this fix. `ai-service` and `e2e`
    # each derive their own skip/run decision from `needs.changes.outputs.*` via a PLAIN
    # `if:`, so they ALSO carry an implicit `&& success()` on `changes`. If `changes`
    # itself fails (dorny/paths-filter errors, its checkout step fails — a real, if
    # infrequent, CI-infra failure category), `ai-service` and `e2e` both report
    # `skipped` — indistinguishable, at the `needs.*.result` level, from a legitimate
    # "no relevant paths touched" skip. `node` has no dependency on `changes` at all and
    # can independently report `success` in that scenario. Without `changes` in THIS
    # job's own `needs:`, `needs.changes.result` is not even in scope for this
    # expression, so nothing here could tell the two cases apart — this job would run
    # and push images with NONE of the path-filtered validation having actually
    # executed, which is precisely the failure class this fix exists to eliminate, one
    # hop up the dependency graph. `ci-required` does not have this gap because `changes`
    # IS directly in ITS `needs:` list, so a `changes` failure surfaces there as
    # `needs.changes.result == 'failure'`, caught by its `contains(needs.*.result,
    # 'failure')` check regardless of how ai-service/e2e cascade.
    if: >-
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      needs.node.result == 'success' &&
      (needs.ai-service.result == 'success' || needs.ai-service.result == 'skipped') &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # THE FAILURE-ISOLATION HALF OF THE FIX (see this job's header). Without it, one
      # app's build error cancels the sibling legs and the box gets nothing — measured
      # 2026-08-18 on payer-web, which blocked an already-pushed api and ai-service from
      # deploying. With it, every app that CAN build is pushed, `deploy-lightsail` ships
      # whatever exists, and the run still ends RED because this job's aggregate result is
      # `failure` when any leg failed.
      fail-fast: false
      matrix:
        # THE SAME data `image-gate` expands. Never a second, hand-kept list.
        include: ${{ fromJSON(needs.changes.outputs.image-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        # REQUIRED for CD-5: the runner's stock `docker` driver CANNOT export a
        # `type=gha` cache — buildx hard-errors before the build starts. This
        # action configures the docker-container driver, which can.
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for the ${{ matrix.app }} image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        env:
          # CD-4: pin the short-sha length so the `type=sha` tag provably matches the
          # deploy job's `cut -c1-7` below (7 IS metadata-action's default — pinned
          # against upstream drift; harmless on versions predating the env var). ONE
          # matrix leg per image means this pin now covers every image by construction,
          # rather than by being remembered three times.
          DOCKER_METADATA_SHORT_SHA_LENGTH: "7"
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          # CD-4: declaring `tags:` replaces ALL metadata-action defaults, so the
          # previously-implicit branch behavior is now declared explicitly:
          #   type=ref,event=branch -> the mutable :main tag (humans / local pulls)
          #   type=sha              -> the IMMUTABLE :sha-<short7> tag (default
          #                            prefix "sha-", format=short) that the deploy
          #                            pins. Rollback = API_IMAGE=...:sha-<prev> +
          #                            compose up (docs/rollback-guide.md).
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push the ${{ matrix.app }} Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          # CONTEXT IS PER-APP MATRIX DATA and it is not uniform: apps/api and
          # apps/payer-web build from the REPO ROOT (both depend on workspace packages —
          # payer-web on @badabhai/config, @badabhai/pricing, @badabhai/validators), while
          # apps/ai-service builds from its OWN directory (pure Python, no workspace deps,
          # and apps/ai-service/.dockerignore rather than the root one filters it). See
          # each Dockerfile's header.
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # THIS BLOCK IS BYTE-IDENTICAL TO `image-gate`'s — that equality IS the fix for
          # the 2026-08-18 incident, in which this job passed two build-args that the PR
          # gate did not, so the gate was green on a build nobody ships. Change one, change
          # the other; there is no third place.
          #
          # THE TWO NEXT_PUBLIC_* VALUES ARE SUPPLIED ONLY HERE — baked into the image at
          # build time, never read at container start (apps/payer-web/Dockerfile's header
          # explains why). Both resolve to an EMPTY STRING when the repository secret does
          # not exist, which is SAFE rather than a build failure: the Dockerfile treats an
          # empty ARG as "unset" and falls back to @badabhai/config's schema defaults. To
          # set a real value, add PAYER_WEB_NEXT_PUBLIC_API_URL / _SITE_URL as repository
          # secrets and push a new commit — a REBUILD, not just a redeploy, is required.
          # `matrix.next-public` is what limits them to payer-web; a false switch renders
          # the line empty and docker/build-push-action@v7 drops empty entries, so api and
          # ai-service receive exactly the single GIT_COMMIT_SHA arg they receive today.
          #
          # #965: GIT_COMMIT_SHA reaches EVERY image. It is THE SAME short sha the
          # `type=sha` tag above is built from — one derivation, in the `changes` job — so
          # a container's /health self-report and the `sha-<short7>` tag the deploy pins
          # can never disagree. NEVER pass a real secret as a build arg: build args are
          # readable in `docker history`. A commit sha and two public URLs are not.
          build-args: |
            ${{ matrix.next-public && format('NEXT_PUBLIC_API_URL={0}', secrets.PAYER_WEB_NEXT_PUBLIC_API_URL) || '' }}
            ${{ matrix.next-public && format('NEXT_PUBLIC_SITE_URL={0}', secrets.PAYER_WEB_NEXT_PUBLIC_SITE_URL) || '' }}
            GIT_COMMIT_SHA=${{ needs.changes.outputs.short-sha }}
          # CD-5: GitHub Actions layer cache (needs the buildx docker-container driver set
          # up above), with a DISTINCT SCOPE PER APP so the images cannot evict each
          # other's layers. The expensive one is the api's WeasyPrint apt+pip install
          # (Pango/cairo native stack); ai-service's is a small pip install of
          # requirements-ai.txt. `buildkit` is the api's scope because that is the
          # DOCUMENTED DEFAULT of the `type=gha` backend — i.e. the exact scope its
          # previously-unscoped `cache-from: type=gha` already wrote to, so this refactor
          # does not cold-start it.
          #
          # mode=max also caches intermediate (builder) stages. The api's builder stage
          # churns multi-GB per run (full monorepo + node_modules), so if the 10 GB
          # Actions Cache quota starts evicting the turbo/pip caches (CI-5), drop to
          # mode=min — it caches final-image layers only, which STILL keeps the WeasyPrint
          # layer (it lives in the final runtime stage). ai-service is the cheaper of the
          # two to drop first.
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}

  # ---- AWS Lightsail Deployment ----
  deploy-lightsail:
    name: Deploy to AWS Lightsail
    # BUG FIXED HERE (follow-up to #797): the comment this replaced argued the plain
    # `if:` was CORRECT because this job's only dependency, `build-and-push-image`, is
    # no longer path-filtered. That reasoning was wrong, and #797 shipped it anyway —
    # confirmed on the very next real merge (#797's own merge commit, run 31573045370):
    # `build-and-push-image` succeeded, yet this job STILL reported `skipped`, twice
    # (the original run and a manual single-job rerun of just this job).
    #
    # The actual mechanism: GitHub's IMPLICIT `success()` — applied to any job whose
    # `if:` omits always()/success()/failure()/cancelled() — is NOT scoped to that
    # job's DIRECT `needs:` only. It evaluates over the job's ENTIRE TRANSITIVE
    # ancestor chain. `ai-service` (path-filtered, reports `skipped` on most pushes)
    # is a transitive ancestor of THIS job via `build-and-push-image`. `build-and-
    # push-image` absorbs that skip for ITSELF via its own always()-idiom and reports
    # `success` — but that absorption does not "cleanse" the ancestry for jobs
    # further downstream: each hop needs its OWN explicit override, or the transitive
    # skip keeps propagating past a hop that locally reports `success`.
    #
    # Reproduced live on a throwaway branch/workflow before this fix (mirroring this
    # exact 3-hop topology: a legitimately-skipped job -> an always()-idiom absorber
    # that reports success -> a plain-`if:` consumer of ONLY that absorber): the
    # consumer skipped despite its sole direct dependency succeeding. Re-tested with
    # this exact fix applied: the consumer then reported `success`, as expected.
    #
    # The fix: the same always() + explicit needs.*.result idiom as build-and-push-
    # image and ci-required. Unlike build-and-push-image's tolerance of ai-service/
    # e2e being `skipped` (a LEGITIMATE path-filtered outcome for those jobs),
    # deploy-lightsail requires build-and-push-image.result == 'success' ONLY —
    # build-and-push-image carries no path filter of its own, so FROM THIS JOB'S
    # point of view a `skipped` build-and-push-image is never a legitimate "nothing
    # relevant changed" outcome; it means the push-to-main/branch condition was false
    # or something upstream genuinely failed — either way this job should also skip.
    #
    # `'failure'` IS NOW ALSO ACCEPTED, AND THAT IS THE POINT OF THIS CHANGE. `build-and-
    # push-image` is a `fail-fast: false` MATRIX: its aggregate result is `failure` when
    # ANY leg failed, even though the other legs built AND PUSHED successfully. Requiring
    # `success` alone is exactly what took the box down on 2026-08-18 — api and ai-service
    # were sitting in ghcr, tagged for that commit, and this job skipped because payer-web
    # had failed, so NOTHING was deployed. Accepting `failure` lets the deploy ship what
    # actually exists; the remote script below probes the registry per service and then
    # FAILS THE JOB at the end for anything missing, so availability is bought WITHOUT
    # losing the signal. Never one of those two without the other.
    #
    # `cancelled` and `skipped` are still NOT accepted: a cancelled build may have been
    # interrupted mid-push, and a skipped one means this push never qualified.
    # `changes` is needed for its `image-matrix` output, NOT for a path decision: the
    # step below cross-checks the set of images this run BUILDS against the set this
    # script actually DEPLOYS (M2). Adding it to `needs:` re-arms the transitive-skip
    # trap this file documents, so its result is asserted explicitly alongside
    # `always()` — a bare `needs:` would let a skipped `changes` drag this job with it.
    needs: [changes, build-and-push-image]
    if: >-
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      (needs.build-and-push-image.result == 'success' ||
       needs.build-and-push-image.result == 'failure')
    runs-on: ubuntu-latest
    # CD-1: the job token needs packages:read so the BOX can docker-login with the
    # ephemeral GITHUB_TOKEN below (only one permissions: block existed in this file
    # — the build job's — so this job inherited the repo default, which may exclude
    # packages). contents:read is the safe floor.
    permissions:
      contents: read
      packages: read
    # CD-1 / Gate D1 — RESOLVED 2026-08-18 (owner: Prakash). This box IS production, so
    # the job now binds the `production` environment. The previous revision of this
    # comment named the exact condition ("if the owner rules this box is PRODUCTION,
    # rename AND add a required reviewer"); both halves are done — `production` carries
    # a required_reviewers rule (kpdagrt22, divyuuu), so every run of this job, INCLUDING
    # A ROLLBACK, now waits on a human approval. Budget for that during an incident.
    #
    # THE COMPOSE FILENAME STILL SAYS "staging" AND THAT IS DELIBERATELY NOT CHANGED HERE.
    # `docker-compose.staging.yml` is the real production overlay for this box and has been
    # for months; renaming it is a separate, purely cosmetic change, and bundling it with a
    # secret-scope switch would make the diff that moved 26 credentials unreviewable.
    #
    # WHAT THIS LINE ACTUALLY CHANGES: `${{ secrets.X }}` below resolves environment scope
    # FIRST and repo scope only as a fallback, so flipping this word re-points every one of
    # the 26 bridged names. Ten of them now resolve from a different scope than they did
    # yesterday — see the audit in the PR body. Two consequences worth stating inline:
    #   * DATABASE_URL exists in BOTH scopes, so this line swaps which database the box is
    #     told to serve. It is the single highest-risk name in the list.
    #   * AI_ENABLE_REAL_CALLS is now `true` in the production environment, on purpose
    #     (owner, 2026-08-18). Combined with the GEMINI_FLASH_API_KEY that production scope
    #     also holds, this arms REAL provider calls for `profiling_chat_turn` — the one task
    #     docker-compose.staging.yml's `AI_REAL_CALL_TASKS` default allowlists. The two
    #     taxonomy gates stay `false` in that same scope; Phase-9 activation is unrelated
    #     to this change and is not authorized.
    environment: production
    steps:
      # ---- M2: EVERY IMAGE THIS RUN BUILDS MUST HAVE SOMEWHERE TO GO ----
      #
      # The build side is now data-driven (one `MATRIX_JSON` row per app in `changes`),
      # but the remote script below is still an explicit list: one `pull_image` call and
      # one `image_present` block per service. Those two sets can drift APART SILENTLY,
      # and the dangerous direction is the one that looks fine: add an app to the matrix
      # and forget the deploy blocks, and the image builds, pushes, is never deployed,
      # leaves `MISSING_IMAGES` empty — and this job goes GREEN while that service sits
      # on an old image indefinitely. That is exactly the stale-image failure this whole
      # PR exists to eliminate, running in the opposite direction.
      #
      # This is deliberately an ASSERTION rather than deriving the deploy from the
      # matrix: each service has a bespoke start order, health URL, port and timeout
      # (redis -> ai-service -> api -> payer-web), and generating that from data would
      # trade a loud, cheap check for a subtle one on the live production deploy path.
      # Cross-check the sets, fail loudly, keep the ordering explicit and readable.
      #
      # Adding a service is therefore: one matrix row, one `pull_image` line, one
      # `image_present` block, and one name here. Miss the last three and CI tells you.
      - name: Assert every built image has a deploy block
        env:
          IMAGE_MATRIX: ${{ needs.changes.outputs.image-matrix }}
        run: |
          set -euo pipefail

          # The services the remote script below actually deploys. KEEP IN STEP with its
          # `pull_image` / `image_present` blocks — that is what this step enforces.
          DEPLOYS="api ai-service payer-web admin-web"

          # `tr -d '\r'` is defensive, not decorative. THIS CHECK CAN BLOCK EVERY DEPLOY,
          # so it must never fail for a reason unrelated to what it is asserting. Caught
          # while mutation-testing this step: jq on a Windows shell emits CRLF, leaving a
          # trailing \r on every app name but the last, so `*" api\r "*` matches nothing
          # and all-but-one app is reported "never deployed" — a false positive that would
          # stop all shipping. GitHub's ubuntu runners emit LF and would not have shown
          # this, which is exactly why it is worth stripping rather than assuming the
          # runner. Cheap insurance on a safety check whose failure mode is total.
          BUILT="$(printf '%s' "$IMAGE_MATRIX" | jq -r '.[].app' | tr -d '\r')"
          if [ -z "$BUILT" ]; then
            echo "::error::the image matrix resolved to no apps — refusing to deploy, since this job could not then detect a single missing image."
            exit 1
          fi

          UNDEPLOYED=""
          for app in $BUILT; do
            case " $DEPLOYS " in
              *" $app "*) ;;
              *) UNDEPLOYED="${UNDEPLOYED}${UNDEPLOYED:+ }$app" ;;
            esac
          done

          if [ -n "$UNDEPLOYED" ]; then
            echo "::error::built and pushed but NEVER DEPLOYED: ${UNDEPLOYED}. These apps are in the image matrix but have no pull_image/image_present block in the deploy script, so their new image would be published and silently ignored while this job reported success. Add them to the remote script AND to DEPLOYS in this step."
            exit 1
          fi

          echo "Image matrix and deploy set agree: $(printf '%s' "$BUILT" | tr '\n' ' ')"

      - name: Deploy via SSH
        # SHA-pinned (was the mutable v1.0.3 tag): 12 production secrets now flow
        # through this action's container — a hijacked tag would see them all.
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        # CD-1b: the docker-compose.staging.yml `${VAR:?}` gate reads the BOX's
        # shell environment — GitHub environment/repo secrets do NOT reach it on
        # their own (the first health-gated run proved it: INTERNAL_SERVICE_TOKEN
        # was SET as an environment secret yet compose failed "missing a value").
        # This env + `envs:` pair is the bridge: each var resolves environment-
        # scoped secret first, repo secret as fallback, and drone-ssh exports the
        # names listed in `envs:` into the remote session. Values never print —
        # compose reads them from the environment and the script never echoes them.
        # WARNING: NEVER add `debug: true` (prints the export lines WITH values, and the
        # quote-escaping defeats Actions masking) or `allenvs: true` (would export
        # INPUT_KEY — the SSH private key — into the remote session).
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PII_ENCRYPTION_KEY: ${{ secrets.PII_ENCRYPTION_KEY }}
          PII_HASH_PEPPER: ${{ secrets.PII_HASH_PEPPER }}
          PIN_PEPPER: ${{ secrets.PIN_PEPPER }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          INTERNAL_SERVICE_TOKEN: ${{ secrets.INTERNAL_SERVICE_TOKEN }}
          FAST2SMS_API_KEY: ${{ secrets.FAST2SMS_API_KEY }}
          FAST2SMS_SENDER_ID: ${{ secrets.FAST2SMS_SENDER_ID }}
          FAST2SMS_DLT_TEMPLATE_ID: ${{ secrets.FAST2SMS_DLT_TEMPLATE_ID }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          LANGFUSE_TRACING_ENVIRONMENT: ${{ secrets.LANGFUSE_TRACING_ENVIRONMENT }}
          AI_ENABLE_REAL_CALLS: ${{ secrets.AI_ENABLE_REAL_CALLS }}
          GEMINI_FLASH_API_KEY: ${{ secrets.GEMINI_FLASH_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

          # Payer OTP email (ADR-0019) — the ZeptoMail analogue of the FAST2SMS_* trio
          # above. EMAIL_PROVIDER/ZEPTOMAIL_SANDBOX_MODE are NOT here: they now default
          # correctly at the compose level (docker-compose.staging.yml's
          # `${EMAIL_PROVIDER:-zeptomail}` / `${ZEPTOMAIL_SANDBOX_MODE:-false}`), so only
          # the actual credentials — which have no safe default — need a secrets channel.
          # #813 — ZEPTOMAIL_API_URL was missing from this list entirely (compose declared
          # no pass-through for it either), so every real ZeptoMail send failed closed on
          # `sendViaZeptoMail`'s own `!apiUrl` guard, silently, on every box this ever ran on.
          # Phase 9 / Path A. INERT: neither secret exists, so both render EMPTY here,
          # export empty, and resolve to `false` at compose's `${VAR:-false}`. Landing the
          # bridge before creating any secret is deliberate — it proves the three hops in
          # isolation, with the deployed behaviour byte-identical to before.
          DOMAIN_MATCH_ENABLED: ${{ secrets.DOMAIN_MATCH_ENABLED }}
          SKILL_CANONICALIZE_ENABLED: ${{ secrets.SKILL_CANONICALIZE_ENABLED }}
          ZEPTOMAIL_API_URL: ${{ secrets.ZEPTOMAIL_API_URL }}
          ZEPTOMAIL_API_TOKEN: ${{ secrets.ZEPTOMAIL_API_TOKEN }}
          ZEPTOMAIL_MAIL_AGENT: ${{ secrets.ZEPTOMAIL_MAIL_AGENT }}
          EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_FROM_ADDRESS }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}

          # ---- GAP-XC-06 (#920): payer-web's external port, box-specific and NOT a
          # secret in the confidentiality sense — bridged through `secrets.*` anyway,
          # for the SAME reason CORS_ALLOWED_ORIGINS above is: consistency with the one
          # mechanism this job already has for getting a box-specific value from GitHub
          # into the remote session, and so a CI-triggered deploy does not depend on the
          # box's own persistent shell state (the weaker path this file's own CD-1b
          # comment reserves for manual/rollback runs only).
          #
          # OPTIONAL, an OVERRIDE only — this secret does not have to exist, and for the
          # CURRENT box it should not: 3333 (the compose default) is the owner-confirmed
          # free port there. Unset here arrives on the box as the empty string, and
          # compose's `${PAYER_WEB_PORT:-3333}` (the `:-` form substitutes on empty as well
          # as on unset) resolves it to 3333 either way. It is deliberately NOT fail-loud:
          # compose interpolates the
          # whole staging file before filtering by service, so a `:?` here would fail
          # `$COMPOSE pull api` — taking the live api/ai-service deploy down over an
          # unrelated missing secret. See the service block in docker-compose.staging.yml
          # for the measured proof.
          PAYER_WEB_PORT: ${{ secrets.PAYER_WEB_PORT }}
          # admin-web's box port — identical contract to PAYER_WEB_PORT above: OPTIONAL, an
          # override only, `:-3003` defaulted in compose rather than fail-loud, for the same
          # measured reason. It does not exist as a secret today and need not: 3003 is free
          # on this box and is the compose default. Bridged anyway so that compose and the
          # deploy script's health poll read ONE channel — otherwise creating the secret
          # later would move the published port while the poll still checked 3003.
          ADMIN_WEB_PORT: ${{ secrets.ADMIN_WEB_PORT }}
          # #994 — the four values scripts/deploy/staging-deploy.sh needs that are RUNNER-SIDE
          # GitHub context and therefore unknowable on the box. They used to be `${{ }}`
          # interpolated straight into the inline script; with the script in a file they must
          # be bridged as environment variables (and listed in `envs:` below, or the ssh
          # action does not forward them).
          #
          # GH_SHA is the one to be careful with: it builds the immutable `sha-<short7>` image
          # tag. Bridged empty, the box would resolve `...:sha-` and pull nothing — so the
          # script asserts all four are non-empty before it does anything.
          GH_SHA: ${{ github.sha }}
          GH_ACTOR: ${{ github.actor }}
          GH_REPOSITORY: ${{ github.repository }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          # `timeout` = SSH connection timeout; `command_timeout` = the script's
          # run budget (appleboy default is 10m — pinned explicitly so the health
          # poll below can never be silently cut short by an upstream default change).
          timeout: 10m
          command_timeout: 10m
          envs: JWT_SECRET,PII_ENCRYPTION_KEY,PII_HASH_PEPPER,PIN_PEPPER,ADMIN_JWT_SECRET,DATABASE_URL,REDIS_URL,INTERNAL_SERVICE_TOKEN,FAST2SMS_API_KEY,FAST2SMS_SENDER_ID,FAST2SMS_DLT_TEMPLATE_ID,ZEPTOMAIL_API_URL,ZEPTOMAIL_API_TOKEN,ZEPTOMAIL_MAIL_AGENT,EMAIL_FROM_ADDRESS,CORS_ALLOWED_ORIGINS,LANGFUSE_PUBLIC_KEY,LANGFUSE_SECRET_KEY,LANGFUSE_TRACING_ENVIRONMENT,LANGFUSE_BASE_URL,AI_ENABLE_REAL_CALLS,GEMINI_FLASH_API_KEY,ANTHROPIC_API_KEY,DOMAIN_MATCH_ENABLED,SKILL_CANONICALIZE_ENABLED,PAYER_WEB_PORT,ADMIN_WEB_PORT,GH_SHA,GH_ACTOR,GH_REPOSITORY,GHCR_TOKEN
          # #994 — THE BODY OF THIS DEPLOY LIVES IN scripts/deploy/staging-deploy.sh.
          #
          # It is not inlined here because GitHub Actions caps a single step input at
          # roughly 21 KB, this script had reached 20,342 characters (~97% of that), and
          # crossing the cap does not fail helpfully: the ENTIRE workflow file becomes
          # unparseable, no run is created at all, and `ci-required` never appears — so
          # every PR touching ci.yml is BLOCKED with no explanation anywhere. Two PRs hit
          # that on 2026-08-19. Keeping this block tiny is what stops it recurring, and
          # ci-deploy-script-size.guard.test.ts asserts it stays that way.
          #
          # ORDER IS LOAD-BEARING: `git pull` must precede the script, because the pull is
          # what puts THIS COMMIT's version of it on the box. Everything else — the GHCR
          # login and its logout trap, the disk reclaim, the image pulls, the health gates —
          # is in that file, comments and all.
          script: |
            set -e
            cd ~/deployments/badabhai-platform
            echo "Pulling latest code from main..."
            git pull origin main
            bash scripts/deploy/staging-deploy.sh
