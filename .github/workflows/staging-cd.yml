# Persistent-staging CD for @badabhai/api — GUARDED / INERT BY DEFAULT (BLOCKER #1).
#
# Stands up the PERSISTENT staging API end-to-end: build -> migrate -> trigger the
# host's deploy -> smoke the PUBLIC URL (/health). Companion runbook:
# docs/ops/staging-service-deploy-runbook.md (the SERVICE runbook; the EPHEMERAL
# demand-loop proof is staging-demand-verify.yml + bug2-staging-demand-deploy-runbook.md).
#
# IT IS INERT UNTIL A HUMAN WIRES STAGING (mirrors staging-demand-verify.yml):
#   - manual trigger ONLY (workflow_dispatch); no push/PR triggers.
#   - it reads its secrets from the GitHub `staging` ENVIRONMENT secrets.
#   - the FIRST "guard" step checks the required secrets are present. If ANY is empty
#     it prints a clear "staging not wired" ::notice:: and exits 0 (no-op, wired=false)
#     WITHOUT building/migrating/deploying — so it cannot run half-configured.
#   To activate: create the `staging` GitHub Environment and add the secrets listed
#   in the guard step (and the runbook's env-var table).
#
# ────────────────────────────────────────────────────────────────────────────────
# POSTURE = REAL-ONLY OTP (Fast2SMS + ZeptoMail). NODE_ENV=staging with REAL provider
#   credentials injected from the `staging` environment secrets — the app fails CLOSED at
#   boot without them (there is no console/mock OTP). A real JWT_SECRET + PII keys are also
#   injected (sessions non-forgeable, crypto real). All OTHER real-provider gates
#   (payments/AI/WhatsApp) STAY false. Sending real SMS/email is REAL SPEND, so staging MUST
#   be SYNTHETIC-DATA-ONLY + TEAM-RESTRICTED, and activation is the OTP-7 human gate
#   (docs/ops/otp-real-send-staging-runbook.md). The automated smoke is /health only — the
#   end-to-end real-send check is the manual OTP-7 proof.
# ────────────────────────────────────────────────────────────────────────────────
#
# MOCK-ONLY (non-negotiable): PAYMENTS_ENABLE_REAL / AI_ENABLE_REAL_CALLS /
# MESSAGING_ENABLE_REAL are forced false here. Flipping any provider is a separate
# CLAUDE.md §7 gate and is OUT of scope.
#
# TD81(a) SCOPE NOTE — this workflow deploys NO ai-service, by construction. The
# FastAPI service was containerised and wired into the LIGHTSAIL path only
# (apps/ai-service/Dockerfile + the ai-service service in docker-compose.yml /
# docker-compose.staging.yml, pulled and health-gated by ci.yml's deploy-lightsail).
# This job builds nothing with docker and hands the deploy to a managed host via an
# opaque webhook, so it has no image to push and no place to put a second process:
# whatever that host runs, its AI_SERVICE_URL is the host's own config, and if it
# points at nothing the API still degrades to its safe TypeScript mock with /health
# at 200 — the exact silent-mock state TD81 describes. The env block below is the
# RUNNER's (it governs the build/migrate steps), NOT the deployed host's. Anyone
# activating this path owns pointing that host at a real ai-service, or accepting —
# knowingly — that its AI is mocked.
#
# A GitHub Actions runner is EPHEMERAL — it CANNOT host the persistent API. This job's
# role is: build -> migrate the disposable staging DB -> TRIGGER the host's deploy
# (optional webhook) -> smoke the public URL. The host (Render/Railway/Fly/Coolify/VM)
# is the human's choice; the deploy is modeled as a STAGING_DEPLOY_HOOK_URL webhook and
# is SKIPPED with a notice when unset (the host may auto-deploy from the repo, or the
# human deploys via their own CLI — a documented seam, see the runbook).

name: Staging CD (persistent @badabhai/api)

on:
  workflow_dispatch: {}

concurrency:
  group: staging-cd
  cancel-in-progress: false

jobs:
  deploy:
    name: Build -> migrate -> deploy -> smoke (real-only OTP)
    runs-on: ubuntu-latest
    # Bind to the protected `staging` environment; secrets resolve from it.
    environment: staging
    env:
      # ---- Pulled from the `staging` GitHub Environment SECRETS. Empty until wired. ----
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PII_ENCRYPTION_KEY: ${{ secrets.PII_ENCRYPTION_KEY }}
      PII_HASH_PEPPER: ${{ secrets.PII_HASH_PEPPER }}
      INTERNAL_SERVICE_TOKEN: ${{ secrets.INTERNAL_SERVICE_TOKEN }}
      # A REAL JWT_SECRET is injected even in Mode A so worker/payer sessions are
      # non-forgeable (the dev default would let anyone forge a session).
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      # REDIS_URL backs the OTP per-IP cap + HMAC code store (and the BullMQ client);
      # the mock-OTP smoke implicitly proves it is reachable.
      REDIS_URL: ${{ secrets.REDIS_URL }}
      # The PUBLIC HTTPS base URL of the persistent staging API (what the smoke hits,
      # what the handset/payer-web point at). Set by the human after the host is up.
      STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
      # OPTIONAL managed-host deploy webhook. Empty => skip the deploy with a notice
      # (the host auto-deploys from the repo, or the human deploys via their host CLI).
      STAGING_DEPLOY_HOOK_URL: ${{ secrets.STAGING_DEPLOY_HOOK_URL }}

      # ---- REAL-ONLY OTP posture (plain workflow env — NOT secrets). ----
      # Worker OTP is REAL Fast2SMS; payer OTP is REAL ZeptoMail. There is no console/mock
      # provider, so NODE_ENV is "staging" (not development) and the real provider creds are
      # REQUIRED from the `staging` environment secrets below — the app fails CLOSED at boot
      # without them (assertAuthConfig / assertPayerAuthConfig). Sending real SMS/email is
      # REAL SPEND, so staging MUST be a CONTROLLED, synthetic-data, team-restricted
      # environment, and activation is the OTP-7 human gate (docs/ops/otp-real-send-staging-runbook.md).
      NODE_ENV: staging
      SMS_PROVIDER: "fast2sms"
      EMAIL_PROVIDER: "zeptomail"
      FAST2SMS_API_KEY: ${{ secrets.FAST2SMS_API_KEY }}
      FAST2SMS_SENDER_ID: ${{ secrets.FAST2SMS_SENDER_ID }}
      FAST2SMS_DLT_TEMPLATE_ID: ${{ secrets.FAST2SMS_DLT_TEMPLATE_ID }}
      FAST2SMS_ENTITY_ID: ${{ secrets.FAST2SMS_ENTITY_ID }}
      ZEPTOMAIL_API_TOKEN: ${{ secrets.ZEPTOMAIL_API_TOKEN }}
      ZEPTOMAIL_MAIL_AGENT: ${{ secrets.ZEPTOMAIL_MAIL_AGENT }}
      EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_FROM_ADDRESS }}
      # Mock-only provider gates — forced false (real payments/AI/WhatsApp are separate §7 gates).
      PAYMENTS_ENABLE_REAL: "false"
      AI_ENABLE_REAL_CALLS: "false"
      MESSAGING_ENABLE_REAL: "false"
    steps:
      # ---- GUARD: inert until the `staging` environment + secrets exist ----
      # If any REQUIRED secret is empty, no-op (exit 0) without building/migrating/
      # deploying. STAGING_DEPLOY_HOOK_URL is OPTIONAL and is NOT part of this gate.
      - name: Check staging is wired (else no-op)
        id: guard
        run: |
          missing=""
          [ -z "$DATABASE_URL" ] && missing="$missing DATABASE_URL"
          # TD72(c): reject a DATABASE_URL that still points at the compose-internal
          # throwaway postgres — that would write real worker PII to a disposable volume
          # while /health (SELECT 1 + PING) reports 200.
          case "$DATABASE_URL" in
            *@postgres:*) echo "::error::DATABASE_URL=$DATABASE_URL resolves to compose-internal postgres — staging would write real worker PII to a disposable volume"; missing="$missing DATABASE_URL(compose-default)" ;;
          esac
          [ -z "$PII_ENCRYPTION_KEY" ] && missing="$missing PII_ENCRYPTION_KEY"
          [ -z "$PII_HASH_PEPPER" ] && missing="$missing PII_HASH_PEPPER"
          [ -z "$INTERNAL_SERVICE_TOKEN" ] && missing="$missing INTERNAL_SERVICE_TOKEN"
          [ -z "$JWT_SECRET" ] && missing="$missing JWT_SECRET"
          [ -z "$REDIS_URL" ] && missing="$missing REDIS_URL"
          # TD72(c): reject a REDIS_URL that still points at the compose-internal redis.
          case "$REDIS_URL" in
            *@redis:*) echo "::error::REDIS_URL=$REDIS_URL resolves to compose-internal redis — staging would use throwaway cache"; missing="$missing REDIS_URL(compose-default)" ;;
          esac
          [ -z "$STAGING_API_BASE_URL" ] && missing="$missing STAGING_API_BASE_URL"
          # Real-only OTP credentials (the app fails closed at boot without them).
          [ -z "$FAST2SMS_API_KEY" ] && missing="$missing FAST2SMS_API_KEY"
          [ -z "$FAST2SMS_SENDER_ID" ] && missing="$missing FAST2SMS_SENDER_ID"
          [ -z "$FAST2SMS_DLT_TEMPLATE_ID" ] && missing="$missing FAST2SMS_DLT_TEMPLATE_ID"
          [ -z "$ZEPTOMAIL_API_TOKEN" ] && missing="$missing ZEPTOMAIL_API_TOKEN"
          [ -z "$ZEPTOMAIL_MAIL_AGENT" ] && missing="$missing ZEPTOMAIL_MAIL_AGENT"
          [ -z "$EMAIL_FROM_ADDRESS" ] && missing="$missing EMAIL_FROM_ADDRESS"
          if [ -n "$missing" ]; then
            echo "::notice::staging environment not wired — exiting (no-op). Missing secrets:$missing"
            echo "Create the 'staging' GitHub Environment and add: DATABASE_URL, PII_ENCRYPTION_KEY, PII_HASH_PEPPER, INTERNAL_SERVICE_TOKEN, JWT_SECRET, REDIS_URL, STAGING_API_BASE_URL, FAST2SMS_API_KEY, FAST2SMS_SENDER_ID, FAST2SMS_DLT_TEMPLATE_ID, ZEPTOMAIL_API_TOKEN, ZEPTOMAIL_MAIL_AGENT, EMAIL_FROM_ADDRESS (STAGING_DEPLOY_HOOK_URL + FAST2SMS_ENTITY_ID optional). See docs/ops/staging-service-deploy-runbook.md + docs/ops/otp-real-send-staging-runbook.md."
            echo "wired=false" >> "$GITHUB_OUTPUT"
          else
            echo "staging environment wired — proceeding with build/migrate/deploy/smoke."
            echo "wired=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.wired == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        if: steps.guard.outputs.wired == 'true'
        # No `version:` on purpose — it would conflict with the `packageManager` field
        # in package.json (ERR_PNPM_BAD_PM_VERSION). package.json's
        # `packageManager: pnpm@11.5.2` is the single source. (Mirrors ci.yml.)
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        if: steps.guard.outputs.wired == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.guard.outputs.wired == 'true'
        run: pnpm install --frozen-lockfile

      # ---- BUILD: API + its workspace deps only; the Next.js apps fail `next build`
      #      under NODE_ENV=development and the API loop does not need them (#136 fix). ----
      - name: Build API (+ workspace deps) — skip the Next.js apps
        if: steps.guard.outputs.wired == 'true'
        run: pnpm --filter "@badabhai/api..." build

      # ---- MIGRATE: apply the full chain to the DISPOSABLE staging DB (DATABASE_URL
      #      from the staging secret). Migrations run BEFORE the code that assumes them. ----
      - name: Apply migrations (to head)
        if: steps.guard.outputs.wired == 'true'
        run: pnpm db:migrate

      # ---- SEED: the reference data the INTERVIEW reads on every turn (B-1 / R2). ----
      #
      # Migrating is no longer sufficient. Before the OIE Phase 8 cutover a chat turn called the
      # ai-service and needed no reference data at all, so a migrated-but-unseeded database was
      # fine. It is not fine now: `ProfilingOrchestrator` resolves a question pack in-process on
      # every turn and fails CLOSED when the universal pack is missing, so an unseeded staging
      # answers every worker with the unavailable line — while `/health` stays green, because
      # nothing about an empty reference table is unhealthy.
      #
      # These steps existed only in ci.yml's e2e job, i.e. against a throwaway container that is
      # deleted at the end of the run. Nothing put the same rows into the database anyone actually
      # uses. That gap is B-1, and the boot-time ERROR log added in this PR is the second wall
      # behind it — one tells you at deploy time, the other tells you at start-up.
      #
      # ORDER IS NOT ARBITRARY: `profiling_family_binding` references ISCO unit codes that only
      # exist once the domains are in, and `db:normalize:aliases` has to run BETWEEN the domain
      # seed and any retrieval — `verify-job-domains.ts` states that an un-normalized alias is
      # "invisible to L0/L2 retrieval", and it currently runs in NO workflow at all, so the
      # occupation ladder degrades silently to trigram-only.
      #
      # `--apply` IS REQUIRED. Every script in this family is DRY-RUN by default: without the flag
      # they print what they WOULD write, exit 0, and touch nothing. That is not hypothetical —
      # the first version of ci.yml's equivalent steps omitted it, both went green, and the verify
      # below then failed with "the pack tables are EMPTY". A step that passes while doing nothing
      # is worse than no step, because the green tick is the thing you would trust.
      #
      # All of it is PII-free public reference data with deterministic ids, so a re-run is a
      # row-level no-op and this is safe on every deploy.
      - name: Seed occupation catalogue + question packs
        if: steps.guard.outputs.wired == 'true'
        run: |
          set -eo pipefail
          pnpm --filter @badabhai/db db:seed:domains --apply
          pnpm --filter @badabhai/db db:normalize:aliases --apply
          pnpm --filter @badabhai/db db:seed:packs --apply

      # The deploy gate the repo already owns, run against the LIVE database rather than the
      # corpus. ci.yml's `--corpus` variant checks the JSONL; this one checks what actually
      # LANDED — including "exactly one active pack per (family, locale)" and "a universal pack
      # exists", neither of which a corpus read can prove. ci.yml:123's own comment says "the
      # live-database checks stay on the deploy path"; until now they were on no path.
      - name: Verify question packs + occupation catalogue (live DB)
        if: steps.guard.outputs.wired == 'true'
        run: |
          set -eo pipefail
          pnpm --filter @badabhai/db db:verify:packs
          pnpm --filter @badabhai/db db:verify:domains

      # ---- DEPLOY: trigger the host (optional webhook). NEVER echo the hook URL. ----
      - name: Trigger host deploy (optional webhook)
        if: steps.guard.outputs.wired == 'true'
        run: |
          if [ -n "$STAGING_DEPLOY_HOOK_URL" ]; then
            echo "Triggering staging deploy hook…"
            # -f: fail (non-zero) on HTTP >=400. The URL is NEVER printed (no -v, no echo).
            curl -fsS -X POST "$STAGING_DEPLOY_HOOK_URL" >/dev/null
            echo "Deploy hook accepted (POST returned <400)."
          else
            echo "::notice::no STAGING_DEPLOY_HOOK_URL set — skipping the deploy trigger. Your host auto-deploys from the repo, or deploy via your host CLI (see docs/ops/staging-service-deploy-runbook.md). The smoke below still verifies the live URL."
          fi

      # ---- SMOKE: poll /health until 200 (bounded). Real-only OTP cannot be round-tripped
      #      automatically (there is no echoed code) — the end-to-end real-send proof is the
      #      MANUAL OTP-7 staging check (docs/ops/otp-real-send-staging-runbook.md). ----
      - name: Wait for /health (bounded retries)
        if: steps.guard.outputs.wired == 'true'
        run: |
          base="${STAGING_API_BASE_URL%/}"
          echo "Waiting for ${base}/health to return 200…"
          ok=""
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${base}/health" || echo "000")
            if [ "$code" = "200" ]; then
              echo "API healthy after ${i} attempt(s)."
              ok="yes"; break
            fi
            echo "  attempt ${i}: /health -> ${code}; retrying in 5s…"
            sleep 5
          done
          if [ -z "$ok" ]; then
            echo "::error::staging API never returned 200 on /health within the retry budget. Is the host deployed + the URL public, and are DB + Redis reachable? (The app fails closed at boot if the Fast2SMS/ZeptoMail credentials are missing.)"
            echo "Last /health response (readiness checks — no secrets in this body):"
            curl -s "${base}/health" || true
            echo
            exit 1
          fi
