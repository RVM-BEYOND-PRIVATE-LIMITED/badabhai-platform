name: Payer app

# BLOCKING gate for the Flutter payer/agency app (apps/payer-app) — the mirror of
# `worker-app.yml`, and kept in lockstep with it. A red check here means: do not merge.
#
# CALLED BY `ci.yml`, NOT TRIGGERED DIRECTLY (#718) — see the header of
# `worker-app.yml` for why: a standalone workflow cannot be reached by `ci-required`'s
# `needs:`, so it could fail while the only required check on `main` stayed green. The
# path filter moved with the trigger into `ci.yml`'s `changes` job (`payer-app`), so
# unrelated PRs still neither pay the Flutter cost nor wait on it.
on:
  workflow_call:

jobs:
  analyze-test:
    name: Payer app (analyze / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/payer-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pin the Flutter version so CI is reproducible and the analyzer ruleset is
      # stable. Bump deliberately, not implicitly via `channel: stable`.
      #
      # Kept in lockstep with `worker-app.yml` and with the version both apps are
      # developed against (3.35.7 / Dart 3.9.2) — `pubspec.lock` floors Dart at
      # >=3.8.0, so an older pin cannot even `pub get`.
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # BLOCKING: analyzer findings (error/warning/info) fail the build.
      - name: Analyze
        run: flutter analyze

      # BLOCKING: the payer suite covers the auth/session seam, the unlock flow,
      # and the REAL-vs-mock client boundary. Do not silently disable.
      - name: Test
        run: flutter test
