name: Security scan

# Advisory security scanners (Phase 4 hardening). Every job here is NON-BLOCKING
# today (continue-on-error: true) so it surfaces findings on the PR without ever
# red-X'ing the merge. It is deliberately ADDITIVE to .github/workflows/ci.yml —
# it does NOT duplicate or weaken the existing blocking gates (node lint/typecheck/
# test/build, ai-service ruff/pytest, e2e onboarding flow, worker-app analyze/test).
#
# Three jobs, all license-free (no paid GitHub-Org action, no SaaS token):
#   (a) secret-scan      — gitleaks (official Docker image), full git history.
#   (b) sast             — semgrep OSS. BLOCKING and REQUIRED as of #773: the job now
#                          lives in sast.yml as a reusable, is called per-PR from ci.yml
#                          (so `ci-required` reaches it), and is called here weekly for
#                          the whole-tree scan.
#   (c) dependency-audit — `pnpm audit --audit-level high`. BLOCKING and REQUIRED as of
#                          #788: the job now lives in dependency-audit.yml as a reusable,
#                          is called per-PR from ci.yml (so `ci-required` reaches it), and
#                          is called here weekly as the coverage net for direct pushes and
#                          for advisories published against untouched dependencies.
#
# WHY non-blocking first: these are unsuppressed scanners run against a repo that
# has never been gated by them. Until each has a clean baseline (or an explicit,
# reviewed ignore set), a fresh false-positive must not block the 2026-06-25 alpha
# cut or any unrelated PR.
#
# FLIP-TO-BLOCKING criteria (remove `continue-on-error` per job once met):
#   - secret-scan: zero findings on a full-history run, OR a committed .gitleaks.toml
#     allowlist for every justified hit (e.g. .env.example placeholders). This is the
#     CI-side complement to the local harness guard (.claude/hooks/guard-secrets.mjs)
#     and CLAUDE.md §2 invariant 2 (no raw PII / secret leaves its boundary). FLIP FIRST.
#   - sast: triage p/default + p/typescript + p/python + p/secrets to zero (fix or a
#     committed .semgrepignore / inline `# nosem` with justification). Owners:
#     @prakashkantumutchu (apps/api, apps/web, apps/worker-app, packages/config),
#     @divyuuu (apps/ai-service, reach/job-postings/unlocks).
#   - dependency-audit: MET AND FLIPPED (#788, 2026-08-12). 18 high advisories across 7
#     transitive packages were cleared with `overrides` in pnpm-workspace.yaml (see the
#     DEP-3 block there), not with a tracked exception — every one had a published fix.
#     `pnpm audit --audit-level high` now exits 0 and the job blocks.
#
# Tooling choices (license-free, intentional):
#   - gitleaks via its official Docker image `zricethezav/gitleaks` — NOT
#     `gitleaks/gitleaks-action`, whose v2 requires a paid GitHub-Org licence key.
#   - semgrep via `semgrep scan` with OSS `p/*` --config rulesets and NO
#     SEMGREP_APP_TOKEN — fully open-source, no Semgrep Cloud account.
#   - pnpm audit — built into the pinned pnpm@11.5.2 (package.json packageManager).
# No GitHub Enterprise-only features (no required-reviewer environment gates).
#
# TRIGGERS. THIS WORKFLOW IS NOW SCHEDULE-ONLY, and that is a consequence of every
# job in it graduating rather than of anything being dropped. Each of the three moved
# to a reusable called from ci.yml, where `ci-required` can actually reach it: sast
# (#773), dependency-audit (#788), and secret-scan was already schedule-only because a
# full-history gitleaks run is redundant per-PR.
#
# The `pull_request` trigger is REMOVED with them. With no PR-active job left it would
# have started a run on every PR to do nothing but compute a paths-filter nobody reads
# — a check that always reports green while asserting nothing, which is the exact
# failure mode this file's own flip-to-blocking criteria exist to prevent.
#
# WHAT THE WEEKLY RUN IS FOR, and why it is not duplication: the PR calls are path-gated
# and diff-scoped, so they cannot see a DIRECT push to main (this repo takes them), an
# advisory published against dependencies nobody touched, or a ruleset improvement.
# Bounded ≤7-day gap. That is the coverage net, not an optional extra.
on:
  # Weekly full-history re-scan of main (Sunday 02:30 UTC — a quiet hour, offset
  # from :00 to avoid GitHub's on-the-hour cron congestion/deferral). WHY a
  # schedule at all: gitleaks scans the ENTIRE git history, and a PR-only scanner
  # never re-examines main after a force-push or admin-merge, nor when scanner
  # rulesets improve — the periodic run keeps main's history covered.
  schedule:
    - cron: "30 2 * * 0"

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: these jobs scan source, they never write to the repo or
# packages. Narrow the default GITHUB_TOKEN scope explicitly.
permissions:
  contents: read

jobs:
  # ---- (a) Secret scan: gitleaks, full git history ----
  # CI-3: moved to schedule-only (full-history scan is expensive; PR coverage
  # kept by the pre-merge secret scan in ci.yml's node job + .gitleaks.toml
  # allowlist). NON-BLOCKING (continue-on-error).
  secret-scan:
    name: Secret scan (gitleaks)
    # CI-3: schedule-only — full-history scan is redundant on every PR
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so gitleaks can scan every commit, not just the tip —
          # a secret committed and later removed still lives in the object graph.
          fetch-depth: 0

      # Official gitleaks Docker image (license-free). We mount the checkout and
      # run `gitleaks detect` over the full history. `--redact` keeps any matched
      # value out of the CI log; `--exit-code 1` makes a finding fail the STEP,
      # but `continue-on-error` on the job keeps it advisory for now.
      # The committed `.gitleaks.toml` (TD76) allowlists known-safe placeholders
      # (.env.example, google-services.json test Firebase keys).
      - name: Run gitleaks (full history)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:latest \
            detect \
              --source="/repo" \
              --redact \
              --verbose \
              --exit-code 1

  # ---- (b) SAST: semgrep OSS ----
  #
  # MOVED to .github/workflows/sast.yml as a `workflow_call` reusable (#773), and this is
  # now the SCHEDULE-ONLY caller. The PR path is invoked from ci.yml so that `ci-required`
  # — the only required context on `main` — can `needs:` it. While the job lived here it
  # could go red beside a green `ci-required`, and did: #763 and #768, both caught by a
  # human rather than by the gate.
  #
  # NO `baseline-ref` here on purpose. ci.yml passes one, so the PR gate reports only what
  # the PR introduced; this weekly run passes none and scans the WHOLE TREE. That is what
  # keeps #774's residue contained: the `p/*` rulesets are fetched at scan time and cannot
  # be versioned by the OSS CLI, so rule content drifts under a pinned engine. Drift and
  # accumulation still get caught — here, weekly, where a surprise finding costs a triage
  # instead of blocking somebody's unrelated PR.
  #
  # `continue-on-error` is NOT set: on the schedule there is no merge to block, so a red
  # run is a signal to act on rather than a gate to route around.
  sast:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/sast.yml

  # ---- (c) Dependency audit: the WEEKLY whole-tree run ----
  #
  # The job itself moved to dependency-audit.yml as a `workflow_call` reusable and is now
  # BLOCKING, called per-PR from ci.yml so `ci-required` can reach it (#788, #792) — the
  # same structural fix, for the same reason, as sast above.
  #
  # WHAT REMAINS HERE IS THE COVERAGE NET, NOT A DUPLICATE. The PR call is path-gated on
  # the lockfile, so it cannot see either of the two ways the tree goes bad without one:
  # a DIRECT push to main (this repo takes them, and they get no PR run at all), and a
  # NEWLY PUBLISHED advisory against dependencies nobody has touched — which is how most
  # of them arrive. Bounded ≤7-day gap, same as the gitleaks re-scan above.
  dependency-audit:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/dependency-audit.yml
