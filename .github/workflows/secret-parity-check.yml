name: Secret parity check

# Guards against exactly the drift class docs/release-checklist.md and
# docs/rollback-guide.md were SUPPOSED to prevent by documenting "the exact secret
# list currently bridged" — both are, today, broken cross-references to each other
# with no list actually written in either (found by a production-readiness audit).
#
# docker-compose.staging.yml declares a set of REQUIRED (`${VAR:?...}`) env vars per
# service (api, ai-service) — the fail-loud contract that keeps the Lightsail box
# from ever booting on the public dev defaults. TWO INDEPENDENT GitHub Actions
# workflows separately bridge GitHub Secrets into that same compose file's shell
# environment, for two different deploy paths:
#   .github/workflows/ci.yml         deploy-lightsail job (the live Lightsail path)
#   .github/workflows/staging-cd.yml deploy job (persistent-staging CD — currently an
#                                     inert guarded no-op until a human wires the
#                                     `staging` GitHub Environment secrets)
# Nothing kept those two secret-bridge lists in sync with docker-compose.staging.yml's
# required set, or with each other, and it was only caught by manual audit. This job
# is the structural backstop: scripts/check-secret-parity.mjs parses all three files
# as TEXT (no values anywhere in any of them — this is a name-vs-name check only) and
# reports, independently per workflow, any compose-required var with no matching
# `${{ secrets.NAME }}` reference in that workflow's deploy job.
#
# CONVENTION: same shape as supabase-checks.yml — a pure Node script, no install
# beyond actions/setup-node, no live database, no secrets needed (see
# docs/supabase-workflow.md). A standalone workflow (not called into ci.yml, not a
# `ci-required` dependency) rather than a job inside ci.yml, matching how
# supabase-checks.yml is organized for this exact class of structural check.
#
# NON-BLOCKING FOR NOW (continue-on-error on the assertion step) — same rollout
# pattern documented for supabase-checks.yml: land non-blocking, flip once a clean
# baseline holds. The check DOES currently find real drift: staging-cd.yml is
# missing secrets.PIN_PEPPER and secrets.ADMIN_JWT_SECRET relative to
# docker-compose.staging.yml's required set (plus other gaps — read the job's own
# output rather than assuming from this comment, the same "verify don't assume"
# discipline docs/supabase-workflow.md asks for). Closing that gap is a SEPARATE,
# pending decision — it touches the actual secret bridges, which this PR does not.
# Flip to blocking (drop `continue-on-error: true`) once the drift this job reports
# is resolved and a clean baseline holds for a few PRs.
#
# Deliberately NOT added to ci.yml's `ci-required` aggregator — same reason it starts
# non-blocking: a continue-on-error step inside a required job would just report
# "success" regardless of the step's own result, which is worse than being honestly
# outside the gate for now.

on:
  push:
    branches: [main]
    paths:
      - "docker-compose.staging.yml"
      - ".github/workflows/**"
      - "scripts/check-secret-parity.mjs"
      - "scripts/check-secret-parity.test.mjs"
  pull_request:
    branches: [main]
    paths:
      - "docker-compose.staging.yml"
      - ".github/workflows/**"
      - "scripts/check-secret-parity.mjs"
      - "scripts/check-secret-parity.test.mjs"

concurrency:
  group: secret-parity-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-parity:
    name: docker-compose.staging.yml required vars vs deploy workflow secret bridges
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      # Self-test FIRST, and deliberately NOT continue-on-error: this exercises the
      # SCRIPT's own parsing logic against small synthetic fixtures baked into the
      # test file (never the live repo files), so it stays stable regardless of any
      # real secret-bridge drift and must never be allowed to go quietly red — the
      # same role scripts/staging-smoke.test.mjs plays for scripts/staging-smoke.mjs.
      - name: Self-test the checker (fixtures, no live files)
        run: node --test scripts/check-secret-parity.test.mjs

      - name: Check docker-compose.staging.yml secrets are bridged in both deploy workflows
        continue-on-error: true # NON-BLOCKING — flip to blocking once the reported drift is resolved and a clean baseline holds for a few PRs.
        run: node scripts/check-secret-parity.mjs
