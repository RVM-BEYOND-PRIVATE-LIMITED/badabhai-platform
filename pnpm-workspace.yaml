# pnpm workspace definition for the BadaBhai monorepo.
# Python (apps/ai-service) and Flutter (apps/worker-app) manage their own
# toolchains and are intentionally NOT part of the pnpm workspace.

# ---------------------------------------------------------------------------
# Supply-chain policy (#737). Three settings semgrep's OSS supply-chain rules
# flag as absent. All three are supported by the pinned `pnpm@11.5.2` in
# package.json, and none of them changes what resolves TODAY — verified against
# the committed lockfile before turning them on.
# ---------------------------------------------------------------------------

# Refuse TRANSITIVE dependencies that resolve from anywhere but the registry —
# git URLs, tarball URLs, arbitrary hosts. This is the setting that closes the
# "a sub-dependency quietly starts pulling from a GitHub branch" path, which no
# lockfile review reliably catches because the diff looks like any other bump.
# SAFE TO ENABLE TODAY: `grep -cE "tarball:|repo:|git\+|https://github" pnpm-lock.yaml`
# is 0 — every dependency in the tree already comes from the registry, so this
# records the status quo rather than changing it. (pnpm >= 10.26.0)
blockExoticSubdeps: true

# Do not install a version published less than 7 days ago (10080 minutes).
# THIS IS THE ONE THAT ACTUALLY BUYS TIME. Registry-account takeovers and
# post-install-script attacks are found and yanked in hours-to-days; a cooling-off
# window means the compromised version is gone before this repo would have taken
# it. It does NOT affect `--frozen-lockfile` (CI resolves nothing), so the cost is
# confined to a deliberate dependency bump landing up to a week later.
# (pnpm >= 10.16.0)
minimumReleaseAge: 10080

# Refuse a version whose publish-trust evidence is WEAKER than that of any
# earlier-published version of the same package — the signature of an account
# takeover, where the attacker can publish but cannot reproduce the maintainer's
# provenance attestation. The check is ordered by PUBLISH DATE, not semver.
# (pnpm >= 10.21.0)
trustPolicy: no-downgrade

# Two entries in the committed lockfile fail that check TODAY, so the policy above
# cannot be turned on without them. Both were measured against the registry
# metadata rather than assumed:
#
#   chokidar@4.0.3      3.6.0, 4.0.0 and 4.0.1 carry provenance attestations; 4.0.3
#                       carries none. Pulled transitively (vite / tsup watchers).
#   undici-types@6.21.0 79 versions of this package carry provenance; 6.21.0 does
#                       not. Ships as a dependency of @types/node.
#
# ASSESSED AS MAINTAINER PUBLISHING DRIFT, NOT COMPROMISE: in both cases the
# package is a long-lived, heavily-depended-on library whose maintainer published a
# release without the provenance step, and no advisory exists against either
# version. The honest description is "unverifiable by this mechanism", not "known
# good" — which is why the exclusions are PINNED TO THE EXACT VERSION rather than
# to the package name. Any OTHER version of these two packages still fails, and a
# downgrade in any other package still fails. Re-check on the next bump: if a later
# chokidar/undici-types restores provenance, delete the line instead of editing it.
trustPolicyExclude:
  - chokidar@4.0.3
  - undici-types@6.21.0

packages:
  - "apps/api"
  - "apps/web"
  - "apps/payer-web"
  - "apps/admin-web"
  - "packages/*"
  - "tests/e2e"
# Allow these dependencies to run install/build scripts (pnpm sandboxes the rest).
# esbuild ships a platform binary that vitest/tsup need at runtime.
# sharp ships native binaries used by Next.js image optimization.
# @nestjs/core's postinstall is only a funding message -> not needed.
allowBuilds:
  esbuild: true
  sharp: true
  '@nestjs/core': false
  # bullmq's optional native msgpack accelerator — the pure-JS fallback is fine,
  # so skip its native build (avoids a native toolchain requirement on Windows).
  msgpackr-extract: false
onlyBuiltDependencies:
  - esbuild
  - sharp
# Standard pnpm key (used by CI): explicitly skip these build scripts without
# erroring. @nestjs/core's postinstall is only a funding message.
ignoredBuiltDependencies:
  - "@nestjs/core"
  - msgpackr-extract
# Force transitive `multer` to the patched line (GHSA-72gw-mp4g-v24j, HIGH; fixed
# >=2.2.0). multer is pulled only transitively (via @nestjs/platform-express@11,
# already on the 2.x major) — no app code uses it directly (no FileInterceptor),
# so this is a safe same-major patch that clears the advisory.
overrides:
  multer: ">=2.2.0"
  # DEP-2 (2026-07-17). Both are TRANSITIVE and build/dev-time only; their parents pin
  # the vulnerable lines, so a range-keyed override is the only lever short of bumping
  # the parents (deferred: drizzle-kit rides the drizzle-orm bump, TD49).
  #   postcss <8.5.10 — pinned by next@15.5; the vite copy is already patched.
  #   esbuild <0.28.1 — pulled by drizzle-kit@0.30 (0.18/0.19, via the deprecated
  #     @esbuild-kit loader). The advisory is a DEV-SERVER issue; drizzle-kit only
  #     bundles config files and never serves — but the override clears it anyway and
  #     is proven by `db:generate` + the full build below.
  postcss@<8.5.10: ">=8.5.10"
  esbuild@<0.28.1: ">=0.28.1"
# Dependency-audit (`pnpm audit --audit-level high`) tracked exceptions. Each entry
# is a HIGH/CRITICAL advisory that does NOT apply to this codebase, rationale logged
# in the tech-debt register. Scoped to specific GHSA ids so the audit STILL fails on
# any NEW high/critical advisory.
# (empty — previously tracked GHSA-gpj5-g38j-94v9 was fixed by the drizzle-orm 0.45
# bump in TD49.)
