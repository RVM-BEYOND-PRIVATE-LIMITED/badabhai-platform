# pnpm workspace definition for the BadaBhai monorepo.
# Python (apps/ai-service) and Flutter (apps/worker-app) manage their own
# toolchains and are intentionally NOT part of the pnpm workspace.

# ---------------------------------------------------------------------------
# Supply-chain policy (#737). Three settings semgrep's OSS supply-chain rules
# flag as absent. All three are supported by the pinned `pnpm@11.5.2` in
# package.json, and none of them changes what resolves TODAY — verified against
# the committed lockfile before turning them on.
# ---------------------------------------------------------------------------

# Refuse TRANSITIVE dependencies that resolve from anywhere but the registry —
# git URLs, tarball URLs, arbitrary hosts. This is the setting that closes the
# "a sub-dependency quietly starts pulling from a GitHub branch" path, which no
# lockfile review reliably catches because the diff looks like any other bump.
# SAFE TO ENABLE TODAY: `grep -cE "tarball:|repo:|git\+|https://github" pnpm-lock.yaml`
# is 0 — every dependency in the tree already comes from the registry, so this
# records the status quo rather than changing it. (pnpm >= 10.26.0)
blockExoticSubdeps: true

# Do not install a version published less than 7 days ago (10080 minutes).
# THIS IS THE ONE THAT ACTUALLY BUYS TIME. Registry-account takeovers and
# post-install-script attacks are found and yanked in hours-to-days; a cooling-off
# window means the compromised version is gone before this repo would have taken
# it. It does NOT affect `--frozen-lockfile` (CI resolves nothing), so the cost is
# confined to a deliberate dependency bump landing up to a week later.
# (pnpm >= 10.16.0)
minimumReleaseAge: 10080

# DEP-9 (2026-10-06). ONE exact version let through early, and why it is not a policy change:
# source-map-js@1.2.2 is the only fix for GHSA-68fv-2mgg-jv7q (HIGH), the advisory that turned
# the BLOCKING deps-audit gate red on every lockfile PR. It was published 2026-09-30T14:08Z and
# clears the window on its own at 2026-10-07T14:08Z. Pinned to the EXACT version, like
# `trustPolicyExclude` below: any other source-map-js version, and every other package, still
# waits 7 days. It still passes `trustPolicy` (no provenance downgrade). DELETE THIS LINE on
# the next lockfile change after 2026-10-07 — it is inert from then on.
minimumReleaseAgeExclude:
  - source-map-js@1.2.2

# Refuse a version whose publish-trust evidence is WEAKER than that of any
# earlier-published version of the same package — the signature of an account
# takeover, where the attacker can publish but cannot reproduce the maintainer's
# provenance attestation. The check is ordered by PUBLISH DATE, not semver.
# (pnpm >= 10.21.0)
trustPolicy: no-downgrade

# Two entries in the committed lockfile fail that check TODAY, so the policy above
# cannot be turned on without them. Both were measured against the registry
# metadata rather than assumed:
#
#   chokidar@4.0.3      3.6.0, 4.0.0 and 4.0.1 carry provenance attestations; 4.0.3
#                       carries none. Pulled transitively (vite / tsup watchers).
#   undici-types@6.21.0 79 versions of this package carry provenance; 6.21.0 does
#                       not. Ships as a dependency of @types/node.
#
# ASSESSED AS MAINTAINER PUBLISHING DRIFT, NOT COMPROMISE: in both cases the
# package is a long-lived, heavily-depended-on library whose maintainer published a
# release without the provenance step, and no advisory exists against either
# version. The honest description is "unverifiable by this mechanism", not "known
# good" — which is why the exclusions are PINNED TO THE EXACT VERSION rather than
# to the package name. Any OTHER version of these two packages still fails, and a
# downgrade in any other package still fails. Re-check on the next bump: if a later
# chokidar/undici-types restores provenance, delete the line instead of editing it.
trustPolicyExclude:
  - chokidar@4.0.3
  - undici-types@6.21.0

packages:
  - "apps/api"
  - "apps/web"
  - "apps/payer-web"
  - "apps/admin-web"
  - "apps/marketing-web"
  - "packages/*"
  - "tests/e2e"
# Allow these dependencies to run install/build scripts (pnpm sandboxes the rest).
# esbuild ships a platform binary that vitest/tsup need at runtime.
# sharp ships native binaries used by Next.js image optimization.
# @nestjs/core's postinstall is only a funding message -> not needed.
allowBuilds:
  esbuild: true
  sharp: true
  '@nestjs/core': false
  # bullmq's optional native msgpack accelerator — the pure-JS fallback is fine,
  # so skip its native build (avoids a native toolchain requirement on Windows).
  msgpackr-extract: false
onlyBuiltDependencies:
  - esbuild
  - sharp
# Standard pnpm key (used by CI): explicitly skip these build scripts without
# erroring. @nestjs/core's postinstall is only a funding message.
ignoredBuiltDependencies:
  - "@nestjs/core"
  - msgpackr-extract
# Force transitive `multer` to the patched line (GHSA-72gw-mp4g-v24j, HIGH; fixed
# >=2.2.0). multer is pulled only transitively (via @nestjs/platform-express@11,
# already on the 2.x major) — no app code uses it directly (no FileInterceptor),
# so this is a safe same-major patch that clears the advisory.
overrides:
  # DEP-6 (2026-09-11): was ">=2.2.0", and the tree sat on exactly 2.2.0. GHSA-qfvm-cv95-jqjf
  # and GHSA-535w-7cp7-47q4 (both HIGH, DoS via crafted multipart field names) are patched at
  # 2.3.0. Reached through `@nestjs/platform-express`, which is the request path — apps/api
  # parses no multipart body today (uploads go straight to Supabase Storage through a signed
  # URL), but the parser is mounted and a floor is cheaper than that argument staying true.
  #
  # DEP-9 (2026-10-06): SUPERSEDES ">=2.3.0" — GHSA-3pph-fpjx-jg34 (moderate, DoS via orphaned
  # disk writes on aborted uploads) is patched at 2.4.0; ">=2.3.0" is satisfied by 2.3.0 itself,
  # so the tree never moved. Now `^`-pinned to the 2.x line per the DEP-3 rule below.
  multer: "^2.4.0"
  # DEP-2 (2026-07-17). Both are TRANSITIVE and build/dev-time only; their parents pin
  # the vulnerable lines, so a range-keyed override is the only lever short of bumping
  # the parents (deferred: drizzle-kit rides the drizzle-orm bump, TD49).
  #   postcss <8.5.10 — pinned by next@15.5; the vite copy is already patched.
  #   esbuild <0.28.1 — pulled by drizzle-kit@0.30 (0.18/0.19, via the deprecated
  #     @esbuild-kit loader). The advisory is a DEV-SERVER issue; drizzle-kit only
  #     bundles config files and never serves — but the override clears it anyway and
  #     is proven by `db:generate` + the full build below.
  esbuild@<0.28.1: ">=0.28.1"
  # ---------------------------------------------------------------------------
  # DEP-3 (#788/#792, 2026-08-12). Taking `pnpm audit --audit-level high` to ZERO so
  # the job can stop being `continue-on-error` — the #737 sequence, which did exactly
  # this for SAST. A scanner that has never been clean fails on every PR, so the red X
  # carries no information and the only habit it builds is ignoring a security check.
  #
  # ALL SEVEN ARE TRANSITIVE; none is a direct dependency of ours, and no intermediate
  # has shipped a bump — so a range-keyed override is the only lever, exactly as for the
  # two entries above. Each is pinned with `^` to its OWN major line rather than a bare
  # `>=`, because a bare floor lets pnpm resolve the newest matching version across
  # majors and hand a parent a version it cannot use. `brace-expansion` is the case that
  # makes this concrete: three independent lines (1.1.15, 2.1.2, 5.0.6) are in the tree
  # at once, each with its own patched floor.
  #
  # WHAT THEY ARE. Every one is a DoS / quadratic-complexity / path-traversal class
  # finding in BUILD AND TEST tooling rather than a live request path, with two that
  # deserve a real look rather than an assumption:
  #
  #   shell-quote  reaches us through `drizzle-orm`, a PRODUCTION dependency of both
  #                apps/api and packages/db. Checked rather than assumed: the vulnerable
  #                code is in the CLI/shell-escaping path, which no runtime query
  #                touches. Overridden regardless — it is one patch version.
  #   sharp        libvips image-decode CVEs, reached via `next` in all three web apps.
  #                This is the one with a plausible live path: `next/image` optimization
  #                decodes images, and worker photos are served from Supabase. Bumped to
  #                the patched line rather than accepted for that reason.
  #
  # ONE AT A TIME, NOT IN A BATCH: an override that forces an incompatible version of a
  # transitive of `@nestjs/cli`, `vitest` or `next` is green in the lockfile and broken
  # at runtime, and attributing that is far easier one package at a time. Verified after
  # all seven with `pnpm audit` (0 high), `pnpm -r build`, and the full suites.
  # 2026-09-30: GHSA-qhr7-859c-m2p7 (HIGH, DoS via uncontrolled recursion) published against the
  # three floors above (<1.1.20, >=2.0.0 <2.1.6, >=4.0.0 <5.0.11). Same three independent lines in
  # the tree; bumped each to its OWN patched major line — no cross-major resolution.
  brace-expansion@<1.1.20: "^1.1.20"
  brace-expansion@>=2.0.0 <2.1.6: "^2.1.6"
  brace-expansion@>=5.0.0 <5.0.11: "^5.0.11"
  # DEP-5 (2026-09-05). GHSA on <=4.28.6 (HIGH). Transitive under `@nestjs/cli` only —
  # build tooling, never shipped to a production runtime. Same-major patch bump.
  browserslist@<4.28.7: "^4.28.7"
  # DEP-8 (2026-10-01). Seven HIGH advisories published against axios <1.20.0 (ReDoS in the
  # data: URI parser and in shouldBypassProxy, two prototype-pollution gadgets, the HTTP/2
  # adapter bypassing the configured DNS lookup, an unhandled 'error' event DoS, and
  # maxRedirects: 0 not enforced by the fetch adapter — GHSA-c29m-xwm3-cm6r, -mghh-pgcx-3jjj,
  # -x97p-jq2g-jp4f, -3pq3-5fj3-cg6v, -542g-h47m-68v8, -m8m8-qj5v-23w3 and the redirect one).
  # Our only axios is TRANSITIVE under `razorpay` (apps/api), which pins 1.19.0 exactly and has
  # shipped no bump — a live request path (payment orders), so patched, not argued. Same-major
  # minor bump to the patched line.
  axios@<1.20.0: "^1.20.0"
  # DEP-7 (2026-09-29). SUPERSEDES `<3.1.6: ^3.1.6` — instance five of the pattern the
  # nanoid / js-yaml / fast-uri notes record: GHSA-qw65-cvwx-89v3 (HIGH, authority
  # injection via encoded delimiters) is patched at 3.1.7, and GHSA-58mr-gqgx-xq4g (HIGH,
  # host confusion via an unclosed percent sequence) is patched at 3.1.7 too — while
  # `^3.1.6` is satisfied by 3.1.6 itself, so pnpm never bumped and the advisory stayed
  # live behind a rule that looked like it covered it. 3.1.7 is also the fix for the
  # advisory the OLD floor was written for. Reached only through `@nestjs/cli` >
  # `@angular-devkit/core` > `ajv` (24 paths, all build-tooling, never a production
  # runtime). Verified with `pnpm audit` (0 high) and the api build, which is the path
  # that exercises this chain.
  fast-uri@<3.1.7: "^3.1.7"
  # DEP-6 (2026-09-11). SUPERSEDES `<4.3.1: ^4.3.1`, and for the THIRD time in this file
  # the same reason: GHSA on <4.3.2 is newer than the floor, `^4.3.1` is satisfied by
  # 4.3.1 itself, so pnpm never bumped and the rule that looked like it covered the
  # package had quietly stopped. See `fast-uri` and `nanoid` above for instances one and
  # two. A version-keyed override is a snapshot of one advisory, not a standing policy.
  js-yaml@<4.3.2: "^4.3.2"
  # DEP-4 (2026-08-17). SUPERSEDES the DEP-3 floor above (was `<3.3.17: ^3.3.17`):
  # GHSA-2v37-7h3g-55p8 (HIGH, custom generators can loop indefinitely when size is
  # zero) is patched at 3.3.18, one patch version past the DEP-3 floor — `^3.3.17`
  # is satisfied by 3.3.17 itself, so pnpm never bumped further. Pulled only
  # transitively via vitest > @vitest/mocker/vite/vite-node > vite > postcss >
  # nanoid — build/test tooling only, never shipped to any production runtime.
  nanoid@<3.3.18: "^3.3.18"
  # SUPERSEDES the DEP-2 floor above (was `<8.5.10: >=8.5.10`): GHSA on <8.5.18 is newer
  # than that entry, and leaving both would be two rules for one package.
  postcss@<8.5.18: "^8.5.18"
  # DEP-6 (2026-09-11). SUPERSEDES `<0.35.0: ^0.35.0` — instance four, and the one that
  # matters most. GHSA-g89c-p67h-r497 / GHSA-2jg2-4ch7-h545 are libheif decode flaws
  # patched at 0.35.4; the tree sat on 0.35.3. The DEP-3 note above already singled sharp
  # out as "the one with a plausible live path" because `next/image` optimization decodes
  # images and worker photos are served from Supabase — so this is an image decoder on a
  # request path, not build tooling, and it had been uncovered since the floor was written.
  # DEP-10 (2026-10-06). SUPERSEDES both floors on these two lines (was `sharp@<0.35.4:
  # ^0.35.4` and `shell-quote@<1.8.5: ^1.8.5`) — the version-keyed-snapshot failure the js-yaml
  # note above describes, instances five and six: each floor is satisfied by the version the
  # tree already sat on, so pnpm never moved past a NEWER advisory.
  #   sharp        GHSA-wq5f-xc86-pv6w (HIGH, librsvg in the bundled libvips) patched at 0.35.5.
  #                Same live path as DEP-6: `next/image` decodes images on a request path.
  #   shell-quote  GHSA-pqg4-j6r4-53mv (CRITICAL, `quote()` command injection via a line
  #                terminator after a `{ comment }` token) on >=1.8.4 <1.11.0, patched at 1.11.0.
  #                Reached via drizzle-orm > gel; nothing in this repo calls `quote()`.
  # Surfaced by #2071 (a ci.yml change re-runs deps-audit); main's tree carries both.
  sharp@<0.35.5: "^0.35.5"
  shell-quote@<1.11.0: "^1.11.0"
  # ---------------------------------------------------------------------------
  # DEP-9 (2026-10-06). Ten advisories published at once (3 critical, 1 high, 5 moderate,
  # 1 low) turned deps-audit red on every lockfile PR. All transitive, no parent has shipped
  # a bump, so the DEP-3 lever again: range-keyed, each `^`-pinned to its own major line.
  #
  # REQUEST PATH (apps/api, via @nestjs/platform-express > express 5):
  #   proxy-addr  GHSA-jqcg-44mw-7w3h (CRITICAL, IP spoofing via IPv4-mapped IPv6 in a trust
  #               subnet). Decides req.ip under `trust proxy` — the rate-limit key.
  #   qs          GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g (moderate, array-limit bypass / DoS).
  #   body-parser GHSA-v422-hmwv-36x6 (low, DoS on an invalid `limit`). 2.x line only.
  proxy-addr@<2.0.8: "^2.0.8"
  qs@<6.16.0: "^6.16.0"
  body-parser@>=2.0.0 <2.3.0: "^2.3.0"
  # BUILD / TEST ONLY:
  #   source-map-js  GHSA-68fv-2mgg-jv7q (HIGH, event-loop DoS on an indexed source map), via
  #                  vite > postcss and @vitest/coverage-v8 > magicast.
  #   tinypool       GHSA-85c8-ppgw-ccpr, GHSA-5gmw-xhrv-c9v3 (CRITICAL, prototype-pollution
  #                  gadget to RCE in worker options). vitest 3.2 asks for `^1.1.1` and the 1.x
  #                  line has no fix, so this is the one override that CROSSES a major: 2.x
  #                  only drops Node 18 (engines ^20 || >=22, same as ours) and keeps the
  #                  Tinypool API vitest 3 calls. Proven by the full vitest suites, not assumed.
  #                  Delete when vitest moves to 4.x (which also clears GHSA-82fw-gwwq-j7x9).
  source-map-js@>=1.0.0 <1.2.2: "^1.2.2"
  tinypool@<2.1.2: "^2.1.2"
# Dependency-audit (`pnpm audit --audit-level high`) tracked exceptions. Each entry
# is a HIGH/CRITICAL advisory that does NOT apply to this codebase, rationale logged
# in the tech-debt register. Scoped to specific GHSA ids so the audit STILL fails on
# any NEW high/critical advisory.
# (empty — previously tracked GHSA-gpj5-g38j-94v9 was fixed by the drizzle-orm 0.45
# bump in TD49.)
