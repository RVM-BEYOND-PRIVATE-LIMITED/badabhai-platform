plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    // Firebase — google-services must be applied after Android/Kotlin/Flutter plugins.
    id "com.google.gms.google-services"
    // Crashlytics gradle plugin: uploads the mapping/NDK symbols on release so
    // obfuscated stack traces are readable in the console. Crashlytics itself
    // now ships via the FlutterFire firebase_crashlytics plugin.
    id "com.google.firebase.crashlytics"
}

// Optional release-signing credentials. Loaded from a gitignored properties file
// (keys: storeFile / storePassword / keyAlias / keyPassword) that CI/DevOps
// provisions as a secret. Absent by default, which is intentional.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// A versionCode that always MOVES FORWARD, in seconds since 2026-01-01T00:00:00Z.
//
// `flutter.versionCode` comes from pubspec's `version: 0.1.0+1`, and `git log -L`
// on that line shows it has not changed since the app was scaffolded. So every
// APK ever built carried versionCode 1, and installing one from a file manager
// over a copy already on the phone was a same-version overwrite rather than an
// upgrade — the path OEM installers (ColorOS / MIUI / Funtouch) refuse with a
// bare "App was not installed". Cable install never hit it: `adb install -r`
// passes replace-existing, and a phone without the app installed is a fresh
// install, which is why one device took the very same file and another did not.
//
// Seconds since a 2026 epoch rather than a `yyMMddHHmm` stamp: that reads nicely
// but 2610021159 overflows Android's 2_100_000_000 ceiling. This is ~23.7M today
// and gains 31.5M a year, so it stays under the ceiling past 2090 while still
// giving every single build its own number — rebuilding twice in one hour must
// not hand out the same code or the overwrite is back.
def versionCodeEpochMillis = 1767225600000L  // 2026-01-01T00:00:00Z
def buildVersionCode = (long) ((System.currentTimeMillis() - versionCodeEpochMillis) / 1000L)

android {
    namespace = "com.badabhai.workerapp"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.badabhai.workerapp"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // minSdk 23 (Android 6.0, 2015): required by record_android 1.x (the A2
        // voice recorder). Flutter's own default (flutter.minSdkVersion = 21)
        // fails the manifest merge once `record` is a dependency.
        // Bumped to 24 on Flutter 3.35 (its default min; also ≥ Firebase's 23 floor).
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        // NEVER below the stamp, so no pubspec or `--build-number` value can put
        // the frozen-versionCode bug back. A deliberately pinned code (a Play
        // upload, #1073) therefore has to be greater than the stamp to win.
        versionCode = (int) Math.max((long) flutter.versionCode, buildVersionCode)
        versionName = flutter.versionName
    }

    signingConfigs {
        // Populated only when the gitignored properties file is present (CI/DevOps
        // secret). When absent, this config stays empty and is never selected below.
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            // Release-signs when a gitignored properties file (storeFile /
            // storePassword / keyAlias / keyPassword), provisioned by CI/DevOps as a
            // secret, is present. Otherwise falls back to the debug keys so local and
            // CI builds keep working until the secret is provisioned.
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Firebase BoM pins the NATIVE messaging SDK version. Crashlytics is now
    // owned by the FlutterFire firebase_crashlytics plugin (do NOT re-declare it
    // here — double-declaration causes version conflicts). Analytics + Perf were
    // removed: unused, and Perf is a known start-up ANR risk on low-end devices.
    implementation platform("com.google.firebase:firebase-bom:34.15.0")
    implementation "com.google.firebase:firebase-messaging"

    // SMS User Consent — reads the OTP out of the incoming SMS after a one-tap
    // system prompt. NOT the silent SMS Retriever: that needs an 11-char app
    // hash inside the SMS body, which our DLT-approved template does not carry.
    // Needs no SMS permission. See SmsUserConsentManager.kt.
    implementation "com.google.android.gms:play-services-auth-api-phone:18.0.1"
}
