android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dkotlin.daemon.jvm.options=-Xmx4g

# NOTE: do NOT commit `org.gradle.java.home` here — the same note apps/worker-app's
# gradle.properties already carries, applied to this app for the same reason. It was
# pinned to /usr/lib/jvm/java-17-openjdk-amd64, a path that exists only on one Linux
# machine: it breaks every Windows build and forces a per-developer
# ~/.gradle/gradle.properties workaround. It also does not exist on GitHub-hosted
# ubuntu runners, which install JDKs from Adoptium to /usr/lib/jvm/temurin-<v>-jdk-amd64
# only — Gradle rejects an invalid org.gradle.java.home at startup, so the release-APK
# build (#920) died before compiling anything. With the line gone Gradle resolves the
# JDK normally (JAVA_HOME / the Studio JBR), which is correct on every platform.
# Pin a toolchain in build.gradle if a specific JDK is ever required — never a
# machine-local absolute path.
