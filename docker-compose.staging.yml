# ===========================================================================
# docker-compose.staging.yml — CD-0 staging/deploy overlay for the Lightsail box.
#
# The base docker-compose.yml is a DEV-LAPTOP file on purpose (its api service
# pins NODE_ENV=development, public dev-default secrets, and the compose-internal
# postgres/redis) — NEVER deploy it alone. This overlay retargets the api AND the
# ai-service for a real box; apply it ON TOP of the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml --profile api pull api ai-service
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml --profile api up -d --no-deps ai-service
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml --profile api up -d --no-deps api
#
# TD81(a): the ai-service is part of this overlay as of PR #431. Before that,
# NOTHING served the FastAPI app on the box — AI_SERVICE_URL resolved to nothing,
# the api degraded to its TypeScript mock, and /health still returned 200, so
# staging reported healthy while running AI entirely mocked. Both services are
# now pinned to their own IMMUTABLE per-commit image, and BOTH `${..IMAGE:?}`
# pins must be exported for ANY compose command against this overlay (compose
# interpolates the WHOLE file before it filters by service or profile) — so a
# manual/rollback run exports API_IMAGE **and** AI_SERVICE_IMAGE.
#
# Fail-loud contract: every `${VAR:?}` below errors at COMPOSE time (before any
# container starts) when the box lacks real values — a box still on the public
# repo-literal dev defaults is UNDEPLOYABLE instead of silently live on them.
# Values: on CI deploys they arrive from GitHub environment/repo secrets via the
# deploy step's env+envs passthrough (CD-1b) and ALWAYS shadow the box's shell/.env
# — even when empty (fail-loud either way). Manual/rollback runs from a box shell
# read the shell env or the project .env instead (STAGING-SECRETS-1); values are
# never committed (CLAUDE.md §6).
#
# depends_on: the base api service depends_on the compose-internal postgres and
# redis. An overlay cannot DELETE a depends_on entry by omission (compose merges
# maps by union), and the `!reset` YAML tag needs compose >= 2.24, which the box
# is NOT verified to run — so the deploy script passes `--no-deps api` on `up`
# instead (portable across all compose v2), which skips dependency startup
# entirely. NEVER run this overlay with a bare `up -d`: profile-less services
# (postgres/redis/adminer) would still start alongside the api. (The ai-service
# declares NO depends_on at all — it is DB-free and its spend ledger is lazy —
# so `--no-deps` costs it nothing; it is kept for one uniform discipline.)
# ===========================================================================
services:
  api:
    # CD-4: staging pins the IMMUTABLE per-commit image (the ghcr `sha-<short7>`
    # tag) exported by the deploy-lightsail job; rollback = export the previous
    # sha tag and re-run `up` (docs/rollback-guide.md). The dev path keeps the
    # base file's `${API_IMAGE:-badabhai-api:latest}` default.
    image: ${API_IMAGE:?set the immutable ghcr sha tag, e.g. ghcr.io/<owner>/badabhai-platform/badabhai-api:sha-<short7> — exported by deploy-lightsail in .github/workflows/ci.yml}
    environment:
      # Explicit production, not merely un-set: the base file pins development and
      # the runtime image's own default is ALSO production (apps/api/Dockerfile,
      # `ENV NODE_ENV=production`) — stating it here makes the deployed value
      # independent of merge/default order, and it ARMS every fail-closed boot
      # assert in apps/api/src/main.ts (assertPiiCryptoConfig / assertAuthConfig /
      # assertPayerAuthConfig / assertAdminAuthConfig all reject the public
      # dev-default secrets outside an explicit development/test env).
      NODE_ENV: production

      # ---- Secrets the production boot asserts REQUIRE (fail-closed in main.ts).
      # `${VAR:?}` fails at compose time — one clear error line beats a container
      # crash-loop. Real values live only on the box (env / .env), never in git.
      JWT_SECRET: ${JWT_SECRET:?required in staging — the dev default is a public repo literal}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?required in staging — 32-byte base64, never the dev default}
      PII_HASH_PEPPER: ${PII_HASH_PEPPER:?required in staging — never the dev default}
      # assertAuthConfig also rejects the dev PIN pepper outside dev/test (ADR-0026
      # Phase 3) — omitting this would guarantee a boot loop under NODE_ENV=production.
      PIN_PEPPER: ${PIN_PEPPER:?required in staging — never the dev default}
      # Must ALSO differ from JWT_SECRET (assertAdminAuthConfig — principal separation).
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?required in staging — distinct from JWT_SECRET, never the dev default}

      # ---- Real backing services.
      # Postgres: NEVER the compose-internal one — the deploy runs `up --no-deps api`
      # so it never even starts on this path; DATABASE_URL is the real (Supabase) DB.
      DATABASE_URL: ${DATABASE_URL:?required in staging — the real Postgres, never the compose-internal one}
      # Redis: box-local BY DECISION (CD-1a, owner) — it IS this compose project's
      # `redis` service, started explicitly by the deploy script before the api (see
      # .github/workflows/ci.yml), reached over the compose network. So REDIS_URL
      # must be `redis://redis:6379`: NOT localhost (inside the api container that is
      # the api itself) and NOT the host port (loopback-bound in docker-compose.yml).
      # Still `${VAR:?}` — the value stays a secret, and an unset one must fail loud.
      REDIS_URL: ${REDIS_URL:?required in staging — box-local redis over the compose network, i.e. redis://redis:6379}

      # ---- Worker OTP is REAL-ONLY (Fast2SMS — no console/mock path, CLAUDE.md §1).
      # The base file's dev-dummy defaults satisfy assertAuthConfig's presence check
      # (so the container would BOOT) but every real OTP send would then fail at
      # runtime — staging requires the REAL provider values, and a missing one fails
      # here at compose rather than as a mid-login provider error.
      FAST2SMS_API_KEY: ${FAST2SMS_API_KEY:?required in staging — real Fast2SMS key, worker OTP has no mock path}
      FAST2SMS_SENDER_ID: ${FAST2SMS_SENDER_ID:?required in staging — the DLT-registered sender id}
      FAST2SMS_DLT_TEMPLATE_ID: ${FAST2SMS_DLT_TEMPLATE_ID:?required in staging — the DLT template id}

      # ---- Payer email OTP (ADR-0019, real-only channel — the ZeptoMail analogue of the
      # Fast2SMS block above) — PASS-THROUGH, NEVER DECLARED HERE UNTIL NOW.
      #
      # THIS WAS THE SAME #798/#794 FAILURE CLASS: compose forwards ONLY the names a
      # service's `environment:` block declares, and none of these were declared. Setting
      # EMAIL_PROVIDER/ZEPTOMAIL_*/EMAIL_FROM_ADDRESS on the box (in `.env` or the shell)
      # had NO path into the api container — `loadServerConfig` read the schema default
      # (EMAIL_PROVIDER=zeptomail, everything else empty) regardless of the box, and a
      # payer OTP either sandbox-validated without delivering or failed
      # `assertPayerAuthConfig` at boot with nothing on the box explaining why.
      #
      # `:-` NOT `:?`: `assertPayerAuthConfig` (packages/config/src/server.ts) already
      # fails the container closed at boot when EMAIL_PROVIDER=zeptomail and the ZeptoMail
      # creds are incomplete — a compose-level `:?` here would just be a second, less
      # specific place for the same check, and would add EMAIL_FROM_ADDRESS etc. to the
      # required-secret set even for a box that intentionally runs SMTP instead. Passing
      # through and letting the app enforce it keeps one source of truth.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-zeptomail}
      # #813 — THIS LINE WAS MISSING ENTIRELY, the same defect as WORKER_PHOTOS_BUCKET
      # (#794) and CHAT_LLM_INTERVIEW_ENABLED (#798): compose forwards ONLY the names a
      # service's `environment:` block declares, so exporting ZEPTOMAIL_API_URL on the box
      # (or via the CI secrets bridge) had NO path into the container — `sendViaZeptoMail`
      # requires it (`if (!apiUrl || ...) throw new EmailRejectedError(...)`), so it threw on
      # every single real send, was caught, and `payer-otp.service`'s anti-enumeration
      # neutralization turned it into a `code_sent` 200 with nothing ever delivered. The
      # #815 sandbox-override fix alone could not have closed this: it makes the box ATTEMPT
      # real delivery instead of silently sandboxing, but the attempt was failing closed on
      # this line the entire time, on every box, sandbox or not.
      ZEPTOMAIL_API_URL: ${ZEPTOMAIL_API_URL:-}
      ZEPTOMAIL_API_TOKEN: ${ZEPTOMAIL_API_TOKEN:-}
      ZEPTOMAIL_MAIL_AGENT: ${ZEPTOMAIL_MAIL_AGENT:-}
      ZEPTOMAIL_SANDBOX_MODE: ${ZEPTOMAIL_SANDBOX_MODE:-false}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-BadaBhai}

      # ---- InternalServiceGuard shared secret. The base default ("dev-internal-token")
      # is a repo literal guarding the ops-only routes (resume reads, ops unlocks —
      # TD33/TD50) and has NO boot assert — this compose-level requirement is the only
      # fail-loud gate for it.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?required in staging — the dev default is a public repo literal}
      # ---- TD81(a): point the api at the ai-service container, over the compose
      # network. THIS LINE IS THE POINT OF THE WHOLE TICKET: without it the schema
      # default http://localhost:8000 (packages/config/src/server.ts) resolves
      # INSIDE the api container to the api itself, every AI call fails, and the
      # API falls back to its safe TypeScript mock (real_call=false) — a SOFT
      # failure that keeps /health at 200, so the box reported healthy while
      # profiling/extraction ran entirely mocked and nobody was told.
      #
      # A LITERAL, not `${VAR:?}`: this is not a secret and there is exactly one
      # correct value on this box — the compose service name. Making it a required
      # secret would add a way to get it wrong (and a way to fail a deploy) with
      # nothing to gain. `ai-service` resolves only over the compose network;
      # neither localhost nor the loopback-published host port would work from
      # inside the api container.
      AI_SERVICE_URL: http://ai-service:8000

      # ---- #798: THE API-SIDE HALF OF THE LLM-LED INTERVIEW. Arming the ai-service alone
      # does NOT produce the interview Divyanshu gets from the CLI, and that is the part
      # #798's diagnosis (`ai_posture: mock`) does not reach. Two INDEPENDENT gates stand
      # between a worker and that experience, in different containers:
      #
      #   ai-service   AI_ENABLE_REAL_CALLS + key + allowlist  → may a call be REAL?
      #   api          CHAT_LLM_INTERVIEW_ENABLED              → does the LLM LEAD the interview?
      #
      # With this flag off, LlmTurnService.enabled() returns false, the orchestrator never
      # offers the model a turn, and POST /chat/message answers from the DETERMINISTIC
      # question-bank engine — the "flat, canned" chat in the report — no matter how real
      # the ai-service posture is. `ai_posture: real` would have looked like a fix and
      # changed nothing the worker sees.
      #
      # THIS LINE WAS MISSING ENTIRELY, WHICH IS THE SAME BUG #794 FIXED FOR
      # WORKER_PHOTOS_BUCKET, not a dormant-by-design state. Compose forwards ONLY the names
      # a service's `environment:` block declares — it does not pass the host shell through —
      # so before this line existed the flag had no path into the api container at all:
      # exporting it on the box (or via the CI secrets bridge) left the value sitting in the
      # box's shell while `loadServerConfig` read the schema default `false`, and every turn
      # stayed deterministic with nothing naming the cause.
      #
      # DEFAULT `true`, AND UNLIKE THE AI-SERVICE BLOCK BELOW THAT IS SAFE TO COMMIT — this
      # is not a privacy gate. It decides WHO composes the question (model vs question bank),
      # not whether worker text may leave for a provider; that decision is
      # `AI_ENABLE_REAL_CALLS`, which stays `false` here pending R30. With the master gate
      # off, this flag on is EXACTLY TODAY'S BEHAVIOUR: `/profiling/turn` returns the mock
      # path's empty `reply_text`, `AiService.llmTurn` normalises that to null, and the
      # deterministic engine answers — see "DEGRADES SAFELY" below. Committing it armed is
      # what makes the box's single `AI_ENABLE_REAL_CALLS=true` export sufficient.
      #
      # `:-` keeps the box authoritative, so `export CHAT_LLM_INTERVIEW_ENABLED=false` +
      # re-deploy reverts to the deterministic engine WITHOUT a code change — the per-surface
      # kill switch for this feature.
      #
      # DEGRADES SAFELY, INDEPENDENTLY OF THE AI-SERVICE. If the ai-service is unreachable,
      # mocked, or out of budget, `LlmTurnService.take` returns null, the envelope is marked
      # `llmFallback`, and the deterministic engine finishes the interview — the worker gets
      # a complete profile either way. Turning this on cannot strand anyone mid-interview.
      CHAT_LLM_INTERVIEW_ENABLED: ${CHAT_LLM_INTERVIEW_ENABLED:-true}

      # TD72(a): outside dev an EMPTY CORS list resolves to deny-all (origin:false)
      # with no boot assert — the first otherwise-green deploy would silently block
      # every payer-web/ops browser call while /health (no CORS) reports healthy.
      # Fail loud at compose time instead.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?required in staging — empty means deny-all for browsers (TD72a)}

      # ---- Resume PDF render: OFF BY DEFAULT, and now SETTABLE FROM THE BOX (#793).
      #
      # OFF IS STILL THE HONEST DEFAULT, for the reason this block has always given: the
      # base file enables render for the local runbook, but SUPABASE_URL /
      # SUPABASE_SERVICE_ROLE_KEY default to EMPTY, and render armed against unconfigured
      # storage boots green and then fails at the FIRST render ("Supabase Storage is not
      # configured"). Off-until-configured is the truthful state and it does not change here.
      #
      # WHAT CHANGED IS THE FORM, AND IT IS THE WHOLE OF #793's ASK 2. This was the hard
      # literal `"false"`, and a compose `environment:` entry with a literal value BEATS the
      # box's shell/.env — so `export RESUME_RENDER_ENABLED=true` on Lightsail had NO path
      # into the container. That is the same defect as `AI_ENABLE_REAL_CALLS` (#798),
      # `WORKER_PHOTOS_BUCKET` (#794) and `VOICE_NOTES_BUCKET`: the flip everything in the
      # repo told the operator to perform was inert, silently, with nothing naming the cause.
      # #793 is the bug report for it — resume download failing on the deployed box while
      # working against localhost.
      #
      # THE PRECONDITION THIS BLOCK SET HAS SINCE BEEN MET, WHICH IS WHY THE OLD TEXT IS
      # GONE. It required "add SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY here" before arming,
      # and recorded "verified at the time: this compose file declares no SUPABASE_* entry".
      # Both are now declared — 20-odd lines below, as `:-` pass-throughs added with V8 voice
      # storage — so the sentence had quietly become false, which is exactly the kind of
      # comment-versus-file divergence that produced #798.
      #
      # `:-` NOT `:?`: the required-secret set stays equal to the owner's STAGING-SECRETS-1
      # list, so this cannot newly fail a deploy. Arming is one export in the SAME act that
      # supplies the creds — `export RESUME_RENDER_ENABLED=true SUPABASE_URL=…
      # SUPABASE_SERVICE_ROLE_KEY=…`, then re-run the deploy. `RESUMES_BUCKET` needs nothing
      # here: the base file's `${RESUMES_BUCKET:-worker-resumes}` is inherited by the merge
      # and is already box-overridable.
      #
      # ARMING WITHOUT THE CREDS IS DIAGNOSABLE, NOT SILENT — the failure mode the old text
      # feared is now visible from outside. `StorageService.requireStorage` throws a 503 that
      # NAMES the missing variables (never their values), and since #796 `GET /health`
      # reports storage config presence, so an operator can see the half-armed state without
      # reading a container log.
      RESUME_RENDER_ENABLED: ${RESUME_RENDER_ENABLED:-false}

      # ---- V8 VOICE STORAGE: PASS-THROUGH, NEVER REQUIRED.
      #
      # WHY THIS DOES NOT CONTRADICT THE PARAGRAPH ABOVE. That one defers SUPABASE_* as
      # `${VAR:?}` fail-loud entries, to keep the required-secret set equal to the owner's
      # STAGING-SECRETS-1 list. These are the `:-` form: unset expands to empty, compose
      # still starts, and the required-secret set is UNCHANGED. The deferral was about not
      # adding new ways to fail a deploy; an optional pass-through adds none.
      #
      # WHY THE API NEEDS THEM AT ALL, INDEPENDENTLY OF THE RESUME RENDER. The api mints the
      # signed upload URL for a voice note and lists/erases those objects on a DSAR. That is
      # a different consumer of the same storage creds from the PDF render, and it is gated
      # by VOICE_NOTES_BUCKET rather than by RESUME_RENDER_ENABLED — which stays "false".
      #
      # EMPTY IS THE SAFE STATE AND STAYS THE DEFAULT. An empty VOICE_NOTES_BUCKET means the
      # whole spoken leg is DORMANT: no signed upload is minted, and the DSAR voice legs
      # record `skipped` rather than claiming they swept a bucket that was never configured.
      # Arming voice is therefore an env action on the box — export these, re-run the
      # deploy — and NOT a code change. That is the entire point of this block.
      VOICE_NOTES_BUCKET: ${VOICE_NOTES_BUCKET:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}

      # ---- ADR-0032 WORKER PROFILE PHOTOS: PASS-THROUGH, NEVER REQUIRED — same shape
      # as VOICE_NOTES_BUCKET immediately above, for the same reason. `WORKER_PHOTOS_BUCKET`
      # defaults to "" in packages/config/src/server.ts, and empty is DORMANT: the photo
      # upload/download routes (apps/api/src/workers) 503 fail-closed rather than mint a
      # signed URL against a bucket that may not exist. This is api-only — profile-photo
      # handling never touches the ai-service (unlike voice notes, which it reads to
      # transcribe), so this name is deliberately NOT added to the ai-service block below.
      #
      # THIS LINE WAS MISSING, AND THAT WAS A REAL GAP, NOT A DORMANT-BY-DESIGN STATE LIKE
      # THE ONE ABOVE. Compose only forwards env vars a service's `environment:` block
      # explicitly names — it does not pass the host shell through — so before this line
      # existed, exporting WORKER_PHOTOS_BUCKET on the box (or via the CI secrets bridge)
      # had NO path into the api container: the value would sit in the box's shell/.env,
      # never reach the process, and every upload/download would 503 exactly as if nothing
      # had been configured at all, with no error naming the actual cause.
      #
      # ARMING STILL NEEDS TWO THINGS, NOT ONE. This compose entry alone arms nothing — the
      # value still defaults to empty. Setting it for real also requires the
      # `worker-profile-photos` Storage bucket to exist and be provisioned PRIVATE in the
      # actual Supabase project (infra/supabase/storage-buckets.sql; see
      # infra/supabase/storage-buckets.md) — a face photo is high-sensitivity PII and must
      # never be payer-readable. `:-` keeps the required-secret set unchanged, same as
      # VOICE_NOTES_BUCKET: unset expands to empty and compose still starts clean.
      WORKER_PHOTOS_BUCKET: ${WORKER_PHOTOS_BUCKET:-}

      # ---- KNOWN-SURVIVING DEV VALUE (deliberate for now — R27 owner queue). The base
      # file's `PAYER_LOGIN_METHOD: whatsapp` survives this merge, and the WhatsApp
      # channel is the MOCK provider (ADR-0020) — so payer/agency login is functionally
      # DEAD on this box even though the API boots clean in production mode. NOT
      # silently overridden here: the owner decides whether to pin a real method +
      # its creds (e.g. email_otp -> ZeptoMail set as `${VAR:?}`) or accept a dead
      # payer login on this box for now.

  # ---- TD81(a): the FastAPI AI service, ON THE BOX ----
  # The base file's ai-service is the dev-laptop form (a `:latest` local build).
  # This retargets it exactly the way the api above is retargeted: an IMMUTABLE
  # per-commit image, real-call gate still OFF, credentials pass-through only.
  #
  # Everything else it needs it already has from the base file and is NOT
  # overridden here: the loopback-only `127.0.0.1:8000:8000` publish (CD-1a — this
  # is an UNAUTHENTICATED AI surface while TD67's token is unset, so it must never
  # be reachable off-box; a base `ports` entry cannot be removed by an overlay
  # anyway, which is why the safe bind lives there), `restart: unless-stopped`, and
  # the absence of any depends_on.
  #
  # It carries NO `${VAR:?}` secret requirements ON PURPOSE — the required-secret
  # set for this box stays exactly the owner's STAGING-SECRETS-1 list (the same
  # discipline that keeps SUPABASE_* out of the api block above). This service has
  # no fail-closed boot assert to satisfy: with no keys it boots, serves the
  # pseudonymization gateway, and answers every AI route from the MOCK path — which
  # is the correct, committed posture (CLAUDE.md §2 invariant 5). What changes with
  # this file is that the mock now runs where the api can SEE it, so `real_call`
  # and the ai-service's own /health become observable instead of imaginary.
  ai-service:
    # CD-4, mirroring the api: pin the IMMUTABLE per-commit ghcr `sha-<short7>`
    # tag exported by deploy-lightsail; rollback = export the previous sha tag and
    # re-run `up` (docs/rollback-guide.md — which must now export BOTH image vars).
    # `${VAR:?}` fails at COMPOSE time, before any container starts.
    image: ${AI_SERVICE_IMAGE:?set the immutable ghcr sha tag, e.g. ghcr.io/<owner>/badabhai-platform/badabhai-ai-service:sha-<short7> — exported by deploy-lightsail in .github/workflows/ci.yml}
    environment:
      # ---- THE BOX CAN NOW ARM REAL LLM CALLS. IT IS NOT ARMED BY DEFAULT (#798).
      #
      # WHAT CHANGED AND WHY. This was the hard literal `"false"`, whose own comment said
      # the flip is "made in the box's environment … NEVER in a committed file". Those two
      # statements could not both be true: a compose `environment:` entry with a LITERAL
      # value always beats the box's shell/.env, so `export AI_ENABLE_REAL_CALLS=true` on
      # Lightsail — the flip that apps/ai-service/.env.staging.example and
      # docs/ai/enable-real-llm-extraction.md both instruct the operator to perform — had
      # NO path into the container. The documented arming procedure was inert, and #798 is
      # the bug report: `/health` kept reporting `ai_posture: "mock"` on a box someone had
      # already tried to arm, and the worker app kept serving the canned interview.
      #
      # THE SUBSTITUTION FORM IS LOAD-BEARING, not cosmetic. `${VAR:-…}` keeps the box
      # authoritative in BOTH directions: it is what makes arming an export plus a re-deploy
      # instead of a code change and a rebuild, and it keeps the emergency OFF switch
      # (`export AI_ENABLE_REAL_CALLS=false`) available once the box has armed it — the same
      # property the `:-` credentials below rely on. `:-` (not `-`) is deliberate: an EMPTY
      # export must fall back to the committed default rather than hand pydantic an empty
      # string, which matters because the deploy's secrets bridge exports an unset GitHub
      # secret as "".
      #
      # THE DEFAULT STAYS `false`, AND THAT IS A PRIVACY DECISION, NOT AN OVERSIGHT.
      # Fixing the LITERAL is what #798 actually reported: the documented arming procedure
      # had no path into the container. Changing the committed DEFAULT to `true` is a second,
      # separate act, and it is the one that is not ours to make yet — because the
      # pseudonymization gateway carries a KNOWN, ASSERTED PII gap whose own precondition
      # names this exact flag:
      #
      #   apps/ai-service/app/pseudonymize.py (~L350):
      #     "KNOWN RESIDUAL — risks-register R30 is OPEN, not closed. […]
      #      Neither is live: AI_ENABLE_REAL_CALLS=false by default (invariant #5).
      #      Both MUST be re-assessed before that flag flips."
      #
      # R30's open half is a 9-13 digit phone split by a WORD — "mera number 98765 aur 43210
      # hai" — which is NOT masked and NOT blocked, and which
      # apps/ai-service/tests/test_pseudonymize.py pins as an HONEST NEGATIVE today. That is
      # free-text worker chat, i.e. exactly `profiling_chat_turn`, the one task the allowlist
      # below arms. Defaulting this to `true` would ship a raw worker phone number to a
      # provider on the first armed box, past a test that says so out loud — and CLAUDE.md
      # §3 "Privacy First" / "Fail Closed" makes a fail-OPEN default the wrong direction for
      # a gate of this class regardless.
      #
      # SO ARMING IS ONE EXPORT, MADE DELIBERATELY, ALONGSIDE THE KEY THE BOX ALREADY OWES:
      #   export AI_ENABLE_REAL_CALLS=true GEMINI_FLASH_API_KEY=…   # then re-run the deploy
      # Flipping this line to `:-true` is a one-word change once R30 is closed (or explicitly
      # accepted in writing) — and the guard test pins the direction so it cannot drift there
      # silently in the meantime.
      #
      # STILL NOT SUFFICIENT ON ITS OWN EVEN WHEN ARMED, BY DESIGN — three independent gates
      # remain, and every one of them fails CLOSED to the mock path:
      #   1. GEMINI_FLASH_API_KEY must be non-empty (below, box-supplied — never committed).
      #      Without it real_calls_blocked_reason() still returns "GEMINI_FLASH_API_KEY is
      #      not set" and `ai_posture` stays "mock" no matter what this flag says.
      #   2. AI_REAL_CALL_TASKS must LIST the task (below). Empty = no task may go real.
      #   3. AI_REAL_CALLS_KILL_SWITCH, checked FIRST, overrides this flag outright.
      AI_ENABLE_REAL_CALLS: ${AI_ENABLE_REAL_CALLS:-false}

      # ---- Provider credentials: PASS-THROUGH, never committed, never required.
      # Declared so the owner can supply them from the box env / environment
      # secrets with NO code change; empty until then. `:-` is safe for these two
      # (both are `str | None` with no length constraint, and "" is falsy — it
      # reads as "not configured", so real_calls_blocked_reason still returns
      # "GEMINI_FLASH_API_KEY is not set" and the mock path holds).
      # NOTE: supplying a key ALONE arms nothing — the flag above still gates it.
      GEMINI_FLASH_API_KEY: ${GEMINI_FLASH_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # ---- V8 VOICE STORAGE — the change the previous revision of this block deferred.
      #
      # `VOICE_NOTES_BUCKET` is read by BOTH the api (which mints the signed upload URL) and
      # this service (which fetches the object to transcribe). Those defaults USED TO DISAGREE
      # — the api's was "" and this service's was the literal "worker-voice-notes" — which made
      # arming one side alone a silent TOTAL failure: the api mints uploads into bucket X, this
      # service reads from another, every transcription fails closed to an empty transcript,
      # and `/health` stays green on both because neither reports a bucket. That divergence was
      # closed at the SOURCE (app/config.py now defaults to "" here too), and this block is the
      # other half: the same three names, declared on BOTH services in the SAME change, so the
      # symmetry is a property of the file rather than of whoever edits it next.
      #
      # ALL `:-`, SO THE REQUIRED-SECRET SET IS UNCHANGED. Unset expands to empty; empty means
      # "not configured" on both sides; `stt.py` refuses the real path with a named reason.
      #
      # ARM THESE ON THE BOX, NOT IN ci.yml — AND THAT IS NOT LAZINESS. The deploy's
      # `env:`/`envs:` bridge resolves each name through `${{ secrets.X }}`, and an unset
      # GitHub secret expands to an EMPTY STRING which drone-ssh then exports into the remote
      # session. Compose gives the shell environment precedence, so adding these names to the
      # bridge BEFORE the secrets exist would let an empty export SHADOW a value the owner had
      # correctly configured on the box — arming the flip would silently un-arm it, with a
      # green deploy and a green /health. That is TD81's failure class rebuilt. Extend the
      # bridge in the SAME change that creates the secrets, which is the rule the
      # AI_INTERNAL_TOKEN note below already states for the same reason.
      VOICE_NOTES_BUCKET: ${VOICE_NOTES_BUCKET:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}

      # ---- V8 SARVAM. The key is the arming credential and is empty until the owner sets it;
      # the per-task allowlist below still gates it (`tts_synthesis` / `stt_transcription` are
      # NOT in the default list), so supplying the key alone changes nothing.
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}

      # ---- THE ALLOWLIST IS THE REAL SCOPE CONTROL, and #798 needs exactly ONE entry on it.
      #
      # AI_REAL_CALL_TASKS IS FAIL-CLOSED WHEN EMPTY — empty means NO task may go real, not
      # "all" (the root .env.example used to say the opposite; corrected under the 2026-08-01
      # ruling). That is why arming AI_ENABLE_REAL_CALLS above WITHOUT touching this line
      # would have changed nothing observable: `real_call_enabled_for()` requires the master
      # flag AND the key AND membership here, so the interview would have gone on answering
      # from the mock path and #798 would have reproduced exactly as filed.
      #
      # `profiling_chat_turn` IS THE TASK #798 IS ABOUT — the name the LLM-led interview turn
      # routes under (apps/ai-service/app/routers/profiling.py: TURN_TASK_TYPE). It is the
      # ONLY task armed by default here, which keeps the staged rollout the runbook asks for
      # rather than replacing it: `profile_extraction` and `resume_generation` stay on the
      # mock path, and the two Sarvam legs (`tts_synthesis`, `stt_transcription`) stay off —
      # STT in particular sends real worker AUDIO, which cannot be pseudonymized before the
      # provider hears it, and remains a separate owner decision.
      #
      # Widening is an env action, not a code change — `export
      # AI_REAL_CALL_TASKS=profiling_chat_turn,profile_extraction` on the box and re-run the
      # deploy. Narrowing works the same way, which is why this keeps the `:-` form.
      #
      # THIS LINE IS INERT UNTIL THE BOX ARMS THE MASTER FLAG ABOVE, and the split of duties
      # is deliberate: this line answers WHICH task may go real, `AI_ENABLE_REAL_CALLS`
      # answers WHETHER any may. Committing the narrow scope here — while the master gate
      # stays `false` — means the operator's one export cannot accidentally arm the whole
      # surface, because the scope decision was already made, reviewed and pinned by a test.
      AI_REAL_CALL_TASKS: ${AI_REAL_CALL_TASKS:-profiling_chat_turn}

      # ---- The two TTS values are RESTATED, not passed through empty, and that difference
      # matters. `sarvam_tts_model` / `sarvam_tts_speaker` are non-optional `str` with real
      # defaults ("bulbul:v2" / "anushka"); a bare `${VAR:-}` would hand pydantic an EMPTY
      # STRING and overwrite those defaults, so the first real synthesis would post an empty
      # model name. Pinning the owner-approved pair (2026-08-08 ruling, measured by the rung-0
      # listening test) puts the value a worker actually HEARS in the file rather than in a
      # library default — the same reason AI_ENABLE_REAL_CALLS is restated above.
      SARVAM_TTS_MODEL: "${SARVAM_TTS_MODEL:-bulbul:v2}"
      SARVAM_TTS_SPEAKER: "${SARVAM_TTS_SPEAKER:-anushka}"

      # ---- TD27 shared spend ledger. Unset = the in-process backend, which is
      # exact (not approximate) here because the image runs ONE uvicorn worker.
      # It MUST be set — to the box-local redis, i.e. redis://redis:6379/0, which
      # is already running for the api (CD-1a) — BEFORE either the worker count
      # rises or AI_ENABLE_REAL_CALLS is flipped, or the daily/per-user INR caps
      # stop being global. Fail-closed by design: set-but-unreachable BLOCKS real
      # calls (falls back to mock); it never permits an unverifiable spend.
      # The name is AI_SPEND_REDIS_URL, NOT REDIS_URL (AI-ENV-1) — the api's
      # REDIS_URL is a different, mandatory store and cannot reach these Settings.
      AI_SPEND_REDIS_URL: ${AI_SPEND_REDIS_URL:-}

      # ---- TD67 service token. Inherited VALUELESS (compose pass-through form)
      # from the base file for BOTH this service and the api, which is what makes
      # the flip a pure env action on the box: export AI_INTERNAL_TOKEN (>= 16
      # chars) there, re-run the deploy, and both containers pick it up together.
      # It is deliberately NOT threaded through the CI deploy's env/envs
      # passthrough: an UNSET GitHub secret expands to an EMPTY STRING, and empty
      # is FATAL on both sides (Zod .min(16) / pydantic min_length=16 both reject
      # ""), so a not-yet-created secret would crash-loop the api too. Add it to
      # ci.yml in the SAME change that creates the secret, or arm it from the box.
      # Half-flipping it (one side only) 401s every api→ai call and silently
      # degrades the API to mock — TD81's own failure class, re-created.
