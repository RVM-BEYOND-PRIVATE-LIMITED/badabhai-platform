# Local infrastructure for BadaBhai development.
# This complements (does NOT replace) the Supabase workflow: use this Postgres
# for fully-offline local dev, or point DATABASE_URL at Supabase instead.
#
#   docker compose up -d         # start postgres + redis (+ adminer)
#   docker compose down          # stop
#   docker compose down -v       # stop and DELETE volumes (data loss)
#
# NEVER RUN `down -v` (or `down`) AGAINST THE STAGING BOX. Locally it costs you a dev
# database. There it deletes `badabhai-platform_badabhai_redisdata`, which is the ONLY
# copy of every worker's session and refresh token — every worker on the platform is
# force-logged-out the instant it runs, and (because PIN unlock is a refresh-token lookup
# behind a neutral 401) they see "wrong PIN" for a PIN that is correct. That is #994. To
# clean up a stray container on the box use `docker rm -f <name>`, never `down`.

# #994 — THE COMPOSE PROJECT NAME IS WHAT NAMESPACES THE VOLUMES, and compose derives it
# from the directory basename. The live session store on the staging box is
# `badabhai-platform_badabhai_redisdata` only because the deploy happens to
# `cd ~/deployments/badabhai-platform`. Rename it, re-clone elsewhere, or deploy from a
# worktree and compose silently mounts a NEW EMPTY volume — a total, invisible session wipe
# that deploys green.
#
# The deploy therefore pins it EXPLICITLY, with `export COMPOSE_PROJECT_NAME=badabhai-platform`
# in .github/workflows/ci.yml, and a guard test asserts that export stays there.
#
# DELIBERATELY NOT a top-level `name:` key here, for two reasons:
#   1. `name:` needs Compose v2.3.3+, and this repo's standing rule is that the box's compose
#      version is UNVERIFIED — the deploy already refuses `--wait` for exactly that reason. An
#      unsupported key fails at PARSE, i.e. every compose command in the deploy, not just one.
#   2. It would make the project name directory-INDEPENDENT on the box, so a hand-run
#      `docker compose down -v` from a scratch clone would stop destroying a scratch project
#      and start destroying production's session store. The env var scopes the pin to the
#      deploy, which is the only place that needs it.

services:
  postgres:
    # pgvector-enabled Postgres so the worker_profiles.embedding vector(768)
    # column + HNSW index work locally (matches Supabase, which has pgvector).
    image: pgvector/pgvector:pg16
    container_name: badabhai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: badabhai
      POSTGRES_PASSWORD: badabhai
      POSTGRES_DB: badabhai
    # R38 — LOOPBACK, not 0.0.0.0. A bare "5432:5432" binds every interface, which on the
    # Lightsail box put a Postgres straight on the public side of the instance with only the
    # security group in front of it. See the identical note on `redis` below for why the fix
    # belongs HERE in the base file and can never be applied from an overlay: compose merges
    # `ports` by {ip, target, published, protocol} and APPENDS on a differing key, so an
    # overlay binding 127.0.0.1 leaves the 0.0.0.0 bind in place and BOTH survive.
    #
    # Local dev is unaffected — host tools still reach it at localhost:5432, and containers
    # reach it over the compose network at postgres:5432, which published ports play no part
    # in. Note this container should not run on the box AT ALL: production data is in
    # Supabase (docker-compose.staging.yml:73), and the deploy passes `--no-deps api` so it
    # never starts one. A running instance there is a leftover from a hand-run
    # `docker compose up`, and REMOVING it beats re-binding it.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - badabhai_pgdata:/var/lib/postgresql/data
      # Creates the Supabase client-facing roles (anon / authenticated / service_role)
      # that 26 migrations REVOKE from. Without them the chain dies on 0004 with
      # `role "anon" does not exist` and NO migration applies at all — so
      # `pnpm db:up && pnpm db:migrate` could never work from an empty database.
      # Runs once, on an empty data dir. See the file header for the full reasoning.
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badabhai -d badabhai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: badabhai-redis
    restart: unless-stopped
    # #994: THIS REDIS IS THE WORKER SESSION STORE, not a cache. `session:<sid>`,
    # `refresh:<sha256(token)>`, `refresh_family:*`, `worker_sessions:*` and
    # `worker_families:*` (apps/api/src/auth/session.service.ts) live ONLY here — there is
    # no Postgres mirror. Lose this keyspace and EVERY worker is force-logged-out at once:
    # /auth/token/refresh 401s, the app force-reauths, and because PIN unlock is just a
    # refresh-token lookup behind a neutral 401, the worker sees "PIN sahi nahi" for a PIN
    # that is perfectly correct. That is the whole of #994. So the flags below are
    # correctness, not tuning:
    #
    #   --appendonly yes       AOF, so a restart replays writes instead of losing every
    #                          session written since the last RDB snapshot.
    #   --appendfsync everysec the AOF default, PINNED: `no` would hand durability to the
    #                          kernel's flush timing, which on an unclean stop is exactly
    #                          the "sessions from the last few minutes vanished" bug.
    #   --maxmemory-policy noeviction
    #                          the default, PINNED because it is load-bearing twice over:
    #                          an LRU/random policy would let redis evict live refresh
    #                          tokens under memory pressure (logging workers out with no
    #                          error anywhere), and BullMQ refuses to run against an
    #                          evicting instance at all.
    #
    # Both added flags are redis 7's compiled-in defaults, so this is BEHAVIOUR-NEUTRAL —
    # the point is that the session store's durability stops being an inherited default
    # nobody wrote down and can therefore be asserted. `--save` is deliberately NOT passed:
    # any --save on the command line REPLACES the built-in snapshot set, so restating it is
    # the one way to accidentally weaken the RDB copy that backs up the AOF. `maxmemory`
    # stays 0/unlimited: with noeviction a full redis fails WRITES (no new logins mint),
    # which is a product call (§16), not a devops one.
    #
    # `docker compose down -v`, `docker volume rm ..._badabhai_redisdata`, or bringing this
    # box up under a different compose project name all defeat every line above — the volume
    # is the durability, these flags only protect what is in it. The deploy asserts this
    # config is actually live on the box before it recreates the api (.github/workflows/ci.yml).
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    # CD-1a: bind the published port to LOOPBACK, never 0.0.0.0. This redis runs with
    # NO password (no `requirepass`), and on the staging box it is the REAL redis
    # (owner decision: box-local, not managed) holding worker sessions, the OTP
    # rate-limit counters and the SMS kill-switch counters — on a box that also holds
    # REAL Fast2SMS credentials. A 0.0.0.0 publish would put that on the public
    # internet: docker inserts its DNAT rules into iptables ahead of ufw, so a
    # "ufw deny 6379" does NOT protect a published port.
    #
    # This MUST live in the BASE file, not the staging overlay: compose keys `ports`
    # by {ip, target, published, protocol} and APPENDS entries whose key differs, so
    # an overlay adding "127.0.0.1:6379:6379" would NOT remove a base "6379:6379" —
    # BOTH binds would survive and the 0.0.0.0 exposure would remain. (compose-spec
    # 13-merge.md "Unique resources"; verified with `docker compose config`.)
    #
    # Host tools must use 127.0.0.1:6379, NOT localhost:6379. This bind is IPv4-only.
    #
    # The mechanism is a TIMEOUT MARGIN, not unreachability, and the distinction is why
    # this took so long to see. On a dual-stack host `localhost` tries ::1 first, waits
    # for that to be refused, and only then falls back to IPv4 — so it DOES connect, it
    # just costs the refusal first. Measured 2026-08-21 on this box:
    #
    #     localhost   connects in 2.061s   (::1 refused first, then IPv4)
    #     127.0.0.1   connects in 0.001s
    #     ::1         refused    in 2.054s
    #
    # `_REDIS_TIMEOUT_SECONDS = 2.0` in app/ai/cost_tracker.py. So `localhost` misses the
    # SpendLedger's budget by ~61ms, the ledger fails CLOSED (correctly), and every real
    # AI call is blocked while a healthy redis container sits right there. Nothing in the
    # logs says "slow"; it says spend_store_unavailable.
    #
    # This comment previously claimed host tools could use localhost:6379.
    #
    # The api container is unaffected: it reaches redis over the compose network at
    # redis:6379 — published ports are host->container only and play no part in
    # container->container.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - badabhai_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Lightweight DB UI. Optional — remove if not needed.
  adminer:
    image: adminer:4
    container_name: badabhai-adminer
    restart: unless-stopped
    # R38 — LOOPBACK. This is a full database admin console, and it was the most exposed
    # thing on the box: reachable on every interface, fronted only by the security group.
    # It has no production purpose whatsoever; the ideal end state is that it does not run
    # outside a developer laptop. Same base-file-only reasoning as postgres/redis above.
    # Reach it from a remote host over an SSH tunnel (`ssh -L 8080:localhost:8080 <box>`),
    # never by publishing it.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ---- Optional: the API with the WeasyPrint resume-render pipeline ENABLED ----
  # NOT started by `docker compose up` / `pnpm db:up` — it is guarded by a compose
  # profile, so it only comes up when you ask for it explicitly. This is the local
  # way to make the resume PDF download actually work (WeasyPrint runs INSIDE this
  # Linux container, so it renders even on a Windows host — unlike bare `pnpm dev`).
  #
  #   pnpm db:up && pnpm db:migrate                 # postgres+redis + schema
  #   export SUPABASE_URL=...  SUPABASE_SERVICE_ROLE_KEY=...   # your project; PRIVATE worker-resumes bucket must exist
  #   docker compose --profile api up --build api
  #
  # Full runbook + bucket provisioning: docs/resume-pdf-render-local.md
  api:
    # Also under the TD25a proxy-harness profile so `--profile proxy-harness up`
    # brings the API up behind the harness nginx. Plain `up` / `pnpm db:up` still
    # never start it.
    profiles: ["api", "proxy-harness"]
    image: ${API_IMAGE:-badabhai-api:latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: badabhai-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      # NODE_ENV=development keeps the dev-default PII/JWT/admin config guards happy
      # (the Dockerfile sets production). DEV-ONLY container — NOT production-safe
      # (dev secrets); a staging image must supply real PII/JWT/admin secrets.
      NODE_ENV: development
      # Overridable so the API container can target the real (Supabase) DB; defaults
      # to the compose-internal postgres. `:-` not `:?` — see the SUPABASE_URL note.
      DATABASE_URL: ${DATABASE_URL:-postgresql://badabhai:badabhai@postgres:5432/badabhai}
      REDIS_URL: redis://redis:6379
      # Boot guards require these present, but the render path never sends SMS/email —
      # dummy values satisfy the guards. `PAYER_LOGIN_METHOD=whatsapp` avoids needing
      # real ZeptoMail email creds just to boot.
      FAST2SMS_API_KEY: ${FAST2SMS_API_KEY:-dev-dummy}
      FAST2SMS_SENDER_ID: ${FAST2SMS_SENDER_ID:-BBHAII}
      FAST2SMS_DLT_TEMPLATE_ID: ${FAST2SMS_DLT_TEMPLATE_ID:-0000000000000000000}
      PAYER_LOGIN_METHOD: whatsapp
      # ---- Resume PDF render (the point of this service) ----
      RESUME_RENDER_ENABLED: "true"
      RESUMES_BUCKET: ${RESUMES_BUCKET:-worker-resumes}
      # REQUIRED for rendering — your Supabase project + a PRIVATE `worker-resumes`
      # bucket. Left as empty defaults (NOT `${..:?}`) on purpose: compose interpolates
      # the WHOLE file before profile filtering, so a `:?` here would break plain
      # `pnpm db:up` for anyone without these set. Instead the API fails closed at the
      # first render ("Supabase Storage is not configured") — which only happens under
      # `--profile api`. Export these before `docker compose --profile api up`.
      # See docs/resume-pdf-render-local.md.
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token}
      # TD25a — trust-proxy hop count for the reverse-proxy harness below. Default 0
      # (fail-safe, same as the config schema): req.ip = socket peer, XFF ignored.
      # Set to 1 when running behind the harness nginx (the correct single-hop value):
      #   TRUST_PROXY_HOP_COUNT=1 docker compose --profile proxy-harness up --build
      # A hop COUNT, never a blanket `true` — see infra/docker/proxy-harness/README.md.
      TRUST_PROXY_HOP_COUNT: ${TRUST_PROXY_HOP_COUNT:-0}
      # TD81(a) — point the API at the compose ai-service instead of its own
      # localhost. The schema default is http://localhost:8000
      # (packages/config/src/server.ts), which INSIDE this container is the api
      # itself: nothing listens there, the AI call fails, and the API degrades to
      # its safe TypeScript mock (real_call=false) — silently, because that
      # fallback is a deliberate fail-safe and never turns anything red. The
      # compose-network name is the only value that can be right for a container.
      # No regression when the ai-service is NOT up (e.g. `--profile api up api`,
      # which names one service): the connection fails the same way it does today
      # and the same mock fallback applies. Overridable so the api container can be
      # pointed at a host-run `uvicorn app.main:app` during AI development.
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      # TD67 — the ONE service-level bearer for the ai-service's routes. VALUELESS
      # ON PURPOSE (the compose "pass-through" form): the value is taken from the
      # host environment and, when absent there, the variable is NOT SET in the
      # container at all. It must NOT be written as `${AI_INTERNAL_TOKEN:-}`, which
      # would hand the container an EMPTY STRING — and empty is not "unset" for
      # either side of this seam: the api's Zod is `z.string().min(16).optional()`
      # (an empty string is a PRESENT string, so it fails min(16) and
      # loadServerConfig throws at boot) and the ai-service's is
      # `Field(default=None, min_length=16)` (same rejection at Settings()). A
      # `:-` default would therefore crash-loop BOTH services the moment either
      # gained this line. Set it on BOTH sides or NEITHER: a half-flip makes every
      # api→ai call 401 and the API "degrades to mock, logged at ERROR" — TD81's
      # own failure class. Never a committed value.
      AI_INTERNAL_TOKEN:

  # ---- Optional: the FastAPI AI service (pseudonymization gateway) ----
  # TD81(a). NOT started by `docker compose up` / `pnpm db:up` — profile-gated,
  # exactly like the api. It joins the SAME profiles as the api (so
  # `docker compose --profile api up` brings the pair up together and the
  # AI_SERVICE_URL above actually resolves) plus its own `ai-service` profile for
  # working on the Python side alone:
  #
  #   docker compose --profile ai-service up --build ai-service   # just this service
  #   docker compose --profile api up --build                     # api + ai-service + deps
  #   curl localhost:8000/health                                  # loopback-published below
  #
  # Naming it in the SAME profiles as the api is load-bearing for the deploy, not
  # just convenience: `docker compose --profile api pull ai-service` must resolve
  # on the box, and relying on compose's "explicitly-targeted services enable
  # their own profile" behaviour would be a version bet — docker-compose.staging.yml
  # records that the box's compose version is NOT verified.
  ai-service:
    profiles: ["ai-service", "api", "proxy-harness"]
    image: ${AI_SERVICE_IMAGE:-badabhai-ai-service:latest}
    build:
      # Context is apps/ai-service, NOT the repo root — the service has no
      # workspace dependencies, so it needs none of the monorepo. See the header
      # of apps/ai-service/Dockerfile; apps/ai-service/.dockerignore applies.
      context: apps/ai-service
      dockerfile: Dockerfile
    container_name: badabhai-ai-service
    restart: unless-stopped
    # NO depends_on, and that is deliberate: this service is DB-FREE by design
    # (the api runs every authorized query — see the skill_store seam in
    # app/config.py) and its only optional store, the TD27 spend ledger, is
    # constructed lazily and FAILS CLOSED, so postgres/redis are not preconditions
    # for it to boot. It also keeps `up -d --no-deps ai-service` on the box
    # trivially honest. The api likewise does NOT depends_on this service: an
    # unreachable ai-service must degrade to the mock, never block the API's boot.
    ports:
      # CD-1a precedent, applied before it can bite: bind the published port to
      # LOOPBACK, never 0.0.0.0. This container answers /pseudonymize and the
      # profiling/extraction routes, and TD67's service token is UNSET by default
      # (open posture) — a 0.0.0.0 publish would put an unauthenticated AI surface
      # on the public internet on the staging box, and a `ufw deny 8000` would NOT
      # save it (docker's DNAT rules land ahead of ufw).
      #
      # Like redis, this MUST live in the BASE file: compose keys `ports` by
      # {ip, target, published, protocol} and APPENDS entries whose key differs, so
      # an overlay could not remove a base "8000:8000" — both binds would survive.
      # Nothing is lost: the api reaches it over the compose network at
      # ai-service:8000 (published ports play no part in container→container), and
      # the box-local deploy health-gate curls it on 127.0.0.1.
      - "127.0.0.1:8000:8000"
    environment:
      # ---- THIS IS THE DEV-LAPTOP FILE, AND REAL CALLS STAY OFF IN IT. A literal is
      # correct here: there is no box to arm and no operator procedure to honour, so
      # the value's whole job is to be unconditional. Arming it would spend real money
      # on every `docker compose up` and send worker text to a provider from a laptop.
      #
      # THE SHAPE OF THIS RULE CHANGED ON 2026-08-12 (#798) AND THE COMMENT MUST SAY SO.
      # It used to read "must STAY 'false' in every committed file", which conflated two
      # different things and is why #798 happened: the staging overlay now ships
      # `${AI_ENABLE_REAL_CALLS:-false}` — still OFF, but a SUBSTITUTION, so the box can arm
      # it with an export instead of a code change. A literal there defeated the documented
      # arming procedure; a literal HERE is correct, because there is no box to arm.
      #
      # So the surviving rule is two rules, both pinned by
      # apps/api/src/config/real-call-posture-compose.guard.test.ts: the overlay must never
      # be a bare literal, and THIS file must never be anything else.
      #
      # Real calls need GEMINI_FLASH_API_KEY as well — the config fails closed on either
      # being absent. The keys below are declared so arming is an ENV action with NO code
      # change: declared is not armed.
      AI_ENABLE_REAL_CALLS: "false"
      # Optional provider credentials — pass-through, EMPTY BY DEFAULT, never a
      # committed value. `:-` is safe for these two (unlike AI_INTERNAL_TOKEN
      # below): both are `str | None` with no length check, and "" is falsy, so an
      # empty value reads exactly as "not configured" and real calls stay blocked
      # with the reason "GEMINI_FLASH_API_KEY is not set".
      GEMINI_FLASH_API_KEY: ${GEMINI_FLASH_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # TD27 shared spend ledger. UNSET (the default) = the in-process backend,
      # which is CORRECT here because the image runs exactly ONE uvicorn worker
      # (see apps/ai-service/Dockerfile) — per-process caps and global caps are the
      # same thing at one worker. Set it (e.g. redis://redis:6379/0, this project's
      # redis) BEFORE either adding workers or flipping real calls. NOTE THE NAME:
      # AI_SPEND_REDIS_URL, never REDIS_URL — AI-ENV-1 renamed it precisely because
      # a compose `environment:` block sharing the api's REDIS_URL silently armed
      # this service against a store it does not own.
      AI_SPEND_REDIS_URL: ${AI_SPEND_REDIS_URL:-}
      # TD67 service token — VALUELESS pass-through form, for the same reason as
      # the api's entry above: `${AI_INTERNAL_TOKEN:-}` would supply "" and
      # `Field(default=None, min_length=16)` rejects an empty string at Settings(),
      # i.e. at STARTUP (deliberately — an empty token would otherwise arm the gate
      # VACUOUSLY, since compare_digest("", "") is True). Set on BOTH sides or
      # NEITHER.
      AI_INTERNAL_TOKEN:

  # ---- Optional: TD25a reverse-proxy harness (ONE honest edge hop in front of api) ----
  # NOT started by `docker compose up` / `pnpm db:up` — profile-gated. An nginx that
  # APPENDS the connecting peer to X-Forwarded-For ($proxy_add_x_forwarded_for), i.e.
  # exactly what a real single-hop LB does, so the TRUST_PROXY_HOP_COUNT failure modes
  # (hop=0 shared-bucket collapse; hop-too-high forged-XFF identity) can be reproduced
  # locally. Runbook + two-client QA scenario + hop→topology table:
  #   infra/docker/proxy-harness/README.md
  proxy:
    profiles: ["proxy-harness"]
    image: nginx:1.27-alpine
    container_name: badabhai-proxy-harness
    restart: unless-stopped
    depends_on:
      - api
    # R38 — LOOPBACK. A test harness, profile-gated so it does not start by default, but a
    # bare bind would still publish it on every interface the moment anyone enabled the
    # profile. Cheap to make un-exposable now rather than after someone does.
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./infra/docker/proxy-harness/nginx.conf:/etc/nginx/nginx.conf:ro

  # ---- Optional: local mail catcher (ADR-0038 — makes the admin login gate runnable) ----
  # NOT started by `docker compose up` / `pnpm db:up` — profile-gated, like api/ai-service.
  #
  #   pnpm mail:up          # start it
  #   open http://localhost:8025            # read every message the API sends
  #
  # WHY THIS EXISTS. `EMAIL_PROVIDER` is REAL-ONLY: zeptomail | smtp | auto, with no mock
  # or console arm anywhere (packages/config/src/server.ts). That is the right default —
  # a console-printing email channel is one env var away from being a production account
  # takeover. But it left the ADR-0038 admin login with NO local path at all: the admin
  # one-time code is delivered by email and by nothing else, so without a transport the
  # foundation-verification gate cannot even be attempted. Setting
  # `PAYER_LOGIN_METHOD=whatsapp` (as the api service above does) only dodges the BOOT
  # guard — the admin send still fails, opaquely, at delivery time.
  #
  # Mailpit is a real SMTP server. The API takes its ordinary `EMAIL_PROVIDER=smtp` path,
  # nodemailer really connects, and the message is really delivered — it is just delivered
  # HERE instead of to the internet. So the thing being verified is the production code
  # path, not a test double.
  #
  # NOT sandbox mode: ZEPTOMAIL_SANDBOX_MODE exercises the full request but deliberately
  # does NOT deliver, so there is no message to read the code out of.
  #
  # DEV ONLY. It accepts anything, authenticates nobody and stores mail in memory. Both
  # ports are LOOPBACK-bound (CD-1a): an inbox holding one-time login codes must never be
  # reachable off the box.
  mailpit:
    profiles: ["mail", "api"]
    image: axllent/mailpit:v1.21
    container_name: badabhai-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:1025:1025" # SMTP  — point SMTP_HOST/SMTP_PORT here
      - "127.0.0.1:8025:8025" # web UI — read the delivered code

volumes:
  badabhai_pgdata:
  badabhai_redisdata:
